[tools]
terraform = "1.15.9"
go-jsonnet = "0.22.0"

[tasks.jsonnet-fmt]
description = "Format Jsonnet files"
run = """
echo "Formatting Jsonnet files..."
find k8s \\( -name '*.jsonnet' -o -name '*.libsonnet' \\) -type f | xargs jsonnetfmt -i
"""

[tasks.jsonnet-fmt-check]
description = "Check Jsonnet format"
run = """
echo "Checking Jsonnet format..."
find k8s \\( -name '*.jsonnet' -o -name '*.libsonnet' \\) -type f | xargs jsonnetfmt --test
"""

[tasks.terraform]
run = "terraform -chdir=terraform"

[tasks."argocd-agent:restart"]
description = "Restart an Argo CD Agent after its TLS Secret is renewed"
run = "bash scripts/argocd-agent-restart.sh"

[tasks."cluster:decommission"]
description = "Remove the biscuit CAPI and Argo CD Agent bootstrap resources"
run = "bash scripts/cluster-decommission.sh"
