[tools]
go = "1.27.4"
dyff = "1.12.0"
kubeconform = "0.8.0"
terraform = "1.16.6"
go-jsonnet = "0.22.0"
tanka = "0.40.1"
jsonnet-bundler = "0.6.0"
coder = "2.38.5"
kubectl = "1.37.2"
trivy = "0.76.0"
"go:github.com/grafana/mcp-grafana/v2/cmd/mcp-grafana" = "v2.0.2"
"go:github.com/szhekpisov/diffyml" = "v1.8.2"
"pipx:sarif-tools" = "3.0.5"
jactionlint = "2.4.0"

[env]
_.file = { path = ".env", redact = true }

[tasks."build:infrautil"]
description = "Build infrautil"
dir = "scripts/infrautil"
run = "go build -o infrautil ."

[tasks."gen:namespace"]
description = "Generate namespaces.json5"
depends = ["build:infrautil"]
run = "scripts/infrautil/infrautil namespace -d ./k8s/apps -o ./k8s/namespaces/namespaces.json5"

[tasks."snapshot"]
description = "Take snapshots"
depends = ["snapshot:app", "snapshot:helm"]

[tasks."snapshot:app"]
description = "Take app snapshot"
depends = ["build:infrautil"]
run = "scripts/infrautil/infrautil snapshot -d ./k8s/apps -o ./k8s/snapshots/apps"

[tasks."snapshot:helm"]
description = "Take helm snapshot"
depends = ["snapshot:app"]
run = "scripts/infrautil/infrautil helm-snapshot -d ./k8s/snapshots/apps -o ./k8s/snapshots/helm"

[tasks."fmt:jsonnet"]
description = "Format Jsonnet files"
run = """
echo "Formatting Jsonnet files..."
find k8s \\( -name '*.jsonnet' -o -name '*.libsonnet' \\) -type f | xargs jsonnetfmt -i
"""

[tasks."fmt:jsonnet:check"]
description = "Check Jsonnet format"
run = """
echo "Checking Jsonnet format..."
find k8s \\( -name '*.jsonnet' -o -name '*.libsonnet' \\) -type f | xargs jsonnetfmt --test
"""

[tasks."lint:k8s"]
description = "Lint k8s apps"
depends = ["snapshot"]
run = "kubeconform -ignore-missing-schemas -strict -summary k8s/snapshots/apps"

[tasks."lint:gha"]
description = "Lint GitHub Actions workflows"
run = "jactionlint"

[tasks."terraform"]
run = "terraform -chdir=terraform"

[tasks."network:render"]
description = "Render network configurations with 1Password"
run = '''
set -eu
umask 077

command -v op >/dev/null 2>&1 || {
  printf '%s\n' "1Password CLI (op) is required" >&2
  exit 1
}

stage="$(mktemp -d network/.generated.XXXXXX)"
cleanup() {
  if [ -n "${stage:-}" ] && [ -d "$stage" ]; then
    rm -rf -- "$stage"
  fi
}
trap cleanup EXIT HUP INT TERM

mkdir -p "$stage/vanilla" "$stage/caramel" "$stage/nexus3548" "$stage/almond"

op inject -i network/vanilla/config.boot.tpl -o "$stage/vanilla/config.boot"
op inject -i network/caramel/config.tpl -o "$stage/caramel/config"
op inject -i network/nexus3548/config.tpl -o "$stage/nexus3548/config"
op inject -i network/almond/config.tpl -o "$stage/almond/config"
op run --no-masking --env-file network/vanilla/v6plus-fcs.env.tpl -- \
  bash -c 'printf "FCS_USER=%q\nFCS_PASS=%q\n" "$FCS_USER" "$FCS_PASS"' > "$stage/vanilla/v6plus-fcs.env"

rm -rf -- network/.generated
mv -- "$stage" network/.generated
stage=""
'''
