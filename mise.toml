[tools]
terraform = "1.15.9"
go-jsonnet = "0.22.0"
kubeconform = "0.8.0"

[tasks.jsonnet-check]
description = "Evaluate Jsonnet and JSON5 sources"
run = "scripts/validate-jsonnet.sh --check-only"

[tasks.jsonnet-fmt]
description = "Format Jsonnet files"
run = """
echo "Formatting Jsonnet files..."
find k8s \\( -name '*.jsonnet' -o -name '*.libsonnet' \\) -type f | xargs jsonnetfmt -i
"""

[tasks.jsonnet-fmt-check]
description = "Check Jsonnet format"
run = """
echo "Checking Jsonnet format..."
find k8s \\( -name '*.jsonnet' -o -name '*.libsonnet' \\) -type f | xargs jsonnetfmt --test
"""

[tasks.lint]
description = "Render and validate Kubernetes resources"
depends = ["jsonnet-check"]
run = "scripts/validate-jsonnet.sh"

[tasks.terraform]
run = "terraform -chdir=terraform"
