name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          install_args: go go-jsonnet kubeconform trivy jactionlint

      - parallel:
          - name: Check Jsonnet format
            run: mise run fmt:jsonnet:check

          - name: Lint GitHub Actions workflows
            run: mise run lint:gha

      - name: Generate snapshots
        run: mise run snapshot

      - name: Validate application manifests
        run: kubeconform -ignore-missing-schemas -strict -summary k8s/snapshots/apps

      - name: Upload snapshots
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snapshots
          path: k8s/snapshots
          if-no-files-found: error
          retention-days: 1

  publish-snapshot:
    name: Publish snapshot branch
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    if: github.ref == 'refs/heads/main'
    needs:
      - quality
    permissions:
      contents: read
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: generate-token
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}
          permission-contents: write

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.generate-token.outputs.token }}

      - name: Download snapshots
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: snapshots
          path: k8s/snapshots

      - name: Prepare snapshot branch content
        run: |
          git switch -C snapshot
          rm -rf k8s/apps k8s/helm
          mv k8s/snapshots/apps k8s/apps
          mv k8s/snapshots/helm k8s/helm

      - uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
        with:
          branch: snapshot
          commit_message: snapshot
          file_pattern: "k8s/apps k8s/helm"
          add_options: --all
          push_options: --force
          skip_fetch: true
          skip_checkout: true

  snapshot-diff:
    name: Comment snapshot diff
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    needs: quality
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out snapshot base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: snapshot
          path: snapshot-base
          persist-credentials: false

      - name: Download snapshots
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: snapshots
          path: k8s/snapshots

      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          install_args: go go:github.com/szhekpisov/diffyml

      - name: Compare rendered manifests
        run: |
          set -euo pipefail
          render() {
            title="$1"; base="$2"; head="$3"; out="$4"; shift 4
            body="$(mktemp)"
            diffyml -o compact "$@" "$base" "$head" > "$body"
            {
              printf '# %s\n\n```\n' "$title"
              if [ -s "$body" ]; then
                head -c 56000 "$body"
              else
                printf '変更なし\n'
              fi
              printf '\n```\n'
            } > "$out"
            rm -f "$body"
          }
          render 'Manifest (k8s/apps) diff' snapshot-base/k8s/apps k8s/snapshots/apps /tmp/manifest-diff.md
          render 'Helm diff' snapshot-base/k8s/helm k8s/snapshots/helm /tmp/helm-diff.md \
            --exclude 'metadata.labels[app.kubernetes.io/version]' \
            --exclude 'metadata.labels[helm.sh/chart]' \
            --exclude 'metadata.labels[chart]' \
            --exclude 'spec.compliance.controls'

      - name: Comment manifest diff
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: manifest-diff
          path: /tmp/manifest-diff.md

      - name: Comment Helm diff
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: helm-diff
          path: /tmp/helm-diff.md

  trivy:
    name: Comment Trivy findings
    runs-on: ubuntu-slim
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    needs: quality
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out snapshot base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: snapshot
          path: snapshot-base
          persist-credentials: false

      - name: Download snapshots
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: snapshots
          path: k8s/snapshots

      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          install_args: trivy pipx:sarif-tools

      - name: Compare Trivy SARIF reports
        run: |
          set -euo pipefail
          work=/tmp/sarif-work
          mkdir -p "$work/base/manifests" "$work/head/manifests"
          cp -r snapshot-base/k8s/apps snapshot-base/k8s/helm "$work/base/manifests/"
          cp -r k8s/snapshots/apps k8s/snapshots/helm "$work/head/manifests/"
          for f in snapshot-base/trivy.yaml snapshot-base/.trivyignore.yaml; do
            [ -f "$f" ] || { echo "::error::ベースブランチのTrivyポリシーファイルが存在しません: $f"; exit 1; }
          done
          export TRIVY_CONFIG=snapshot-base/trivy.yaml TRIVY_IGNOREFILE=snapshot-base/.trivyignore.yaml
          trivy config --exit-code 0 --format sarif --output "$work/base.sarif" "$work/base/manifests"
          trivy config --exit-code 0 --format sarif --output "$work/head.sarif" "$work/head/manifests"
          # `--output`指定時は標準出力に差分の詳細が出力されないため、コメント用テキストとJSONを別々に取得する。
          sarif diff "$work/base.sarif" "$work/head.sarif" > "$work/diff-body.txt"
          sarif diff --output "$work/diff.json" "$work/base.sarif" "$work/head.sarif" > /dev/null
          {
            printf '## Trivy security changes\n\n'
            printf '```\n'
            # all levelsの件数表示だけでは変更有無を判定できないため、増減の記述の有無で判定する。
            if grep -qE 'New issue|Eliminated issue|Number of occurrences' "$work/diff-body.txt"; then
              head -c 50000 "$work/diff-body.txt"
            else
              printf '変更なし\n'
            fi
            printf '\n```\n'
          } > /tmp/trivy-comment.md

      - name: Upload SARIF reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-sarif
          path: |
            /tmp/sarif-work/base.sarif
            /tmp/sarif-work/head.sarif
            /tmp/sarif-work/diff.json
          if-no-files-found: error
          retention-days: 1

      - name: Update Trivy findings comment
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: trivy-config-findings
          path: /tmp/trivy-comment.md

  status-check:
    runs-on: ubuntu-slim
    timeout-minutes: 1
    # skipped は成功として扱われる
    if: failure()
    needs:
      - quality
      - publish-snapshot
    permissions: {}
    steps:
      - run: exit 1
