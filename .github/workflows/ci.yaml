name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    outputs:
      snapshot-diff-ready: ${{ steps.upload-snapshot-diff.outcome == 'success' }}
      trivy-diff-ready: ${{ steps.upload-trivy-diff.outcome == 'success' }}
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          install_args: go go-jsonnet kubeconform trivy jactionlint dyff

      - name: Check Jsonnet format
        run: mise run jsonnet-fmt-check

      - name: Lint GitHub Actions workflows
        run: mise run github-actions-lint

      - name: Generate snapshots
        run: mise run snapshot

      - name: Check out snapshot base
        id: snapshot-base
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: snapshot
          path: snapshot-base
          persist-credentials: false

      - name: Validate application manifests
        run: kubeconform -ignore-missing-schemas -strict -summary k8s/snapshots/apps

      - name: Scan rendered manifests with Trivy
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" && \
            -f snapshot-base/trivy.yaml && -f snapshot-base/.trivyignore.yaml ]]; then
            TRIVY_CONFIG=snapshot-base/trivy.yaml \
            TRIVY_IGNOREFILE=snapshot-base/.trivyignore.yaml \
              mise run trivy-config-report
          else
            if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
              echo "::warning::The main Trivy policy was unavailable; using the pull request policy."
            fi
            mise run trivy-config-report
          fi

      - name: Upload snapshots
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snapshots
          path: k8s/snapshots
          if-no-files-found: error
          retention-days: 1

      - name: Build snapshot diff artifacts
        id: build-snapshot-diff
        if: github.event_name == 'pull_request' && steps.snapshot-base.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          overall_failed=0

          # Writes the finished Markdown to $5; returns nonzero on any failure
          # so callers can distinguish "no diff" from "diff broken".
          render_dir() {
            local head_dir="$1" base_dir="$2" out_title="$3" dyff_extra="$4" out_file="$5"
            local tmp raw failed rel base_file head_file diff_one
            tmp="$(mktemp -d)"
            raw="$tmp/body.md"
            failed=0
            if [ ! -d "$head_dir" ]; then
              echo "::error::Head snapshot directory missing: $head_dir"
              failed=1
            fi
            if [ ! -d "$base_dir" ]; then
              echo "::error::Base snapshot directory missing: $base_dir"
              failed=1
            fi
            if [ "$failed" -eq 0 ]; then
              find "$head_dir" -type f | sort | sed "s|^$head_dir/||" > "$tmp.head" || failed=1
              find "$base_dir" -type f | sort | sed "s|^$base_dir/||" > "$tmp.base" || failed=1
            fi
            : > "$raw"
            if [ "$failed" -eq 0 ]; then
              comm -23 "$tmp.base" "$tmp.head" | while IFS= read -r rel; do
                printf 'deleted: %s\n' "$rel"
              done >> "$raw"
              comm -13 "$tmp.base" "$tmp.head" | while IFS= read -r rel; do
                printf 'added: %s\n' "$rel"
              done >> "$raw"
              while IFS= read -r rel; do
                base_file="${base_dir}/${rel}"
                head_file="${head_dir}/${rel}"
                # shellcheck disable=SC2086
                if ! diff_one="$(dyff between --output github $dyff_extra "$base_file" "$head_file" 2>&1)"; then
                  echo "::warning::dyff failed for ${rel}"
                  printf 'dyff failed for %s:\n%s\n' "$rel" "$diff_one" >> "$raw"
                  echo FAILED > "$tmp.failed"
                else
                  printf '%s\n' "$diff_one" >> "$raw"
                fi
              done < <(comm -12 "$tmp.base" "$tmp.head")
              [ ! -f "$tmp.failed" ] || failed=1
            fi
            # Truncate the body on disk first: no pipe consumer can SIGPIPE us.
            if [ "$(wc -c < "$raw")" -gt 56000 ]; then
              head -c 56000 "$raw" > "$tmp/snippet"
              truncated=1
            else
              cp "$raw" "$tmp/snippet"
              truncated=0
            fi
            {
              printf '%s\n' "# ${out_title}" '' '<details>' '<summary>Click to expand</summary>' '' '```diff'
              cat "$tmp/snippet"
              printf '%s\n' '```' '</details>'
              if [ "$truncated" -ne 0 ]; then
                printf '\n%s\n' '(truncated: diff too large to display fully)'
              fi
              if [ "$failed" -ne 0 ]; then
                printf '\n%s\n' '> :warning: Diff generation partially failed; results may be incomplete.'
              fi
            } > "$out_file"
            rm -rf "$tmp"
            return "$failed"
          }

          render_dir k8s/snapshots/apps snapshot-base/k8s/apps 'Manifest (k8s/apps) diff' '' /tmp/manifest-diff.md || overall_failed=1
          render_dir k8s/snapshots/helm snapshot-base/k8s/helm 'Helm diff' '--exclude-regexp .metadata.labels.app.kubernetes.io/version|.metadata.labels.chart|.metadata.labels.helm.sh/chart|\.spec\.compliance\.controls' /tmp/helm-diff.md || overall_failed=1
          echo "ready=true" >> "$GITHUB_OUTPUT"
          if [ "$overall_failed" -ne 0 ]; then
            echo "::warning::Snapshot diff generation partially failed; see comments for details."
          fi

      - name: Compare Trivy findings with snapshot branch
        id: build-trivy-diff
        if: github.event_name == 'pull_request' && steps.snapshot-base.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p /tmp/trivy-snapshot-base
          cp -a snapshot-base/k8s/apps snapshot-base/k8s/helm /tmp/trivy-snapshot-base/
          if ! TRIVY_CONFIG=snapshot-base/trivy.yaml \
            TRIVY_IGNOREFILE=snapshot-base/.trivyignore.yaml \
              trivy config --exit-code 0 --format json \
              --output /tmp/trivy-snapshot-base.json /tmp/trivy-snapshot-base; then
            printf '%s\n' '## New Trivy config findings' '' \
              ':warning: Base snapshot rescan failed; diff is unavailable.' > /tmp/trivy-config-diff.md
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "findings-added=false" >> "$GITHUB_OUTPUT"
            # continue-on-error keeps this non-blocking, but the failed step
            # stays visible instead of looking like a clean comparison.
            exit 1
          fi
          python3 scripts/trivy-config-diff.py \
            --base-report /tmp/trivy-snapshot-base.json \
            --head-report k8s/trivy-config-report.json \
            --base-dir /tmp/trivy-snapshot-base \
            --head-dir k8s/snapshots \
            --markdown-output /tmp/trivy-config-diff.md \
            --github-output "$GITHUB_OUTPUT"

      - name: Upload Trivy findings diff
        id: upload-trivy-diff
        if: steps.build-trivy-diff.outputs.ready == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-config-diff
          path: /tmp/trivy-config-diff.md
          if-no-files-found: error
          retention-days: 1

      - name: Upload snapshot diff artifacts
        id: upload-snapshot-diff
        if: steps.build-snapshot-diff.outputs.ready == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snapshot-diffs
          path: |
            /tmp/manifest-diff.md
            /tmp/helm-diff.md
          if-no-files-found: error
          retention-days: 1

  publish-snapshot:
    name: Publish snapshot branch
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    if: github.ref == 'refs/heads/main'
    needs:
      - quality
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: generate-token
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}
          permission-contents: write

      - name: Download snapshots
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: snapshots
          path: k8s/snapshots

      - name: Update snapshot branch
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |
          gh auth setup-git
          git switch --force-create snapshot
          rm -rf k8s/apps k8s/helm
          mv k8s/snapshots/apps k8s/apps
          mv k8s/snapshots/helm k8s/helm
          git add --all -- k8s/apps k8s/helm

          if git diff --cached --quiet; then
            echo "Snapshot branch is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "snapshot"
          git push origin snapshot --force

  snapshot-diff:
    name: Comment snapshot diff
    runs-on: ubuntu-slim
    timeout-minutes: 10
    if: github.event_name == 'pull_request' && needs.quality.outputs.snapshot-diff-ready == 'true'
    needs: quality
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Download snapshot diff artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: snapshot-diffs
          path: diffs

      - name: Comment manifest diff
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: manifest-diff
          path: diffs/manifest-diff.md

      - name: Comment Helm diff
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: helm-diff
          path: diffs/helm-diff.md

  trivy-findings-comment:
    name: Comment Trivy findings
    runs-on: ubuntu-slim
    timeout-minutes: 5
    if: github.event_name == 'pull_request' && needs.quality.outputs.trivy-diff-ready == 'true'
    needs: quality
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Download Trivy findings diff
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: trivy-config-diff
          path: trivy-diff

      - name: Update Trivy findings comment
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: trivy-config-findings
          path: trivy-diff/trivy-config-diff.md

  status-check:
    runs-on: ubuntu-slim
    timeout-minutes: 1
    if: always()
    needs:
      - quality
      - publish-snapshot
    permissions: {}
    steps:
      - name: Verify required jobs
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          SNAPSHOT_RESULT: ${{ needs.publish-snapshot.result }}
          SNAPSHOT_REQUIRED: ${{ github.ref == 'refs/heads/main' }}
        run: |
          if [[ "$QUALITY_RESULT" != "success" ]]; then
            echo "Quality checks did not succeed: ${QUALITY_RESULT}"
            exit 1
          fi

          if [[ "$SNAPSHOT_REQUIRED" == "true" && "$SNAPSHOT_RESULT" != "success" ]]; then
            echo "Snapshot publishing did not succeed: ${SNAPSHOT_RESULT}"
            exit 1
          fi
