name: Build Images
on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-images.yaml"
      - "docker-bake.hcl"
      - "images/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  select:
    name: Select images
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      targets: ${{ steps.filter.outputs.targets }}
      has_targets: ${{ steps.filter.outputs.has_targets }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Generate matrix from Bake definition
        id: bake-matrix
        uses: docker/bake-action/subaction/matrix@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          files: docker-bake.hcl
          target: default

      - name: Filter targets by changed files
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          WORKFLOW_FILE: .github/workflows/build-images.yaml
        run: |
          set -euo pipefail
          all_targets="$(jq -c '[.[].target]' <<< '${{ steps.bake-matrix.outputs.matrix }}')"

          # Fail-safe: any comparison problem builds everything, never "no change".
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "targets=${all_targets}" >> "$GITHUB_OUTPUT"
            echo "has_targets=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$BEFORE_SHA" ] || printf '%s' "$BEFORE_SHA" | grep -Eq '^0+$'; then
            echo "targets=${all_targets}" >> "$GITHUB_OUTPUT"
            echo "has_targets=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            echo "targets=${all_targets}" >> "$GITHUB_OUTPUT"
            echo "has_targets=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! changed="$(git diff --name-only "$BEFORE_SHA" "$HEAD_SHA")"; then
            echo "targets=${all_targets}" >> "$GITHUB_OUTPUT"
            echo "has_targets=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$changed" ]; then
            echo "targets=[]" >> "$GITHUB_OUTPUT"
            echo "has_targets=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if printf '%s\n' "$changed" | grep -Fxq "docker-bake.hcl" || \
             printf '%s\n' "$changed" | grep -Fxq "$WORKFLOW_FILE"; then
            echo "targets=${all_targets}" >> "$GITHUB_OUTPUT"
            echo "has_targets=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Image dirs changed in this push, validated to avoid path injection.
          dirs="$(printf '%s\n' "$changed" | awk -F/ '$1 == "images" && NF >= 2 {print $2}' | sort -u | grep -E '^[a-z0-9]+([._-][a-z0-9]+)*$' || true)"
          if [ -z "$dirs" ]; then
            echo "targets=[]" >> "$GITHUB_OUTPUT"
            echo "has_targets=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          wanted="$(jq -Rc . <<< "$dirs" | jq -cs .)"
          filtered="$(jq -c --argjson wanted "$wanted" 'map(select(. as $t | $wanted | index($t)))' <<< "$all_targets")"
          if [ "$filtered" = "[]" ]; then
            echo "targets=[]" >> "$GITHUB_OUTPUT"
            echo "has_targets=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "targets=${filtered}" >> "$GITHUB_OUTPUT"
          echo "has_targets=true" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}
    needs: select
    if: needs.select.outputs.has_targets == 'true'
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.select.outputs.targets) }}
    # NOTE: one reusable-workflow call per Bake target (no groups / multi-target).
    # Tags v1.0.<run_number> + latest are applied to the final manifest index.
    # Reruns reuse the same run_number, so a rerun overwrites the same tags.
    uses: docker/github-builder/.github/workflows/bake.yml@58cb9f5b71b1836d6f690c1e95effdeb9b98cb8a # v1.17.0
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      files: docker-bake.hcl
      target: ${{ matrix.target }}
      output: image
      push: true
      cache: true
      meta-images: ghcr.io/walnuts1018/infra/${{ matrix.target }}
      meta-tags: |
        type=raw,value=latest
        type=raw,value=v1.0.${{ github.run_number }}
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
