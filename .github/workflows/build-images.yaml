name: Build Images
on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-images.yaml"
      - "docker-bake.hcl"
      - "images/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  select:
    name: Select images
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      targets: ${{ steps.select.outputs.targets }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Generate matrix from Bake definition
        id: bake-matrix
        uses: docker/bake-action/subaction/matrix@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          files: docker-bake.hcl
          target: default

      - name: Detect changes
        id: changed
        if: github.event_name == 'push'
        continue-on-error: true
        uses: step-security/changed-files@2e07db73e5ccdb319b9a6c7766bd46d39d304bad # v47.0.5
        with:
          files_yaml: |
            images:
              - images/**
            shared:
              - docker-bake.hcl
              - .github/workflows/build-images.yaml
          dir_names: true
          dir_names_max_depth: 2
          matrix: true
          fail_on_initial_diff_error: true

      - name: Select Bake targets
        id: select
        env:
          BAKE: ${{ steps.bake-matrix.outputs.matrix }}
          CHANGED: ${{ steps.changed.outputs.images_all_changed_files }}
          FULL: ${{ github.event_name == 'workflow_dispatch' || steps.changed.outcome != 'success' || steps.changed.outputs.shared_any_changed == 'true' }}
        run: |
          set -o pipefail
          jq -nc \
            --argjson bake "$BAKE" \
            --argjson changed "${CHANGED:-[]}" \
            --arg full "$FULL" '
              [$bake[].target] as $all
              | if $full == "true" then $all
                else [
                  $changed[]
                  | split("/")
                  | select(.[0] == "images")
                  | .[1]
                  | select(. as $name | $all | index($name))
                ]
                end
              | unique
            ' | jq -c '{targets: .} | "targets=\(.targets)"' -r >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}
    needs: select
    if: needs.select.outputs.targets != '[]'
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.select.outputs.targets) }}
    uses: docker/github-builder/.github/workflows/bake.yml@cbc9d42f8c89a55623392aadd03600965b80e963 # v1.18.1
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      files: docker-bake.hcl
      target: ${{ matrix.target }}
      output: image
      push: true
      cache: true
      meta-images: ghcr.io/walnuts1018/infra/${{ matrix.target }}
      meta-tags: |
        type=raw,value=v1.0.${{ github.run_number }}
        type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
