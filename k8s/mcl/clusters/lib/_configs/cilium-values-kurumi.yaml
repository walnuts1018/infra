"bgpControlPlane":
  "enabled": true
"cluster":
  "id": 1
  "name": "kurumi"
"envoy":
  "log":
    "accessLogBufferSize": 16384
  "prometheus":
    "enabled": true
    "serviceMonitor":
      "enabled": true
  "resources":
    "requests":
      "cpu": "10m"
      "memory": "51Mi"
"envoyConfig":
  "enabled": true
  "secretsNamespace":
    "create": false
    "name": "cilium-secrets"
"gatewayAPI":
  "enabled": false
"hubble":
  "metrics":
    "dashboards":
      "enabled": true
    "enableOpenMetrics": true
    "enabled":
    - "dns"
    - "drop"
    - "tcp"
    - "flow:labelsContext=source_namespace,source_workload_kind,source_workload,destination_namespace,destination_workload_kind,destination_workload,traffic_direction"
    - "flows-to-world"
    - "port-distribution"
    - "icmp"
    - "httpV2:exemplars=true;"
    "serviceMonitor":
      "enabled": true
  "relay":
    "enabled": true
    "prometheus":
      "enabled": true
      "serviceMonitor":
        "enabled": true
    "resources":
      "limits":
        "memory": "512Mi"
      "requests":
        "cpu": "5m"
        "memory": "48Mi"
  "tls":
    "auto":
      "method": "cronJob"
    "enabled": true
  "ui":
    "backend":
      "resources":
        "limits":
          "memory": "256Mi"
        "requests":
          "cpu": "5m"
          "memory": "60Mi"
    "enabled": true
    "frontend":
      "resources":
        "limits":
          "memory": "256Mi"
        "requests":
          "cpu": "1m"
          "memory": "10Mi"
"ingressController":
  "default": true
  "defaultSecretName": "cloudflare-origin-cert"
  "defaultSecretNamespace": "cilium-system"
  "enabled": true
  "enforceHttps": true
  "loadbalancerMode": "shared"
  "secretsNamespace":
    "create": false
    "name": "cilium-secrets"
    "sync": true
  "service":
    "loadBalancerIP": "192.168.12.129"
"k8sClientRateLimit":
  "burst": 20
  "qps": 10
"k8sServiceHost": "192.168.4.11"
"k8sServicePort": 6443
"kubeProxyReplacement": true
"l2announcements":
  "enabled": true
"l7Proxy": true
"nodePort":
  "enabled": true
"operator":
  "prometheus":
    "enabled": true
    "serviceMonitor":
      "enabled": true
  "replicas": 1
  "resources":
    "limits":
      "memory": "512Mi"
    "requests":
      "cpu": "10m"
      "memory": "60Mi"
"prometheus":
  "enabled": true
  "serviceMonitor":
    "enabled": true
    "trustCRDsExist": true
"resources":
  "limits":
    "memory": "2Gi"
  "requests":
    "cpu": "100m"
    "memory": "512Mi"
"tls":
  "secretsNamespace":
    "create": false
    "name": "cilium-secrets"
