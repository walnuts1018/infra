fullnameOverride: argocd-agent

principal:
  listen:
    host: ""
  log:
    format: json
  tls:
    clientCert:
      require: true
      matchSubject: true
  auth: "mtls:CN=([^,]+)"
  destinationBasedMapping: true
  labelSelector: "argocd-agent=true"
  selfRegistration:
    enabled: true
    clientCertSecretName: argocd-agent-shared-client-cert

serviceMonitor:
  enabled: false

podAnnotations:
  reloader.stakater.com/auto: "true"

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
