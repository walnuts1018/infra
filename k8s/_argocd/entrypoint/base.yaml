apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: base
  namespace: argocd
spec:
  project: berry
  destination:
    namespace: argocd
    server: https://kubernetes.default.svc
  sources:
  - path: k8s/_argocd/applications
    repoURL: 'https://github.com/walnuts1018/infra'
    targetRevision: clusterapi # TODO
    directory:
      recurse: true
  - path: k8s/_argocd/entrypoint
    repoURL: 'https://github.com/walnuts1018/infra'
    targetRevision: clusterapi # TODO
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
    - ServerSideApply=true
    - FailOnSharedResource=true
