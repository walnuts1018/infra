apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: apps-biscuit
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
  - missingkey=error
  generators:
  - matrix:
      generators:
      - git:
          repoURL: https://github.com/walnuts1018/infra
          revision: clusterapi
          files:
          - path: "k8s/apps/*/app.json5"
      - list:
          elements:
          - biscuitEnabled: '{{ hasKey (default dict .clusters) "biscuit" }}'
    selector:
      matchLabels:
        biscuitEnabled: "true"
  template:
    metadata:
      name: '{{ printf "%s-biscuit" .name }}'
      labels:
        argocd-agent: "true"
    spec:
      project: biscuit
      destination:
        name: biscuit
        namespace: '{{.namespace}}'
      sources: []
      syncPolicy:
        automated:
          selfHeal: true
          prune: true
        syncOptions:
        - ServerSideApply=true
        - FailOnSharedResource=true
        - CreateNamespace=true
  templatePatch: |
    spec:
      sources:
      - repoURL: 'https://github.com/walnuts1018/infra'
        targetRevision: clusterapi
        path: '{{.path.path}}'
        directory:
          recurse: true
          exclude: '{config/*,_*/*,values*.yaml}'
          jsonnet:
            tlas:
            {{- range $tla := dig "clusters" "biscuit" "jsonnet" "tlas" (list) . }}
            - {{ $tla | toJson }}
            {{- end }}
        ref: infra
      {{- with (dig "additionalSources" "helm" (dict) .) }}
      - repoURL: '{{ .repoURL }}'
        chart: '{{ .chart }}'
        targetRevision: '{{ .targetRevision }}'
        helm:
          releaseName: '{{ $.name }}'
          valueFiles:
          {{- range (dig "valueFiles" (list) .) }}
          - {{ printf "$infra/%s/%s" $.path.path . }}
          {{- end }}
          {{- with (dig "clusters" "biscuit" "additionalSources" "helm" "additionalValueFiles" (list) $) }}
          {{- range . }}
          - {{ printf "$infra/%s/%s" $.path.path . }}
          {{- end }}
          {{- end }}
      {{- end }}
      {{- range (dig "additionalSources" "kustomize" (list) .) }}
      - repoURL: '{{ .repoURL }}'
        path: '{{ .path }}'
        targetRevision: '{{ .targetRevision }}'
        {{- with (dig "patches" (list) .) }}
        kustomize:
          patches: {{ . | toJson }}
        {{- end }}
      {{- end }}
    {{- with (dig "annotations" (dict) .) }}
    metadata:
      annotations:
        {{- range $key, $value := . }}
        {{ $key }}: {{ $value | quote }}
        {{- end }}
    {{- end }}
