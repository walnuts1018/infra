apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: apps-berry
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  syncPolicy:
    preserveResourcesOnDeletion: true
  goTemplate: true
  generators:
  - matrix:
      generators:
      - git:
          repoURL: https://github.com/walnuts1018/infra
          revision: clusterapi
          files:
          - path: "k8s/apps/*/app.json5"
      - list:
          elements:
          - berryEnabled: '{{ hasKey (default dict .clusters) "berry" }}'
    selector:
      matchLabels:
        berryEnabled: "true"
  template:
    metadata:
      name: '{{ printf "%s-berry" .name }}'
      # annotations:
      #   argocd.argoproj.io/manifest-generate-paths: .;../components
    spec:
      project: berry
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{.namespace}}'
      sources: []
      syncPolicy:
        automated:
          selfHeal: true
          prune: true
        syncOptions:
        - ServerSideApply=true
        - FailOnSharedResource=true
        - CreateNamespace=true
  templatePatch: |
    {{- with .annotations }}
    metadata:
      annotations:
        {{- range $key, $value := . }}
        {{ $key }}: {{ $value | quote }}
        {{- end }}
    {{- end }}
    spec:
      sources:
      - repoURL: 'https://github.com/walnuts1018/infra'
        targetRevision: clusterapi
        path: '{{.path.path}}'
        directory:
          recurse: true
          exclude: '{config/*,_*/*,values*.yaml}'
          jsonnet:
            tlas:
            {{- range $tla := .clusters.berry.jsonnet.tlas }}
            - {{ $tla | toJson }}
            {{- end }}
        ref: infra
      {{- with .additionalSources.helm }}
      - repoURL: '{{ .repoURL }}'
        chart: '{{ .chart }}'
        targetRevision: '{{ .targetRevision }}'
        helm:
          releaseName: '{{ $.name }}'
          valueFiles:
          {{- range .valueFiles }}
          # - $infra/path/to/file/values.yaml
          - {{ printf "$infra/%s/%s" $.path.path . }}
          {{- end }}
          {{- with $.clusters.berry.additionalSources.helm.additionalValueFiles }}
          {{- range . }}
          - {{ printf "$infra/%s/%s" $.path.path . }}
          {{- end }}
          {{- end }}
      {{- end }}
      {{- range .additionalSources.kustomize }}
      - repoURL: '{{ .repoURL }}'
        path: '{{ .path }}'
        targetRevision: '{{ .targetRevision }}'
        {{- with .patches }}
        kustomize:
          patches: {{ . | toJson }}
        {{- end }}
      {{- end }}
