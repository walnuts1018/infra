apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
spec:
  project: default
  destination:
    namespace: argocd
    server: https://kubernetes.default.svc
  sources:
  - path: k8s/_argocd/argocd_components
    repoURL: 'https://github.com/walnuts1018/infra'
    targetRevision: clusterapi
    directory:
      recurse: true
      exclude: '{config/*,_*/*}'
      jsonnet:
        tlas:
        - name: domain
          value: argocd.walnuts.dev
        - name: enableHPA
          value: "true"
          code: true
    ref: infra
  - repoURL: 'https://argoproj.github.io/argo-helm'
    chart: argo-cd
    targetRevision: 10.8.2
    helm:
      releaseName: argocd
      valueFiles:
      - $infra/k8s/_argocd/argocd_components/values.yaml
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
    - ServerSideApply=true
    - FailOnSharedResource=true
