apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: namespaces-kurumi
  namespace: argocd
  labels:
    argocd-agent: "true"
spec:
  project: kurumi
  destination:
    name: kurumi
  source:
    path: k8s/namespaces/kurumi
    repoURL: 'https://github.com/walnuts1018/infra'
    targetRevision: clusterapi
    directory:
      recurse: true
      exclude: '{config/*,_*/*,values*.yaml}'
      jsonnet: {}
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
    - ServerSideApply=true
    - FailOnSharedResource=true
    - Prune=confirm
