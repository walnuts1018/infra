apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: apps-private-kurumi
  namespace: argocd

spec:
  syncPolicy:
    preserveResourcesOnDeletion: false
  goTemplate: true
  generators:
  - git:
      repoURL: https://github.com/walnuts1018/infra-private
      revision: main
      files:
      - path: "k8s/apps/*/app.json5"
  ignoreApplicationDifferences:
  - jsonPointers:
    - /spec/syncPolicy
  template:
    metadata:
      name: '{{ printf "%s-private-kurumi" .name }}'
      labels:
        argocd-agent: "true"
    spec:
      project: kurumi
      destination:
        name: kurumi
        namespace: '{{.namespace}}'
      source:
        repoURL: 'https://github.com/walnuts1018/infra-private'
        targetRevision: main
        path: '{{.path.path}}'
        directory:
          recurse: true
          exclude: '{config/*,_*/*}'
          jsonnet:
            tlas: []
      syncPolicy:
        automated:
          selfHeal: true
          prune: true
        syncOptions:
        - ServerSideApply=true
        - FailOnSharedResource=true
  templatePatch: |
    {{- with  .annotations }}
    metadata:
      annotations:
        {{- range $key, $value := . }}
        {{ $key }}: {{ $value | quote }}
        {{- end }}
    {{- end }}
