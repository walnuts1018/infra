apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  name: scylla-manager-helm
  namespace: argocd
spec:
  destination:
    namespace: scylla-manager
    server: https://kubernetes.default.svc
  project: default
  source:
    chart: scylla-manager
    helm:
      releaseName: scylla-manager
      values: |
        # Scylla Manager log level, allowed values are: error, warn, info, debug, trace
        logLevel: info
        image:
          tag: 3.12.1@sha256:3ec70ef48c31bae76472a1422c64946782b884c36aa3fad0ce69791c47a26370
        resources:
          requests:
            cpu: 10m
            memory: 20Mi
        serviceAccount:
          create: true
          name: ""
        scylla:
          developerMode: true
          scyllaImage:
            tag: 2026.3.2
          agentImage:
            tag: 3.12.1@sha256:b04eedb439652d1c949dead49de4837cf3f2a3656c8ecc5f574c340556da7673
          datacenter: iwakura
          racks:
          - name: iwakura-a
            members: 1
            storage:
              capacity: 5Gi
              storageClassName: local-path
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                cpu: 1
                memory: 1Gi
            placement:
              nodeAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  nodeSelectorTerms:
                  - matchExpressions:
                    - key: storage.walnuts.dev/slow
                      operator: DoesNotExist
              tolerations: []
        serviceMonitor:
          create: true
    repoURL: https://scylla-operator-charts.storage.googleapis.com/stable
    targetRevision: v1.22.0
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - FailOnSharedResource=true
