apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prfexample-read-scylla-client-cert
  namespace: databases
rules:
  - apiGroups:
      - ""
    resourceNames:
      - scylla-cluster-local-client-ca
    resources:
      - secrets
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prfexample-read-scylla-client-cert
  namespace: databases
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: prfexample-read-scylla-client-cert
subjects:
  - kind: ServiceAccount
    name: prfexample-scylla-secret-reader
    namespace: prfexample
