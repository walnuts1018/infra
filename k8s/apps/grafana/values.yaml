replicas: 1
headlessService: true
topologySpreadConstraints:
- maxSkew: 1
  topologyKey: kubernetes.io/hostname
  whenUnsatisfiable: ScheduleAnyway
  labelSelector:
    matchLabels:
      app.kubernetes.io/name: grafana
      app.kubernetes.io/instance: grafana
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPU: "100"
  targetMemory: ""
resources:
  requests:
    cpu: 120m
    memory: 812Mi
  limits:
    cpu: 500m
    memory: 2Gi
downloadDashboards:
  resources:
    requests:
      cpu: 1m
      memory: 295Mi
    limits:
      cpu: "1"
      memory: 1Gi
ingress:
  enabled: false
  hosts:
  - grafana.walnuts.dev
  ingressClassName: cilium
rbac:
  pspEnabled: false
testFramework:
  enabled: false
persistence:
  enabled: false
service:
  type: ClusterIP
admin:
  existingSecret: "grafana"
  userKey: admin-username
  passwordKey: admin-password
extraSecretMounts:
- name: auth-generic-oauth-secret
  secretName: grafana
  mountPath: /etc/secrets
  readOnly: true
grafana.ini:
  unified_alerting:
    enabled: true
    ha_peers: grafana-headless.monitoring.svc.cluster.local:9094
    ha_listen_address: ${POD_IP}:9094
    ha_advertise_address: ${POD_IP}:9094
  server:
    domain: grafana.walnuts.dev
    root_url: https://grafana.walnuts.dev/
  # log:
  #   level: debug
  security:
    secret_key: $__file{/etc/secrets/secret_key}
  auth:
    disable_login_form: true
    oauth_auto_login: true
  auth.basic:
    enabled: false
  auth.generic_oauth:
    enabled: true
    client_id: 237480184528306541@walnuts.dev
    client_secret: $__file{/etc/secrets/client_secret}
    scopes: openid email profile offline_access urn:zitadel:iam:org:projects:roles
    email_attribute_path: email
    login_attribute_path: preferred_username
    name_attribute_path: preferred_username
    auth_url: https://auth.walnuts.dev/oauth/v2/authorize
    token_url: https://auth.walnuts.dev/oauth/v2/token
    api_url: https://auth.walnuts.dev/oidc/v1/userinfo
    role_attribute_strict: true
    role_attribute_path: |
      "urn:zitadel:iam:org:project:roles"."admin"  && 'GrafanaAdmin' || "urn:zitadel:iam:org:project:roles"."grafana-editor" && 'Editor' || "urn:zitadel:iam:org:project:roles"."grafana-viewer" && 'Viewer'
    allow_assign_grafana_admin: true
    use_pkce: true
  feature_toggles:
    provisioning: true
    kubernetesDashboards: true
  smtp:
    enabled: true
    from_address: grafana@walnuts.dev
    host: mx.walnuts.dev:465
    user: grafana@walnuts.dev
    password: $__file{/etc/secrets/smtp_password}
  database:
    type: postgres
    host: postgresql-default-rw.databases.svc.cluster.local
    name: grafana
    user: grafana
    password: $__file{/etc/secrets/postgres_password}
sidecar:
  dashboards:
    enabled: false
    initDashboards: false
  plugins:
    enabled: true
  datasources:
    enabled: true
  resources:
    requests:
      cpu: 1m
      memory: 92Mi
    limits:
      memory: 512Mi
plugins:
- knightss27-weathermap-panel
- grafana-github-datasource
- volkovlabs-echarts-panel
- ovhcloud-akvorado-datasource
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
    - name: VictoriaMetrics
      uid: P4169E866C3094E38
      type: prometheus
      url: http://victoria-metrics-victoria-metrics-cluster-vmselect.victoria-metrics.svc.cluster.local:8481/select/0/prometheus
      access: proxy
      isDefault: true
    - name: Loki
      type: loki
      url: http://loki-gateway.loki.svc.cluster.local
      access: proxy
      isDefault: false
    - name: Tempo
      type: tempo
      url: http://tempo-gateway.tempo.svc.cluster.local
      access: proxy
      isDefault: false
      jsonData:
        tracesToLogsV2:
          datasourceUid: 'P8E80F9AEF21F6940'
          filterByTraceID: true
          filterBySpanID: true
        tracesToMetrics:
          datasourceUid: 'P4169E866C3094E38'
        serviceMap:
          datasourceUid: 'P4169E866C3094E38'
        streamingEnabled:
          search: true
          metrics: true
    - name: influxdb
      type: influxdb
      url: http://influxdb-influxdb2.databases.svc.cluster.local
      access: proxy
      isDefault: false
      user: admin
      jsonData:
        httpMode: POST
        organization: influxdata
        pdcInjected: false
        version: Flux
      secureJsonData:
        token: $__file{/etc/secrets/influxdb_token}
alerting:
  mcl-playground-rules.yaml:
    apiVersion: 1
    groups:
    - orgId: 1
      name: mcl-playground-availability
      folder: MCL Playground
      interval: 1m
      rules:
      - uid: mcl-playground-availability
        title: MCL Playground availability degraded
        condition: B
        data:
        - refId: A
          relativeTimeRange:
            from: 300
            to: 0
          datasourceUid: P4169E866C3094E38
          model:
            datasource:
              type: prometheus
              uid: P4169E866C3094E38
            editorMode: code
            expr: 'sum(probe_success{target=~"mcl-playground-(api|website)"}) < bool 2'
            instant: true
            intervalMs: 1000
            maxDataPoints: 43200
            range: false
            refId: A
        - refId: B
          relativeTimeRange:
            from: 0
            to: 0
          datasourceUid: __expr__
          model:
            conditions:
            - evaluator:
                params: [0]
                type: gt
              operator:
                type: and
              query:
                params: [B]
              reducer:
                params: []
                type: last
              type: query
            datasource:
              type: __expr__
              uid: __expr__
            expression: A
            intervalMs: 1000
            maxDataPoints: 43200
            refId: B
            type: threshold
        noDataState: Alerting
        execErrState: Alerting
        for: 5m
        annotations:
          summary: MCL Playground API or website probe is failing.
        labels:
          severity: warning

route:
  main:
    enabled: true
    annotations:
      external-dns-cloudflare.alpha.kubernetes.io/cloudflare-proxied: "true"
    hostnames:
    - grafana.walnuts.dev
    parentRefs:
    - name: envoy-gateway
      namespace: envoy-gateway-system
