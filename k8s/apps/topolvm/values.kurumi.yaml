lvmd:
  nodeSelector:
    topolvm.io/lvmd-config: rusk
  deviceClasses:
  - name: hdd
    volume-group: hdd
    spare-gb: 10
    default: true
    lvcreate-options:
    - --alloc=normal
  prometheus:
    podMonitor:
      enabled: true

controller:
  prometheus:
    podMonitor:
      enabled: true

node:
  nodeSelector:
    topolvm.io/enabled: "true"
  prometheus:
    podMonitor:
      enabled: true

storageClasses:
- name: topolvm-hdd
  storageClass:
    fsType: xfs
    reclaimPolicy: Retain
    isDefaultClass: false
    volumeBindingMode: WaitForFirstConsumer
    allowVolumeExpansion: true
    additionalParameters:
      "topolvm.io/device-class": hdd
    mountOptions:
    - noatime
