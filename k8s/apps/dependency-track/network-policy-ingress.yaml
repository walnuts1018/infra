apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dependency-track-ingress
  namespace: dependency-track
spec:
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway-system
          podSelector:
            matchLabels:
              app.kubernetes.io/component: proxy
              app.kubernetes.io/managed-by: envoy-gateway
              app.kubernetes.io/name: envoy
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: dependency-track-bootstrap
      ports:
        - port: 8080
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: opentelemetry-collector
          podSelector:
            matchLabels:
              app.kubernetes.io/component: opentelemetry-collector
              app.kubernetes.io/instance: opentelemetry-collector.prometheus
      ports:
        - port: 9000
          protocol: TCP
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: dependency-track
  policyTypes:
    - Ingress
