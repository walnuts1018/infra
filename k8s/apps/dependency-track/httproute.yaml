apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    external-dns-cloudflare.alpha.kubernetes.io/cloudflare-proxied: "true"
  name: dependency-track
  namespace: dependency-track
spec:
  hostnames:
    - dependency-track.walnuts.dev
  parentRefs:
    - name: envoy-gateway
      namespace: envoy-gateway-system
  rules:
    - backendRefs:
        - name: dependency-track-api-server
          port: 8080
      matches:
        - path:
            type: PathPrefix
            value: /api
    - backendRefs:
        - name: dependency-track-frontend
          port: 8080
      matches:
        - path:
            type: PathPrefix
            value: /
