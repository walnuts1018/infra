apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dependency-track-database
  namespace: dependency-track
spec:
  data:
    - remoteRef:
        key: terraform-external-secrets
        property: dependency-track-database-password
      secretKey: password
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: dependency-track-database
    template:
      data:
        password: '{{ .password }}'
        username: dependency_track
      engineVersion: v2
      type: Opaque
---
