apiVersion: v1
data:
  bootstrap.py: |
    import json
    import os
    import time
    from urllib.error import HTTPError, URLError
    from urllib.parse import urlencode
    from urllib.request import Request, urlopen

    base_url = "http://dependency-track-api-server:8080/api/v1"
    password = os.environ["ADMIN_PASSWORD"]
    group_name = os.environ["OIDC_GROUP"]


    def api(path, method="GET", payload=None, token=None):
        headers = {}
        body = None
        if token is not None:
            headers["Authorization"] = "Bearer " + token
        if payload is not None:
            if path.startswith("/user/"):
                body = urlencode(payload).encode()
                headers["Content-Type"] = "application/x-www-form-urlencoded"
            else:
                body = json.dumps(payload).encode()
                headers["Content-Type"] = "application/json"
        request = Request(base_url + path, data=body, headers=headers, method=method)
        with urlopen(request, timeout=15) as response:
            return response.read().decode()


    def login():
        return api("/user/login", "POST", {"username": "admin", "password": password})


    for attempt in range(180):
        try:
            token = login()
            break
        except HTTPError as error:
            if error.code == 401:
                api(
                    "/user/forceChangePassword",
                    "POST",
                    {
                        "username": "admin",
                        "password": "admin",
                        "newPassword": password,
                        "confirmPassword": password,
                    },
                )
                token = login()
                break
            if error.code not in (500, 502, 503, 504):
                raise
        except URLError:
            pass
        time.sleep(5)
    else:
        raise RuntimeError("Dependency-Track API did not become ready")

    teams = json.loads(api("/team?limit=100", token=token))
    administrators = next(team for team in teams if team["name"] == "Administrators")
    groups = json.loads(api("/oidc/group", token=token))
    group = next((item for item in groups if item["name"] == group_name), None)
    if group is None:
        group = json.loads(api("/oidc/group", "PUT", {"name": group_name}, token))
    api(
        "/oidc/mapping",
        "PUT",
        {"team": administrators["uuid"], "group": group["uuid"]},
        token,
    )
kind: ConfigMap
metadata:
  name: dependency-track-bootstrap
  namespace: dependency-track
