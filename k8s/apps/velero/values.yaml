resources:
  requests:
    cpu: 10m
    memory: 128Mi
  limits:
    cpu: "2"
    memory: 2Gi

initContainers:
- name: velero-plugin-for-aws
  image: velero/velero-plugin-for-aws:v1.14.2
  volumeMounts:
  - mountPath: /target
    name: plugins

metrics:
  enabled: true
  serviceMonitor:
    autodetect: false
    enabled: true
  nodeAgentPodMonitor:
    autodetect: false
    enabled: true
  prometheusRule:
    autodetect: false
    enabled: false

configuration:
  features: EnableCSI
  # logLevel: debug
  backupStorageLocation:
  - name: minio-biscuit
    default: true
    provider: aws
    bucket: velero-backup
    config:
      s3Url: https://minio-biscuit.local.walnuts.dev
      region: ap-northeast-1
      s3ForcePathStyle: "true"
    credential:
      name: velero-minio-biscuit
      key: credentials
  volumeSnapshotLocation:
  - name: minio-biscuit
    provider: aws
    config:
      s3Url: https://minio-biscuit.local.walnuts.dev
      region: ap-northeast-1
      s3ForcePathStyle: "true"
    credential:
      name: velero-minio-biscuit
      key: credentials

schedules:
  minio-biscuit:
    schedule: "10 17 * * *" # 2:10 JST
    template:
      ttl: "336h" # 14 days
      storageLocation: minio-biscuit
      excludedNamespaceScopedResources:
      - secret
      snapshotVolumes: true
      csiSnapshotTimeout: 6h
