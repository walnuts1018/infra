apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  annotations:
    external-dns-cloudflare.alpha.kubernetes.io/cloudflare-proxied: "true"
  name: mcl-website
  namespace: mcl-website
spec:
  hostnames:
    - mcl.walnuts.dev
  parentRefs:
    - name: envoy-gateway
      namespace: envoy-gateway-system
  rules:
    - backendRefs:
        - kind: Service
          name: mcl-playground-api
          port: 8080
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /api/playground/snippets
    - backendRefs:
        - kind: Service
          name: mcl-website
          port: 8080
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
