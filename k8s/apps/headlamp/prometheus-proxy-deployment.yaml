apiVersion: apps/v1
kind: Deployment
metadata:
  name: headlamp-prometheus-proxy
  namespace: headlamp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: headlamp-prometheus-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: headlamp-prometheus-proxy
    spec:
      automountServiceAccountToken: false
      containers:
        - image: nginxinc/nginx-unprivileged:1.31.4-alpine
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          name: nginx
          ports:
            - containerPort: 9090
              name: http
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            limits:
              memory: 64Mi
            requests:
              cpu: 5m
              memory: 16Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 101
            runAsNonRoot: true
            runAsUser: 101
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - mountPath: /etc/nginx/nginx.conf
              name: config
              readOnly: true
              subPath: nginx.conf
            - mountPath: /tmp
              name: tmp
      volumes:
        - configMap:
            name: headlamp-prometheus-proxy-1fd4a6
          name: config
        - emptyDir: {}
          name: tmp
