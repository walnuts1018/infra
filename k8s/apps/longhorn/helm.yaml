apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  name: longhorn-helm
  namespace: argocd
spec:
  destination:
    namespace: longhorn-system
    server: https://kubernetes.default.svc
  project: default
  source:
    chart: longhorn
    helm:
      releaseName: longhorn
      valuesObject:
        csi:
          attacherReplicaCount: 2
          provisionerReplicaCount: 2
          resizerReplicaCount: 2
          snapshotterReplicaCount: 2
        defaultBackupStore:
          backupTarget: s3://longhorn-backup@ap-northeast-1/
          backupTargetCredentialSecret: longhorn-backupstore-credential-6cfe2a
        defaultSettings:
          allowNodeDrainWithLastHealthyReplica: true
          autoCleanupSnapshotWhenDeleteBackup: true
          defaultReplicaCount: "2"
          guaranteedInstanceManagerCPU: 0
          orphanAutoDeletion: true
          replicaAutoBalance: disabled
          snapshotDataIntegrity: true
          snapshotDataIntegrityCronjob: 5 18 */7 * *
          snapshotDataIntegrityImmediateCheckAfterSnapshotCreation: false
          systemManagedCSIComponentsResourceLimits: |
            {
              "csi-attacher": {
                "requests": {"cpu": "10m", "memory": "64Mi"}
              },
              "csi-provisioner": {
                "requests": {"cpu": "10m", "memory": "64Mi"}
              },
              "csi-resizer": {
                "requests": {"cpu": "10m", "memory": "32Mi"}
              },
              "csi-snapshotter": {
                "requests": {"cpu": "50m", "memory": "64Mi"}
              },
              "longhorn-csi-plugin": {
                "requests": {"cpu": "30m", "memory": "128Mi"}
              },
              "node-driver-registrar": {
                "requests": {"cpu": "10m", "memory": "16Mi"}
              },
              "longhorn-liveness-probe": {
                "requests": {"cpu": "10m", "memory": "32Mi"}
              }
            }
        longhornAdmissionWebhook:
          replicas: 1
        longhornConversionWebhook:
          replicas: 1
        longhornManager:
          resources:
            limits:
              memory: 4Gi
            requests:
              cpu: 100m
              memory: 256Mi
        longhornRecoveryBackend:
          replicas: 1
        longhornUI:
          replicas: 1
        metrics:
          serviceMonitor:
            enabled: true
        persistence:
          defaultClassReplicaCount: 2
          reclaimPolicy: Retain
        service:
          ui:
            type: ClusterIP
    repoURL: https://charts.longhorn.io
    targetRevision: 1.12.1
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - FailOnSharedResource=true
