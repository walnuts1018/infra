apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: seaweedfs-tikv-client
  namespace: seaweedfs
spec:
  commonName: SeaweedFS
  duration: 8760h
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: local
  renewBefore: 360h
  secretName: seaweedfs-tikv-client
  usages:
    - client auth
