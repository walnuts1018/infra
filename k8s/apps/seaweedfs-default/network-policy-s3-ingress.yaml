apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: seaweedfs-default-s3-ingress
  namespace: seaweedfs
spec:
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway-system
          podSelector:
            matchLabels:
              app.kubernetes.io/component: proxy
              app.kubernetes.io/managed-by: envoy-gateway
              app.kubernetes.io/name: envoy
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: beast
          podSelector:
            matchLabels:
              app.kubernetes.io/name: backend
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: beast
          podSelector:
            matchLabels:
              app.kubernetes.io/name: encoder
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ipu
          podSelector:
            matchLabels:
              app.kubernetes.io/name: ipu
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: maps
          podSelector:
            matchLabels:
              app.kubernetes.io/name: maps-versatiles-server
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: maps
          podSelector:
            matchLabels:
              app.kubernetes.io/name: maps-update
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: penpot
          podSelector:
            matchLabels:
              app.kubernetes.io/name: penpot-backend
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: penpot
          podSelector:
            matchLabels:
              app.kubernetes.io/name: penpot-frontend
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: picca
          podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - picca-apiserver
                  - picca-imgproxy
                  - picca-dense-service
                  - picca-dense-worker
                  - picca-caption-worker
                  - picca-ocr-worker
                  - picca-ocr-vl-worker
                  - picca-download-worker
                  - picca-embedding-worker
                  - picca-empty-trash-worker
                  - picca-image-processing-worker
                  - picca-index-commit-worker
                  - picca-storage-reconciler
                  - picca-video-processing-worker
                  - picca-video-transcode-worker
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: stalwart
          podSelector:
            matchLabels:
              app.kubernetes.io/name: stalwart
      ports:
        - port: 8333
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: opentelemetry-collector
          podSelector:
            matchLabels:
              app.kubernetes.io/component: opentelemetry-collector
              app.kubernetes.io/instance: opentelemetry-collector.prometheus
      ports:
        - port: 9327
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: seaweedfs
          podSelector:
            matchLabels:
              app.kubernetes.io/component: filer
              app.kubernetes.io/instance: seaweedfs-default
              app.kubernetes.io/managed-by: seaweedfs-operator
              app.kubernetes.io/name: seaweedfs
      ports:
        - port: 18333
          protocol: TCP
  podSelector:
    matchLabels:
      app.kubernetes.io/component: s3
      app.kubernetes.io/instance: seaweedfs-default
      app.kubernetes.io/managed-by: seaweedfs-operator
      app.kubernetes.io/name: seaweedfs
  policyTypes:
    - Ingress
