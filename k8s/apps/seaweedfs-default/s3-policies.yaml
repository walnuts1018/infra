apiVersion: seaweed.seaweedfs.com/v1
kind: S3Policy
metadata:
  name: misskey-access-key
  namespace: seaweedfs
spec:
  name: misskey-access-key
  policyDocument: |-
    {
        "Statement": [
            {
                "Action": [
                    "s3:Get*",
                    "s3:Put*",
                    "s3:Delete*",
                    "s3:AbortMultipartUpload",
                    "s3:List*",
                    "s3:*Tagging"
                ],
                "Effect": "Allow",
                "Resource": [
                    "arn:aws:s3:::misskey",
                    "arn:aws:s3:::misskey/*"
                ]
            }
        ],
        "Version": "2012-10-17"
    }
  reclaimPolicy: Retain
  seaweedRef:
    name: seaweedfs-default
