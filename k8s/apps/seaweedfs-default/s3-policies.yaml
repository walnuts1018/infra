apiVersion: seaweed.seaweedfs.com/v1
kind: S3Policy
metadata:
  name: terraform-access-key
  namespace: seaweedfs
spec:
  name: terraform-access-key
  policyDocument: |-
    {
        "Statement": [
            {
                "Action": [
                    "s3:*"
                ],
                "Effect": "Allow",
                "Resource": [
                    "*"
                ]
            }
        ],
        "Version": "2012-10-17"
    }
  reclaimPolicy: Retain
  seaweedRef:
    name: seaweedfs-default
---
