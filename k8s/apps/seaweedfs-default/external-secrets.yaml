apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: seaweedfs-default-mac-hatena-credentials
  namespace: seaweedfs
spec:
  data:
    - remoteRef:
        key: seaweedfs
        property: mac_hatena_accesskey
      secretKey: accesskey
    - remoteRef:
        key: seaweedfs
        property: mac_hatena_secretkey
      secretKey: secretkey
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    creationPolicy: Orphan
    name: seaweedfs-default-mac-hatena-credentials
    template:
      data:
        accesskey: '{{ .accesskey }}'
        secretkey: '{{ .secretkey }}'
      engineVersion: v2
      type: Opaque
