                                  "Action": [
                                      "s3:Get*",
                                      "s3:List*"
                                  ],
                                  "Effect": "Allow",
                                  "Resource": [
                                      "arn:aws:s3:::ipu",
                                      "arn:aws:s3:::ipu/*"
                                  ]
                              }
                          ],
                          "Version": "2012-10-17"
                      },
                      "name": "ipu"
                  },
                  {
                      "document": {
                          "Statement": [
                              {
                                  "Action": [
                                      "s3:*"
                                  ],
                                  "Effect": "Allow",
                                  "Resource": [
                                      "arn:aws:s3:::loki-admin",
                                      "arn:aws:s3:::loki-chunks",
                                      "arn:aws:s3:::loki-ruler",
                                      "arn:aws:s3:::loki-admin/*",
                                      "arn:aws:s3:::loki-chunks/*",
                                      "arn:aws:s3:::loki-ruler/*"
                                  ]
