apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: seaweedfs-default-filer-config-d306d0
  namespace: seaweedfs
spec:
  data:
    - remoteRef:
        key: scylladb
        property: seaweedfs
      secretKey: scylladb_password
    - remoteRef:
        key: postgres_passwords
        property: seaweedfs
      secretKey: postgres_seaweedfs_password
    - remoteRef:
        key: seaweedfs
        property: sts_signing_key
      secretKey: sts_signing_key
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: seaweedfs-default-filer-config-d306d0
    template:
      data:
        filer.toml: |
          [leveldb2]
          enabled = false

          [cassandra2]
          enabled = true
          keyspace = "seaweedfs"
          hosts = ["scylla-cluster-client.databases.svc"]
          username = "seaweedfs"
          password = "{{ .scylladb_password }}"
          ssl_ca_path = "/etc/seaweedfs/scylladb-ca/ca.crt"
          ssl_cert_path = "/etc/seaweedfs/scylladb-client/tls.crt"
          ssl_key_path = "/etc/seaweedfs/scylladb-client/tls.key"
          localDC = "iwakura"

          [postgres2.loki_chunks]
          enabled = true
          location = "/buckets/loki-chunks"
          createTable = """
            CREATE TABLE IF NOT EXISTS "%s" (
              dirhash   BIGINT,
              name      VARCHAR(65535),
              directory VARCHAR(65535),
              meta      bytea,
              PRIMARY KEY (dirhash, name)
            );
          """
          hostname = "postgresql-default-rw.databases.svc.cluster.local"
          port = 5432
          username = "seaweedfs"
          password = "{{ .postgres_seaweedfs_password }}"
          database = "seaweedfs_loki_chunks"
          schema = ""
          sslmode = "disable"
          connection_max_idle = 10
          connection_max_open = 50
          connection_max_lifetime_seconds = 300
          pgbouncer_compatible = false
          enableUpsert = true
          upsertQuery = """
            INSERT INTO "%[1]s" (dirhash, name, directory, meta)
              VALUES($1, $2, $3, $4)
              ON CONFLICT (dirhash, name) DO UPDATE SET
                directory=EXCLUDED.directory,
                meta=EXCLUDED.meta
          """
        iam.json: |-
          {
              "policies": [
                  {
                      "document": {
                          "Statement": [
                              {
                                  "Action": [
                                      "s3:*"
                                  ],
                                  "Effect": "Deny",
                                  "Resource": [
                                      "*"
                                  ]
                              }
                          ],
                          "Version": "2012-10-17"
                      },
                      "name": "DenyAllPolicy"
                  },
                  {
                      "document": {
                          "Statement": [
                              {
                                  "Action": [
                                      "s3:*"
                                  ],
                                  "Effect": "Allow",
                                  "Resource": [
                                      "arn:aws:s3:::cloudnative-pg-backup",
                                      "arn:aws:s3:::cloudnative-pg-backup/*"
                                  ]
                              }
                          ],
                          "Version": "2012-10-17"
                      },
                      "name": "cloudnative-pg-backup"
                  },
                  {
                      "document": {
                          "Statement": [
                              {
                                  "Action": [
                                      "s3:Get*",
                                      "s3:Put*",
                                      "s3:Delete*",
                                      "s3:List*",
                                      "s3:*Tagging",
                                      "s3:AbortMultipartUpload"
                                  ],
                                  "Effect": "Allow",
                                  "Resource": [
                                      "arn:aws:s3:::picca",
                                      "arn:aws:s3:::picca/*"
                                  ]
                              }
                          ],
                          "Version": "2012-10-17"
                      },
                      "name": "picca"
                  },
                  {
                      "document": {
