images:
  pullPolicy: IfNotPresent

crds:
  install: true
  keep: true
  full: true

singleNamespace: false
workflow:
  serviceAccount:
    create: false
    name: argo-workflow
  rbac:
    create: false

controller:
  replicas: 1
  workflowNamespaces: []
  rbac:
    create: true
    secretWhitelist:
    - argo-workflows-postgres-config
    accessAllSecrets: false
    writeConfigMaps: false
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  metricsConfig:
    enabled: true
  serviceMonitor:
    enabled: true
    namespace: monitoring
  workflowDefaults:
    spec:
      ttlStrategy:
        secondsAfterCompletion: 604800
      podGC:
        strategy: OnWorkflowCompletion
  persistence:
    archive: true
    archiveTTL: 90d
    nodeStatusOffLoad: false
    postgresql:
      host: postgresql-default-rw.databases.svc.cluster.local
      port: 5432
      database: argo_workflows
      tableName: argo_workflows
      userNameSecret:
        name: argo-workflows-postgres-config
        key: username
      passwordSecret:
        name: argo-workflows-postgres-config
        key: password

server:
  enabled: false

executor:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
      ephemeral-storage: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi
      ephemeral-storage: 256Mi
