apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  name: argo-workflows-helm
  namespace: argocd
spec:
  destination:
    namespace: argo-workflows
    server: https://kubernetes.default.svc
  project: default
  source:
    chart: argo-workflows
    helm:
      releaseName: argo-workflows
      values: |
        images:
          pullPolicy: IfNotPresent

        crds:
          install: true
          keep: true
          full: true

        singleNamespace: false
        workflow:
          serviceAccount:
            create: false
            name: argo-workflow
          rbac:
            create: false

        controller:
          replicas: 1
          workflowNamespaces: []
          rbac:
            create: true
            secretWhitelist:
            - argo-workflows-postgres-config
            accessAllSecrets: false
            writeConfigMaps: false
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          metricsConfig:
            enabled: true
          serviceMonitor:
            enabled: true
            namespace: monitoring
          workflowDefaults:
            spec:
              ttlStrategy:
                secondsAfterCompletion: 604800
              podGC:
                strategy: OnWorkflowCompletion
          persistence:
            archive: true
            archiveTTL: 90d
            nodeStatusOffLoad: false
            postgresql:
              host: postgresql-default-rw.databases.svc.cluster.local
              port: 5432
              database: argo_workflows
              tableName: argo_workflows
              userNameSecret:
                name: argo-workflows-postgres-config
                key: username
              passwordSecret:
                name: argo-workflows-postgres-config
                key: password

        server:
          enabled: true
          authModes:
          - sso
          sso:
            enabled: true
            issuer: https://auth.walnuts.dev
            clientId:
              name: argo-workflows-sso
              key: client-id
            clientSecret:
              name: argo-workflows-sso
              key: client-secret
            redirectUrl: https://argoworkflows.walnuts.dev/oauth2/callback
            rbac:
              enabled: false
            scopes:
            - openid
            - profile
            - email
            sessionExpiry: 24h
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          replicas: 1
          httproute:
            enabled: true
            parentRefs:
            - group: gateway.networking.k8s.io
              kind: Gateway
              name: envoy-gateway
              namespace: envoy-gateway-system
            hostnames:
            - argoworkflows.walnuts.dev
        executor:
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
              ephemeral-storage: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
              ephemeral-storage: 256Mi
    repoURL: https://argoproj.github.io/argo-helm
    targetRevision: 2.0.18
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - FailOnSharedResource=true
