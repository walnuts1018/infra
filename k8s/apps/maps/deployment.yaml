apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: maps-versatiles-server
    app.kubernetes.io/name: maps-versatiles-server
  name: maps-versatiles-server
  namespace: maps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: maps-versatiles-server
      app.kubernetes.io/name: maps-versatiles-server
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: maps-versatiles-server
        app.kubernetes.io/name: maps-versatiles-server
    spec:
      automountServiceAccountToken: false
      containers:
        - args:
            - serve
            - --config
            - /config/config.yaml
          image: docker.io/versatiles/versatiles:v4.12.3
          imagePullPolicy: IfNotPresent
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /status
              port: 8080
            periodSeconds: 10
          name: versatiles
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /status
              port: 8080
            periodSeconds: 10
          resources:
            limits:
              cpu: "1"
              memory: 768Mi
            requests:
              cpu: 50m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              add:
                - NET_BIND_SERVICE
              drop:
                - all
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
          startupProbe:
            failureThreshold: 30
            httpGet:
              path: /status
              port: 8080
            periodSeconds: 2
          volumeMounts:
            - mountPath: /config
              name: config
              readOnly: true
      initContainers:
        - args:
            - -c
            - /etc/envoy/envoy.yaml
          command:
            - envoy
          envFrom:
            - secretRef:
                name: maps-s3-credentials
          image: docker.io/envoyproxy/envoy:distroless-v1.39.0
          imagePullPolicy: IfNotPresent
          name: envoy-s3-proxy
          readinessProbe:
            failureThreshold: 6
            httpGet:
              path: /ready
              port: 9901
            periodSeconds: 5
          resources:
            limits:
              memory: 256Mi
            requests:
              cpu: 30m
              memory: 48Mi
          restartPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              add:
                - NET_BIND_SERVICE
              drop:
                - all
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - mountPath: /etc/envoy
              name: envoy-config
              readOnly: true
      securityContext:
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
      serviceAccountName: maps-versatiles-server
      topologySpreadConstraints:
        - labelSelector:
            matchLabels:
              app: maps-versatiles-server
              app.kubernetes.io/name: maps-versatiles-server
          maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
      volumes:
        - configMap:
            name: maps-versatiles-config-9b7bba
          name: config
        - configMap:
            name: maps-envoy-config-585533
          name: envoy-config
