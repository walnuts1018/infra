apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: iwashi-cortex-distributor
  namespace: iwashi-system
spec:
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: iwashi
      ports:
        - port: 8080
          protocol: TCP
  podSelector:
    matchLabels:
      app.kubernetes.io/component: distributor
      app.kubernetes.io/instance: iwashi-cortex
      app.kubernetes.io/name: cortex
  policyTypes:
    - Ingress
