apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hubble-oauth2-proxy-secret-288f7a
spec:
  data:
    - remoteRef:
        key: terraform-external-secrets
        property: hubble-client-id
      secretKey: client-id
    - remoteRef:
        key: terraform-external-secrets
        property: hubble-client-secret
      secretKey: client-secret
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: hubble-oauth2-proxy-secret-288f7a
    template:
      engineVersion: v2
      type: Opaque
