apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: picca-dev-album-capability
  namespace: picca-dev
spec:
  data:
    - remoteRef:
        key: terraform-external-secrets
        property: picca-dev-album-capability-keys
      secretKey: capability_keys
    - remoteRef:
        key: terraform-external-secrets
        property: picca-dev-album-capability-active-key-id
      secretKey: capability_active_key_id
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: picca-dev-album-capability
    template:
      data:
        ALBUM_CAPABILITY_ACTIVE_KEY_ID: '{{ .capability_active_key_id }}'
        ALBUM_CAPABILITY_KEYS: '{{ .capability_keys }}'
      engineVersion: v2
      type: Opaque
---
apiVersion: v1
data:
  plans.yaml: |
    plans:
      - id: admin
        name: Admin
        storageLimitBytes: null # 無制限

