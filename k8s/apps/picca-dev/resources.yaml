apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: picca-dev-imgproxy
  namespace: picca-dev
spec:
  hostnames:
    - imgproxy-picca-dev.walnuts.dev
  parentRefs:
    - name: envoy-gateway
      namespace: envoy-gateway-system
      sectionName: https
  rules:
    - backendRefs:
        - kind: Service
          name: picca-dev-imgproxy
          port: 80
          weight: 1
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: picca-dev
  namespace: picca-dev
spec:
  hostnames:
    - picca-dev.walnuts.dev
  parentRefs:
    - name: envoy-gateway
      namespace: envoy-gateway-system
      sectionName: https
  rules:
    - backendRefs:
        - kind: Service
          name: picca-dev-frontend
          port: 3000
          weight: 1
      filters:
        - responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: max-age=63072000; includeSubDomains
              - name: X-Content-Type-Options
                value: nosniff
              - name: X-Frame-Options
                value: DENY
              - name: Referrer-Policy
                value: no-referrer
              - name: Permissions-Policy
                value: camera=(), microphone=(), geolocation=(self), payment=(), usb=(), serial=(), bluetooth=(), accelerometer=(), gyroscope=(), magnetometer=()
          type: ResponseHeaderModifier
      matches:
        - path:
            type: PathPrefix
            value: /api/health
        - path:
            type: PathPrefix
            value: /api/telemetry
    - backendRefs:
        - kind: Service
          name: picca-dev-apiserver
          port: 8080
          weight: 1
      filters:
        - responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: max-age=63072000; includeSubDomains
              - name: X-Content-Type-Options
                value: nosniff
              - name: X-Frame-Options
                value: DENY
              - name: Referrer-Policy
                value: no-referrer
              - name: Permissions-Policy
                value: camera=(), microphone=(), geolocation=(self), payment=(), usb=(), serial=(), bluetooth=(), accelerometer=(), gyroscope=(), magnetometer=()
          type: ResponseHeaderModifier
      matches:
        - path:
            type: PathPrefix
            value: /auth
        - path:
            type: PathPrefix
            value: /query
        - path:
            type: PathPrefix
            value: /api
      timeouts:
        backendRequest: 0s
        request: 0s
    - backendRefs:
        - kind: Service
          name: picca-dev-frontend
          port: 3000
          weight: 1
      filters:
        - responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: max-age=63072000; includeSubDomains
              - name: X-Content-Type-Options
                value: nosniff
              - name: X-Frame-Options
                value: DENY
              - name: Referrer-Policy
                value: no-referrer
              - name: Permissions-Policy
                value: camera=(), microphone=(), geolocation=(self), payment=(), usb=(), serial=(), bluetooth=(), accelerometer=(), gyroscope=(), magnetometer=()
          type: ResponseHeaderModifier
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: picca-dev-rate-limit
  namespace: picca-dev
spec:
  rateLimit:
    global:
      rules:
        - clientSelectors:
            - path:
                type: PathPrefix
                value: /auth
              sourceCIDR:
                type: Distinct
                value: 0.0.0.0/0
          limit:
            requests: 2
            unit: Second
        - clientSelectors:
            - path:
                type: PathPrefix
                value: /auth
              sourceCIDR:
                type: Distinct
                value: ::/0
          limit:
            requests: 2
            unit: Second
        - clientSelectors:
            - path:
                type: PathPrefix
                value: /query
              sourceCIDR:
                type: Distinct
                value: 0.0.0.0/0
          limit:
            requests: 20
            unit: Second
        - clientSelectors:
            - path:
                type: PathPrefix
                value: /query
              sourceCIDR:
                type: Distinct
                value: ::/0
          limit:
            requests: 20
            unit: Second
        - clientSelectors:
            - path:
                type: PathPrefix
                value: /api/telemetry
              sourceCIDR:
                type: Distinct
                value: 0.0.0.0/0
          limit:
            requests: 2
            unit: Second
        - clientSelectors:
            - path:
                type: PathPrefix
                value: /api/telemetry
              sourceCIDR:
                type: Distinct
                value: ::/0
          limit:
            requests: 2
            unit: Second
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: picca-dev
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: picca-dev-http
  namespace: picca-dev
spec:
  hostnames:
    - picca-dev.walnuts.dev
  parentRefs:
    - name: envoy-gateway
      namespace: envoy-gateway-system
      sectionName: http
  rules:
    - filters:
        - requestRedirect:
            scheme: https
            statusCode: 301
          type: RequestRedirect
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: picca-dev-imgproxy
  namespace: picca-dev
spec:
  data:
    - remoteRef:
        key: terraform-external-secrets
        property: picca-dev-imgproxy-key
      secretKey: imgproxy_key
    - remoteRef:
        key: terraform-external-secrets
        property: picca-dev-imgproxy-salt
      secretKey: imgproxy_salt
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: picca-dev-imgproxy
    template:
      data:
        IMGPROXY_ALLOW_ORIGIN: https://picca-dev.walnuts.dev
        IMGPROXY_FAIL_ON_DEPRECATION: "true"
        IMGPROXY_KEY: '{{ .imgproxy_key }}'
        IMGPROXY_PROMETHEUS_BIND: :8081
        IMGPROXY_S3_ALLOWED_BUCKETS: picca-dev
        IMGPROXY_S3_ENDPOINT: http://seaweedfs-default-s3.seaweedfs.svc.cluster.local:8333
        IMGPROXY_S3_ENDPOINT_USE_PATH_STYLE: "true"
        IMGPROXY_S3_REGION: us-east-1
        IMGPROXY_SALT: '{{ .imgproxy_salt }}'
        IMGPROXY_TTL: "900"
        IMGPROXY_USE_S3: "true"
      engineVersion: v2
      type: Opaque
---
