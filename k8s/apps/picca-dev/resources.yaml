  namespace: picca-dev
spec:
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
      to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
    - ports:
        - port: 6379
          protocol: TCP
      to:
        - podSelector:
            matchLabels:
              valkey.io/cluster: picca-dev-valkey
    - ports:
        - port: 16379
          protocol: TCP
      to:
        - podSelector:
            matchLabels:
              valkey.io/cluster: picca-dev-valkey
  podSelector:
    matchLabels:
      valkey.io/cluster: picca-dev-valkey
  policyTypes:
    - Egress
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: picca-dev-ingress-valkey
  namespace: picca-dev
spec:
  endpointSelector:
    matchLabels:
      k8s:io.kubernetes.pod.namespace: picca-dev
      k8s:valkey.io/cluster: picca-dev-valkey
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:app.kubernetes.io/name: picca-dev-apiserver
            k8s:io.kubernetes.pod.namespace: picca-dev
        - matchLabels:
            k8s:app.kubernetes.io/name: picca-dev-download-worker
            k8s:io.kubernetes.pod.namespace: picca-dev
        - matchLabels:
            k8s:app.kubernetes.io/name: picca-dev-image-processing-worker
            k8s:io.kubernetes.pod.namespace: picca-dev
        - matchLabels:
            k8s:app.kubernetes.io/name: picca-dev-library-notify-worker
            k8s:io.kubernetes.pod.namespace: picca-dev
        - matchLabels:
            k8s:app.kubernetes.io/name: picca-dev-stack-timeline-worker
            k8s:io.kubernetes.pod.namespace: picca-dev
        - matchLabels:
            k8s:app.kubernetes.io/name: picca-dev-video-processing-worker
            k8s:io.kubernetes.pod.namespace: picca-dev
      toPorts:
        - ports:
            - port: "6379"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: picca-dev
            k8s:valkey.io/cluster: picca-dev-valkey
      toPorts:
        - ports:
            - port: "6379"
              protocol: TCP
            - port: "16379"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:app.kubernetes.io/instance: valkey-operator
            k8s:app.kubernetes.io/name: valkey-operator
            k8s:io.kubernetes.pod.namespace: valkey-operator-system
      toPorts:
        - ports:
            - port: "6379"
              protocol: TCP
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "9121"
              protocol: TCP
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: picca-dev-oidc
  namespace: picca-dev
spec:
  data:
    - remoteRef:
        key: terraform-external-secrets
        property: picca-dev-client-id
      secretKey: oidc_client_id
    - remoteRef:
        key: terraform-external-secrets
        property: picca-dev-client-secret
      secretKey: oidc_client_secret
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: picca-dev-oidc
    template:
      data:
        OIDC_CLIENT_ID: '{{ .oidc_client_id }}'
        OIDC_CLIENT_SECRET: '{{ .oidc_client_secret }}'
      engineVersion: v2
      type: Opaque
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: picca-dev-postgres
  namespace: picca-dev
spec:
  data:
    - remoteRef:
        key: postgres_passwords
        property: picca_dev
      secretKey: postgres_password
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: picca-dev-postgres
    template:
      data:
        DATABASE_URL: postgres://picca_dev:{{ .postgres_password }}@postgresql-default-rw.databases.svc.cluster.local:5432/picca_dev
      engineVersion: v2
      type: Opaque
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: picca-dev-rabbitmq-user-credentials
  namespace: picca-dev
spec:
  data:
    - remoteRef:
        key: terraform-external-secrets
        property: picca-dev-rabbitmq-password
      secretKey: password
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: picca-dev-rabbitmq-user-credentials
    template:
      data:
        password: '{{ .password }}'
        username: picca-dev
      engineVersion: v2
      metadata:
        labels:
          rabbitmq.com/topology-operator: "true"
      type: Opaque
---
apiVersion: rabbitmq.com/v1beta1
kind: Permission
metadata:
  name: picca-dev
  namespace: picca-dev
spec:
  permissions:
    configure: .*
    read: .*
    write: .*
  rabbitmqClusterReference:
    name: default
    namespace: rabbitmq
  userReference:
    name: picca-dev
  vhost: picca-dev
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: picca-dev-rabbitmq
  namespace: picca-dev
spec:
  data:
    - remoteRef:
        key: terraform-external-secrets
        property: picca-dev-rabbitmq-password
      secretKey: rabbitmq_password
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: picca-dev-rabbitmq
    template:
      data:
        KEDA_RABBITMQ_HOST: http://picca-dev:{{ .rabbitmq_password }}@default.rabbitmq.svc.cluster.local:15672/picca-dev
        RABBITMQ_URL: amqp://picca-dev:{{ .rabbitmq_password }}@default.rabbitmq.svc.cluster.local:5672/picca-dev
      engineVersion: v2
      type: Opaque
---
apiVersion: rabbitmq.com/v1beta1
kind: User
metadata:
  name: picca-dev
  namespace: picca-dev
spec:
  importCredentialsSecret:
    name: picca-dev-rabbitmq-user-credentials
  rabbitmqClusterReference:
    name: default
    namespace: rabbitmq
  tags:
    - monitoring
---
apiVersion: rabbitmq.com/v1beta1
kind: Vhost
metadata:
  name: picca-dev
  namespace: picca-dev
spec:
  name: picca-dev
  rabbitmqClusterReference:
    name: default
    namespace: rabbitmq
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: picca-dev
  namespace: picca-dev
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: scylla-cluster-local-client-ca
  namespace: picca-dev
spec:
  dataFrom:
    - extract:
        key: scylla-cluster-local-client-ca
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: scylla-client-cert
  target:
    name: scylla-cluster-local-client-ca
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: picca-dev-read-scylla-client-cert
  namespace: databases
rules:
  - apiGroups:
      - ""
    resourceNames:
      - scylla-cluster-local-client-ca
    resources:
      - secrets
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: picca-dev-read-scylla-client-cert
  namespace: databases
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: picca-dev-read-scylla-client-cert
subjects:
  - kind: ServiceAccount
    name: picca-dev-scylla-secret-reader
    namespace: picca-dev
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: picca-dev-scylla-secret-reader
  namespace: picca-dev
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: scylla-client-cert
  namespace: picca-dev
spec:
  provider:
    kubernetes:
      auth:
        serviceAccount:
          name: picca-dev-scylla-secret-reader
          namespace: picca-dev
      remoteNamespace: databases
      server:
        caProvider:
          key: ca.crt
          name: kube-root-ca.crt
          type: ConfigMap
        url: https://kubernetes.default.svc
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: picca-dev-scylla
  namespace: picca-dev
spec:
  data:
    - remoteRef:
        key: scylladb
        property: picca_dev
      secretKey: scylla_password
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: picca-dev-scylla
    template:
      data:
        SCYLLA_PASSWORD: '{{ .scylla_password }}'
      engineVersion: v2
      type: Opaque
---
apiVersion: valkey.io/v1alpha1
kind: ValkeyCluster
metadata:
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  labels:
    app: picca-dev-valkey
    app.kubernetes.io/name: picca-dev-valkey
  name: picca-dev-valkey
  namespace: picca-dev
spec:
  replicas: 2
  resources:
    limits:
      cpu: "1"
      memory: 1Gi
    requests:
      cpu: 5m
      memory: 5Mi
  scheduling:
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: storage.walnuts.dev/slow
                  operator: DoesNotExist
  shards: 1
  users:
    - enabled: true
      name: default
      passwordSecret:
        keys:
          - valkey_password
        name: picca-dev-valkey
      permissions: +@all ~* &*
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: picca-dev-valkey
  namespace: picca-dev
spec:
  data:
    - remoteRef:
        key: terraform-external-secrets
        property: picca-dev-redis-password
      secretKey: valkey_password
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: picca-dev-valkey
    template:
      data:
        VALKEY_URL: redis://:{{ .valkey_password }}@valkey-picca-dev-valkey.picca-dev.svc.cluster.local:6379/0
        valkey_password: '{{ .valkey_password }}'
      engineVersion: v2
      type: Opaque
