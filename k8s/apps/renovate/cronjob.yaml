apiVersion: batch/v1
kind: CronJob
metadata:
  labels:
    app: renovate
    app.kubernetes.io/name: renovate
  name: renovate
  namespace: renovate
spec:
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - env:
                - name: LOG_LEVEL
                  value: debug
                - name: RENOVATE_PLATFORM
                  value: github
                - name: RENOVATE_CONFIG_FILE
                  value: /config/config.js
                - name: RENOVATE_AUTODISCOVER
                  value: "true"
                - name: RENOVATE_AUTODISCOVER_FILTER
                  value: walnuts1018/infra
                - name: RENOVATE_BRANCH_PREFIX
                  value: renovate/
                - name: RENOVATE_BRANCH_PREFIX_OLD
                  value: renovate/
                - name: RENOVATE_IGNORE_PR_AUTHOR
                  value: "true"
                - name: GITHUB_APP_ID
                  valueFrom:
                    secretKeyRef:
                      key: github-app-id
                      name: renovate-fcf653
                - name: GITHUB_APP_INSTALLATION_ID
                  valueFrom:
                    secretKeyRef:
                      key: github-app-installation-id
                      name: renovate-fcf653
                - name: GITHUB_APP_PRIVATE_KEY
                  valueFrom:
                    secretKeyRef:
                      key: github-app-private-key
                      name: renovate-fcf653
                - name: GHCR_TOKEN
                  valueFrom:
                    secretKeyRef:
                      key: pat-for-ghcr
                      name: renovate-fcf653
                      optional: true
              image: ghcr.io/renovatebot/renovate:44.51.0
              name: renovate
              resources:
                limits:
                  cpu: "1.5"
                  memory: 8Gi
                requests:
                  cpu: "1"
                  memory: 2Gi
              securityContext:
                capabilities:
                  add:
                    - NET_BIND_SERVICE
                  drop:
                    - all
                readOnlyRootFilesystem: true
                seccompProfile:
                  type: RuntimeDefault
              volumeMounts:
                - mountPath: /tmp/renovate
                  name: renovate-work
                - mountPath: /cache
                  name: renovate-cache
                - mountPath: /config
                  name: config
                  readOnly: true
          initContainers:
            - command:
                - sh
                - /scripts/disk-cleaner.sh
              image: debian:13.6-slim
              name: disk-cleaner
              securityContext:
                runAsUser: 0
              volumeMounts:
                - mountPath: /tmp/renovate/cache
                  name: renovate-cache
                - mountPath: /scripts
                  name: scripts
                  readOnly: true
          restartPolicy: Never
          securityContext:
            fsGroup: 12021
            fsGroupChangePolicy: OnRootMismatch
          tolerations:
            - key: node.walnuts.dev/untrusted
              operator: Exists
          volumes:
            - emptyDir: {}
              name: renovate-work
            - name: renovate-cache
              persistentVolumeClaim:
                claimName: renovate
            - configMap:
                name: renovate-config-6fa1d8
              name: config
            - configMap:
                name: renovate-scripts-b52e1d
              name: scripts
  schedule: '*/5 * * * *'
