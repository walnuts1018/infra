apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  name: nvidia-gpu-operator-helm
  namespace: argocd
spec:
  destination:
    namespace: nvidia-gpu-operator
    server: https://kubernetes.default.svc
  project: default
  source:
    chart: gpu-operator
    helm:
      releaseName: nvidia-gpu-operator
      values: |
        nfd:
          enabled: true
          nodefeaturerules: false

        psa:
          enabled: false

        cdi:
          enabled: true
          nriPluginEnabled: false

        operator:
          resources:
            requests:
              cpu: 100m
              memory: 100Mi
            limits:
              cpu: 500m
              memory: 350Mi

        driver:
          enabled: true
          kernelModuleType: "proprietary"
          version: "580.159.04"

        validator:
          cuda:
            env:
            # gpu-operatorのCUDA tool chainがPascal世代のサポートを終了していて、cuda-validatorのvectorAdd workloadがクラッシュしてしまう
            # とりあえず無効化して、ライブラリ・デバイスの疎通確認のみ行う。
            - name: WITH_WORKLOAD
              value: "false"
    repoURL: https://helm.ngc.nvidia.com/nvidia
    targetRevision: v26.7.0
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - FailOnSharedResource=true
