apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TCPRoute
metadata:
  name: stalwart-smtp
  namespace: stalwart
spec:
  parentRefs:
    - name: envoy-gateway
      namespace: envoy-gateway-system
      sectionName: smtp
  rules:
    - backendRefs:
        - name: stalwart
          port: 25
---
