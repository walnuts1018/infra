apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: horse-rabbitmq-user-credentials
  namespace: horse
spec:
  data:
    - remoteRef:
        key: terraform-external-secrets
        property: horse-rabbitmq-password
      secretKey: password
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: horse-rabbitmq-user-credentials
    template:
      data:
        password: '{{ .password }}'
        username: horse
      engineVersion: v2
      metadata:
        labels:
          rabbitmq.com/topology-operator: "true"
      type: Opaque
