apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: horse-worker-gemini-egress
  namespace: horse
spec:
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toFQDNs:
        - matchName: generativelanguage.googleapis.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
          serverNames:
            - generativelanguage.googleapis.com
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/name: horse-worker
