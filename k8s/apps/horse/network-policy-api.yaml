apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: horse-api-network
  namespace: horse
spec:
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
      to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
    - ports:
        - port: 5432
          protocol: TCP
      to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: databases
          podSelector:
            matchLabels:
              cnpg.io/cluster: postgresql-default
              cnpg.io/instanceRole: primary
    - ports:
        - port: 8333
          protocol: TCP
      to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: seaweedfs
          podSelector:
            matchLabels:
              app.kubernetes.io/component: s3
              app.kubernetes.io/instance: seaweedfs-default
              app.kubernetes.io/name: seaweedfs
    - ports:
        - port: 5672
          protocol: TCP
      to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: rabbitmq
          podSelector:
            matchLabels:
              app.kubernetes.io/component: rabbitmq
              app.kubernetes.io/name: default
    - ports:
        - port: 8000
          protocol: TCP
      to:
        - podSelector:
            matchLabels:
              app: horse-ocr
              app.kubernetes.io/name: horse-ocr
    - ports:
        - port: 993
          protocol: TCP
      to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: stalwart
          podSelector:
            matchLabels:
              app: stalwart
    - ports:
        - port: 4318
          protocol: TCP
      to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: opentelemetry-collector
          podSelector:
            matchLabels:
              app.kubernetes.io/component: opentelemetry-collector
              app.kubernetes.io/instance: opentelemetry-collector.default
              app.kubernetes.io/name: default-collector
    - ports:
        - port: 443
          protocol: TCP
      to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 0.0.0.0/8
              - 10.0.0.0/8
              - 100.64.0.0/10
              - 127.0.0.0/8
              - 169.254.0.0/16
              - 172.16.0.0/12
              - 192.0.0.0/24
              - 192.0.2.0/24
              - 192.168.0.0/16
              - 198.18.0.0/15
              - 198.51.100.0/24
              - 203.0.113.0/24
              - 224.0.0.0/4
              - 240.0.0.0/4
        - ipBlock:
            cidr: ::/0
            except:
              - ::/128
              - ::1/128
              - 64:ff9b::/96
              - 100::/64
              - 2001:db8::/32
              - fc00::/7
              - fe80::/10
              - ff00::/8
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway-system
          podSelector:
            matchLabels:
              app.kubernetes.io/component: proxy
              app.kubernetes.io/managed-by: envoy-gateway
              app.kubernetes.io/name: envoy
      ports:
        - port: 8080
          protocol: TCP
    - from:
        - podSelector:
            matchLabels:
              app: horse-web
              app.kubernetes.io/name: horse-web
      ports:
        - port: 8080
          protocol: TCP
  podSelector:
    matchLabels:
      app: horse-api
      app.kubernetes.io/name: horse-api
  policyTypes:
    - Ingress
    - Egress
