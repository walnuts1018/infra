apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghcr-login-secret
  namespace: horse
spec:
  data:
    - remoteRef:
        key: github
        property: .dockerconfigjson
      secretKey: .dockerconfigjson
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: ghcr-login-secret
    template:
      type: kubernetes.io/dockerconfigjson
