apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mcl-playground-api-662f5e
spec:
  data:
    - remoteRef:
        key: terraform-external-secrets
        property: mcl-playground-database-password
      secretKey: postgres_password
    - remoteRef:
        key: terraform-external-secrets
        property: mcl-playground-rate-limit-secret
      secretKey: rate_limit_hmac_secret
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: mcl-playground-api-662f5e
    template:
      data:
        DATABASE_URL: postgresql://mcl_playground:{{ .postgres_password | urlquery | replace "+" "%20" }}@postgresql-default-rw.databases.svc.cluster.local:5432/mcl_playground?sslmode=require
        RATE_LIMIT_HMAC_SECRET: '{{ .rate_limit_hmac_secret }}'
      engineVersion: v2
      type: Opaque
