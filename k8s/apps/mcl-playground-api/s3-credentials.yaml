apiVersion: seaweed.seaweedfs.com/v1
kind: S3Credentials
metadata:
  name: mcl-playground
  namespace: mcl-website
spec:
  identityRef:
    name: mcl-playground
  reclaimPolicy: Retain
  seaweedRef:
    name: seaweedfs-default
    namespace: seaweedfs
  secretRef:
    accessKeyField: AWS_ACCESS_KEY_ID
    name: mcl-playground-s3-credentials
    secretKeyField: AWS_SECRET_ACCESS_KEY
