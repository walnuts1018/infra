---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  annotations:
    external-dns-cloudflare.alpha.kubernetes.io/cloudflare-proxied: 'true'
  name: walnuk
  namespace: walnuk
spec:
  hostnames:
  - waln.uk
  parentRefs:
  - name: envoy-gateway
  rules:
  - backendRefs:
    - kind: Service
      name: walnuk-backend
      port: 8080
      weight: 1
    matches:
    - path:
        type: RegularExpression
        value: "/[A-Za-z0-9]+"
  - filters:
    - extensionRef:
        group: gateway.envoyproxy.io
        kind: HTTPRouteFilter
        name: admin-auth-filter
      type: ExtensionRef
    matches:
    - path:
        type: PathPrefix
        value: "/pages/admin"
  - backendRefs:
    - kind: Service
      name: walnuk-frontend
      port: 3000
      weight: 1
    matches:
    - path:
        type: PathPrefix
        value: "/"
    - path:
        type: PathPrefix
        value: "/pages"
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: HTTPRouteFilter
metadata:
  name: admin-auth-filter
  namespace: walnuk
spec:
  directResponse:
    body:
      inline: Unauthorized
      type: Inline
    contentType: text/plain
    statusCode: 401
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: walnuk-backend
  namespace: walnuk
spec:
  egress:
  - to:
    - ipBlock:
        cidr: 0.0.0.0/0
        except:
        - 192.168.0.0/16
        - 10.244.0.0/16
        - 10.96.0.0/12
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: opentelemetry-collector
      podSelector:
        matchLabels:
          app.kubernetes.io/name: default-collector
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: databases
      podSelector:
        matchLabels:
          scylla/cluster: scylla-cluster
  podSelector:
    matchLabels:
      app: walnuk-backend
      app.kubernetes.io/name: walnuk-backend
  policyTypes:
  - Egress
