apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: walnuk-frontend-ingress
  namespace: walnuk
spec:
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway-system
          podSelector:
            matchLabels:
              app.kubernetes.io/component: proxy
              app.kubernetes.io/managed-by: envoy-gateway
              app.kubernetes.io/name: envoy
      ports:
        - port: 3000
          protocol: TCP
  podSelector:
    matchLabels:
      app: walnuk-frontend
      app.kubernetes.io/name: walnuk-frontend
  policyTypes:
    - Ingress
