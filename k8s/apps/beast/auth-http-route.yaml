apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: beast-auth
  namespace: beast
spec:
  hostnames:
    - beast.walnuts.dev
  parentRefs:
    - name: envoy-gateway
      namespace: envoy-gateway-system
  rules:
    - backendRefs:
        - name: beast-apiserver
          port: 8080
      matches:
        - path:
            type: PathPrefix
            value: /api/auth/
      timeouts:
        backendRequest: 0s
        request: 0s
