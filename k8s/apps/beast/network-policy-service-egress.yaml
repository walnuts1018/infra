apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: beast-service-egress
  namespace: beast
spec:
  egress:
    - ports:
        - port: 5432
          protocol: TCP
        - port: 5672
          protocol: TCP
        - port: 8333
          protocol: TCP
      to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: databases
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: rabbitmq
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: seaweedfs
    - ports:
        - port: 443
          protocol: TCP
      to:
        - ipBlock:
            cidr: 0.0.0.0/0
  podSelector:
    matchLabels:
      app.kubernetes.io/name: backend
  policyTypes:
    - Egress
