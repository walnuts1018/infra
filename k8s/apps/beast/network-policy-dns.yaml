apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: beast-dns-egress
  namespace: beast
spec:
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
      to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
  podSelector: {}
  policyTypes:
    - Egress
