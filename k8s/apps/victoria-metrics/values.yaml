vmselect:
  enabled: true
  mode: deployment
  replicaCount: 1
  horizontalPodAutoscaler:
    enabled: true
    minReplicas: 1
    maxReplicas: 5
    metrics:
    - resource:
        name: cpu
        target:
          averageUtilization: 95
          type: Utilization
      type: Resource
  resources:
    requests:
      cpu: 10m
      memory: 48Mi
    limits:
      memory: 512Gi
  serviceMonitor:
    enabled: true

vminsert:
  enabled: true
  mode: deployment
  replicaCount: 1
  horizontalPodAutoscaler:
    enabled: true
    minReplicas: 1
    maxReplicas: 5
    metrics:
    - resource:
        name: cpu
        target:
          averageUtilization: 95
          type: Utilization
      type: Resource
  resources:
    requests:
      cpu: 150m
      memory: 220Mi
    limits:
      memory: 1Gi
  serviceMonitor:
    enabled: true

vmstorage:
  enabled: true
  replicaCount: 2
  retentionPeriod: 1y
  persistentVolume:
    enabled: true
    storageClassName: "local-path"
    size: 10Gi
  resources:
    requests:
      cpu: 50m
      memory: 1.5Gi
    limits:
      memory: 2Gi
  topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: 'kubernetes.io/hostname'
    whenUnsatisfiable: 'ScheduleAnyway'
    labelSelector:
      matchLabels:
        app: vmstorage
        app.kubernetes.io/instance: victoria-metrics
        app.kubernetes.io/name: victoria-metrics-cluster
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: storage.walnuts.dev/slow
            operator: DoesNotExist
  serviceMonitor:
    enabled: true
