apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: victoria-metrics-vmselect-egress
  namespace: victoria-metrics
spec:
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
      to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
    - ports:
        - port: 8401
          protocol: TCP
      to:
        - podSelector:
            matchLabels:
              app: vmstorage
              app.kubernetes.io/instance: victoria-metrics
              app.kubernetes.io/name: victoria-metrics-cluster
  podSelector:
    matchLabels:
      app: vmselect
      app.kubernetes.io/instance: victoria-metrics
      app.kubernetes.io/name: victoria-metrics-cluster
  policyTypes:
    - Egress
