apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pyroscope-ingress
  namespace: pyroscope
spec:
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: opentelemetry-collector
          podSelector:
            matchLabels:
              app.kubernetes.io/component: opentelemetry-collector
              app.kubernetes.io/instance: opentelemetry-collector.prometheus
      ports:
        - port: 4040
          protocol: TCP
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: all
              app.kubernetes.io/instance: pyroscope
              app.kubernetes.io/name: pyroscope
      ports:
        - port: 9095
          protocol: TCP
        - port: 9099
          protocol: TCP
        - port: 7946
          protocol: TCP
  podSelector:
    matchLabels:
      app.kubernetes.io/component: all
      app.kubernetes.io/instance: pyroscope
      app.kubernetes.io/name: pyroscope
  policyTypes:
    - Ingress
