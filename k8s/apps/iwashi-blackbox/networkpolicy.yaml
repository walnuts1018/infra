apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: iwashi-blackbox
  namespace: iwashi-blackbox
spec:
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
      to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
    - ports:
        - port: 80
          protocol: TCP
        - port: 443
          protocol: TCP
      to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 0.0.0.0/8
              - 10.0.0.0/8
              - 100.64.0.0/10
              - 127.0.0.0/8
              - 169.254.0.0/16
              - 172.16.0.0/12
              - 192.0.0.0/24
              - 192.0.2.0/24
              - 192.168.0.0/16
              - 198.18.0.0/15
              - 198.51.100.0/24
              - 203.0.113.0/24
              - 224.0.0.0/4
              - 240.0.0.0/4
    - ports:
        - port: 80
          protocol: TCP
        - port: 443
          protocol: TCP
      to:
        - ipBlock:
            cidr: ::/0
            except:
              - ::/128
              - ::1/128
              - fc00::/7
              - fe80::/10
              - ff00::/8
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: iwashi-system
          podSelector:
            matchLabels:
              app.kubernetes.io/component: opentelemetry-collector
              app.kubernetes.io/instance: iwashi-system.iwashi-collector
      ports:
        - port: 9115
          protocol: TCP
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: iwashi-blackbox
      app.kubernetes.io/name: prometheus-blackbox-exporter
  policyTypes:
    - Ingress
    - Egress
