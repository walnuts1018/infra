apiVersion: v1
data:
  bootstrap.sh: |
    #!/usr/bin/env bash
    set -Eeuo pipefail
    shopt -s dotglob nullglob

    source=/source
    target=/target
    marker="$target/.infra-webtop-bootstrap-v1"
    lock="$target/.infra-webtop-bootstrap.lock"

    if [[ -e "$marker" ]]; then
      echo 'Webtop root filesystem is already bootstrapped; leaving it unchanged.'
      exit 0
    fi

    [[ -d "$source" ]] || { echo 'Webtop image volume is missing.' >&2; exit 1; }
    [[ -d "$target" ]] || { echo 'Webtop root PVC is missing.' >&2; exit 1; }
    [[ -n "${ROOTFS_IMAGE_REFERENCE:-}" ]] || {
      echo 'ROOTFS_IMAGE_REFERENCE is required.' >&2
      exit 1
    }
    [[ "$ROOTFS_IMAGE_REFERENCE" == *@sha256:* ]] || {
      echo 'ROOTFS_IMAGE_REFERENCE must include an immutable sha256 digest.' >&2
      exit 1
    }
    [[ ! -e "$source/.infra-webtop-bootstrap-v1" ]] || {
      echo 'The source image contains the reserved bootstrap marker.' >&2
      exit 1
    }

    if ! mkdir "$lock"; then
      echo 'Another bootstrap process or a stale bootstrap lock exists.' >&2
      exit 1
    fi
    trap 'rmdir "$lock" 2>/dev/null || true' EXIT

    # The marker may have appeared while this process acquired the lock.
    if [[ -e "$marker" ]]; then
      echo 'Webtop root filesystem is already bootstrapped; leaving it unchanged.'
      exit 0
    fi

    for entry in "$target"/*; do
      name=${entry##*/}
      if [[ "$name" == '.infra-webtop-bootstrap.lock' ]]; then
        continue
      fi
      if [[ "$name" == 'lost+found' && -d "$entry" && ! -L "$entry" ]] &&
        [[ -z "$(find "$entry" -mindepth 1 -maxdepth 1 -print -quit)" ]]; then
        continue
      fi
      printf 'Refusing to initialize a non-empty Webtop root PVC: %s\n' "$entry" >&2
      exit 1
    done

    cp -a --preserve=all -- "$source/." "$target/"

    for path in etc usr var opt root home config defaults lsiopy; do
      [[ -e "$target/$path" ]] || {
        printf 'Copied Webtop root filesystem is missing /%s.\n' "$path" >&2
        exit 1
      }
    done
    [[ -x "$target/init" ]] || {
      echo 'Copied Webtop root filesystem has no executable /init.' >&2
      exit 1
    }

    sync
    marker_tmp="$target/.infra-webtop-bootstrap-v1.$$"
    {
      printf 'source_image=%s\n' "$ROOTFS_IMAGE_REFERENCE"
      printf 'source_digest=%s\n' "${ROOTFS_IMAGE_REFERENCE##*@}"
      printf 'bootstrap_timestamp_utc=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
    } > "$marker_tmp"
    chmod 0444 "$marker_tmp"
    sync
    mv -- "$marker_tmp" "$marker"
    sync

    echo 'Webtop root filesystem bootstrap completed.'
immutable: true
kind: ConfigMap
metadata:
  labels: {}
  name: webtop-bootstrap-6f35ba
  namespace: webtop
