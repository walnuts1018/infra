apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: picca-apiserver
    app.kubernetes.io/name: picca-apiserver
  name: picca-apiserver
  namespace: picca
spec:
  replicas: 1
  selector:
    matchLabels:
      app: picca-apiserver
      app.kubernetes.io/name: picca-apiserver
  template:
    metadata:
      labels:
        app: picca-apiserver
        app.kubernetes.io/name: picca-apiserver
    spec:
      containers:
        - env:
            - name: ENVIRONMENT
              value: production
            - name: AWS_ENDPOINT_URL_S3
              value: http://seaweedfs-default-filer.seaweedfs.svc.cluster.local:8333
            - name: AWS_REGION
              value: us-east-1
            - name: S3_REGION
              value: us-east-1
            - name: S3_BUCKET
              value: picca
            - name: S3_USE_PATH_STYLE
              value: "true"
            - name: S3_EXTERNAL_ENDPOINT
              value: https://picca.seaweedfs.walnuts.dev
            - name: SCYLLA_HOSTS
              value: scylla-cluster-client.databases.svc.cluster.local:9142
            - name: SCYLLA_DATACENTER
              value: iwakura
            - name: SCYLLA_USER
              value: picca
            - name: OIDC_ISSUER
              value: https://auth.walnuts.dev
            - name: OIDC_AUTH_URL
              value: https://auth.walnuts.dev/oauth/v2/authorize
            - name: OIDC_REDIRECT_URL
              value: https://picca.walnuts.dev/auth/callback
            - name: PUBLIC_API_URL
              value: https://picca.walnuts.dev
            - name: ALLOWED_ORIGIN
              value: https://picca.walnuts.dev
            - name: GRAPHQL_QUERY_SIGNING_REQUIRED
              value: "true"
            - name: IMGPROXY_PUBLIC_URL
              value: https://imgproxy-picca.walnuts.dev
            - name: IMGPROXY_BUCKET
              value: picca
            - name: IMGPROXY_TTL
              value: "900"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://default-collector.opentelemetry-collector.svc.cluster.local:4318
            - name: AWS_WEB_IDENTITY_TOKEN_FILE
              value: /var/run/secrets/sts.seaweedfs.com/serviceaccount/token
            - name: AWS_ENDPOINT_URL_STS
              value: http://seaweedfs-default-filer.seaweedfs.svc.cluster.local:8333
            - name: AWS_ROLE_ARN
              value: arn:aws:iam::role/picca
            - name: SCYLLA_CA_CERT_PATH
              value: /etc/certs/scylla-db/ca.crt
            - name: SCYLLA_CLIENT_CERT_PATH
              value: /etc/certs/scylla-db-client/tls.crt
            - name: SCYLLA_CLIENT_KEY_PATH
              value: /etc/certs/scylla-db-client/tls.key
            - name: PLAN_CONFIG_FILE
              value: /etc/picca/plans/plans.yaml
            - name: OTEL_SERVICE_NAME
              value: picca-apiserver
          envFrom:
            - secretRef:
                name: picca-00b20d
          image: ghcr.io/walnuts1018/picca/apiserver:v0.0.22
          imagePullPolicy: IfNotPresent
          livenessProbe:
            failureThreshold: 5
            httpGet:
              path: /livez
              port: 8080
            initialDelaySeconds: 10
          name: apiserver
          ports:
            - containerPort: 8080
          readinessProbe:
            failureThreshold: 5
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 10
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 50m
              memory: 128Mi
          securityContext:
            capabilities:
              add:
                - NET_BIND_SERVICE
              drop:
                - all
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - mountPath: /tmp
              name: tmp
            - mountPath: /var/run/secrets/sts.seaweedfs.com/serviceaccount
              name: seaweedfs-sts-token
              readOnly: true
            - mountPath: /etc/certs/scylla-db
              name: scylla-db-ca-cert
              readOnly: true
            - mountPath: /etc/certs/scylla-db-client
              name: scylla-db-client-cert
              readOnly: true
            - mountPath: /etc/picca/plans
              name: picca-plans
              readOnly: true
      imagePullSecrets:
        - name: ghcr-login-secret
      initContainers:
        - env:
            - name: ENVIRONMENT
              value: production
            - name: AWS_ENDPOINT_URL_S3
              value: http://seaweedfs-default-filer.seaweedfs.svc.cluster.local:8333
            - name: AWS_REGION
              value: us-east-1
            - name: S3_REGION
              value: us-east-1
            - name: S3_BUCKET
              value: picca
            - name: S3_USE_PATH_STYLE
              value: "true"
            - name: S3_EXTERNAL_ENDPOINT
              value: https://picca.seaweedfs.walnuts.dev
            - name: SCYLLA_HOSTS
              value: scylla-cluster-client.databases.svc.cluster.local:9142
            - name: SCYLLA_DATACENTER
              value: iwakura
            - name: SCYLLA_USER
              value: picca
            - name: OIDC_ISSUER
              value: https://auth.walnuts.dev
            - name: OIDC_AUTH_URL
              value: https://auth.walnuts.dev/oauth/v2/authorize
            - name: OIDC_REDIRECT_URL
              value: https://picca.walnuts.dev/auth/callback
            - name: PUBLIC_API_URL
              value: https://picca.walnuts.dev
            - name: ALLOWED_ORIGIN
              value: https://picca.walnuts.dev
            - name: GRAPHQL_QUERY_SIGNING_REQUIRED
              value: "true"
            - name: IMGPROXY_PUBLIC_URL
              value: https://imgproxy-picca.walnuts.dev
            - name: IMGPROXY_BUCKET
              value: picca
            - name: IMGPROXY_TTL
              value: "900"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://default-collector.opentelemetry-collector.svc.cluster.local:4318
            - name: AWS_WEB_IDENTITY_TOKEN_FILE
              value: /var/run/secrets/sts.seaweedfs.com/serviceaccount/token
            - name: AWS_ENDPOINT_URL_STS
              value: http://seaweedfs-default-filer.seaweedfs.svc.cluster.local:8333
            - name: AWS_ROLE_ARN
              value: arn:aws:iam::role/picca
            - name: SCYLLA_CA_CERT_PATH
              value: /etc/certs/scylla-db/ca.crt
            - name: SCYLLA_CLIENT_CERT_PATH
              value: /etc/certs/scylla-db-client/tls.crt
            - name: SCYLLA_CLIENT_KEY_PATH
              value: /etc/certs/scylla-db-client/tls.key
            - name: OTEL_SERVICE_NAME
              value: picca-apiserver
          envFrom:
            - secretRef:
                name: picca-00b20d
          image: ghcr.io/walnuts1018/picca/migrations:v0.0.22
          imagePullPolicy: IfNotPresent
          name: migrations
          securityContext:
            capabilities:
              add:
                - NET_BIND_SERVICE
              drop:
                - all
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - mountPath: /var/run/secrets/sts.seaweedfs.com/serviceaccount
              name: seaweedfs-sts-token
              readOnly: true
            - mountPath: /etc/certs/scylla-db
              name: scylla-db-ca-cert
              readOnly: true
            - mountPath: /etc/certs/scylla-db-client
              name: scylla-db-client-cert
              readOnly: true
      securityContext:
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
      serviceAccountName: picca
      volumes:
        - emptyDir: {}
          name: tmp
        - name: seaweedfs-sts-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: sts.seaweedfs.com
                  expirationSeconds: 86400
                  path: token
        - configMap:
            items:
              - key: ca.crt
                path: ca.crt
            name: picca-scylladb-ca-cert-c0f830
          name: scylla-db-ca-cert
        - name: scylla-db-client-cert
          secret:
            items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
            secretName: scylla-cluster-local-client-ca
        - configMap:
            items:
              - key: plans.yaml
                path: plans.yaml
            name: picca-plans-23d579
          name: picca-plans
