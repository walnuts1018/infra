## Picca basemap向け Planetiler custom schema (https://github.com/onthegomap/planetiler)。
##
## 目的・方針は docs/tasks/00291-map.md を参照。特に以下を厳守する。
##
##   * 5章: water / waterway / landcover / landuse / transportation / building /
##     boundary / place の8layerのみを出力する。OpenMapTiles/Shortbread等の全layerは移植しない。
##   * 6章: テキストラベル(name属性)はplace layer(country/state/city相当)に限定する。
##     道路名・建物名・店舗名・POI名・駅名・番地はいかなるlayerにも出力しない。
##   * 7章: minzoom=0, maxzoom=14。z15以降はMapLibre側のoverzoomに任せるため、
##     building layerはz14で過度にsimplifyしない(GEOMETRY_PRECISIONやsimplification設定は
##     Planetilerのデフォルトに委ね、config.json時代のような明示的simplify指定は行わない)。
##
## boundary layerについて: 行政境界(relation boundary=administrative)を構成する線は、
## Planetilerのcore(OsmReader)がtype=multipolygon/type=boundaryのrelationを自動的に
## マージしてrelationのtagを持つ1つのgeometryとして扱うため、way単独のtagではなく
## `source: osm, geometry: line` + `include_when: {boundary: administrative, admin_level: [...]}`
## だけでrelation由来の境界線を抽出できる(Planetiler公式サンプル
## `planetiler-custommap/src/main/resources/samples/shortbread.yml`のboundariesレイヤーと
## 同じ手法)。tilemaker process.luaで行っていたNextRelation()/FindInRelation()による
## 明示的なrelation走査は不要であり、これがYAML custom schemaで表現できる。
##
## place layerのzoom方針(6章):
##
##   z0-z4   country
##   z4-z7   country + state/prefecture + major city(人口50万人以上)
##   z7+     city / town / village 相当
##
## OSMのadmin_levelは国によって意味が異なるため、「admin_level == N だけで市区町村を
## 決め打ちする」ことはしない。localityの粒度はnodeのplace=city|town|village等のタグで
## 決定し、admin_levelはboundary layer(境界線そのもののスタイル分け)にのみ使う。

schema_name: Picca Basemap
schema_description: >-
  OpenStreetMapベースの静的ベクトルタイル。「写真がどのあたりで撮影されたかを理解する」
  ために必要な最小限のgeometry(水域・土地利用・道路・鉄道・建物・行政境界・地名)のみを持ち、
  道路名・建物名・店舗名・POI名・駅名・番地等のテキストラベルは一切含めない。
attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener noreferrer">OpenStreetMap contributors</a>'
version: "${ args.dataset_version }"

args:
  osm_pbf_url:
    description: OSM抽出データ(.osm.pbf)の取得元URL(Geofabrik等)
    default: https://download.geofabrik.de/asia/japan-latest.osm.pbf
  dataset_version:
    description: >-
      生成ごとに変える値。PMTiles archiveのmetadata `version` として埋め込まれ、
      MartinのtilejsonUrlVersionParamによりtile URLのcache-bustに使われる
      (docs/tasks/00291-map.md 8章)。CronJob側からKubernetes Downward API(Pod UID)で渡す想定。
    default: dev

sources:
  osm:
    type: osm
    url: "${ args.osm_pbf_url }"
    local_path: /work/input.osm.pbf

layers:
  # ------------------------------------------------------------
  # water: 海・湖・川幅のあるpolygon
  # ------------------------------------------------------------
  - id: water
    features:
      - source: osm
        geometry: polygon
        min_zoom: 0
        include_when:
          natural: [water, bay]
          waterway: [riverbank, dock]
          landuse: [reservoir, basin]

  # ------------------------------------------------------------
  # waterway: 川・運河等の線形要素。細流はある程度のzoom以降のみ。
  # ------------------------------------------------------------
  - id: waterway
    features:
      - source: osm
        geometry: line
        min_zoom: 6
        include_when:
          waterway: [river, canal]
      - source: osm
        geometry: line
        min_zoom: 11
        include_when:
          waterway: [stream, ditch, drain]

  # ------------------------------------------------------------
  # landcover: 森林・草地・湿地等の自然被覆
  # ------------------------------------------------------------
  - id: landcover
    features:
      - source: osm
        geometry: polygon
        min_zoom: 0
        include_when:
          natural: [wood, forest, grassland, wetland, scrub, heath, glacier, sand, beach]
          landuse: [forest]

  # ------------------------------------------------------------
  # landuse: 市街地区分・公園等の主要な土地利用
  # ------------------------------------------------------------
  - id: landuse
    features:
      - source: osm
        geometry: polygon
        min_zoom: 4
        include_when:
          landuse: [residential, commercial, industrial, retail, farmland, farmyard, cemetery, military]
          leisure: [park, garden, recreation_ground, pitch, stadium]

  # ------------------------------------------------------------
  # transportation: 道路・鉄道の線形geometry。name/refは一切出力しない
  # (docs/tasks/00291-map.md 6章: 道路名・駅名を表示しない)。
  # ------------------------------------------------------------
  - id: transportation
    features:
      - source: osm
        geometry: line
        include_when:
          __all__:
            - highway: __any__
            - __not__:
                highway: [proposed, construction]
            - disused: ""
        min_zoom:
          default_value: 14
          overrides:
            4:
              highway: [motorway, trunk]
            5:
              highway: [motorway_link, trunk_link]
            6:
              highway: primary
            7:
              highway: primary_link
            8:
              highway: secondary
            9:
              highway: secondary_link
            10:
              highway: tertiary
            11:
              highway: tertiary_link
            12:
              highway: [unclassified, residential, living_street, pedestrian]
        attributes:
          - key: class
            tag_value: highway
          - key: ramp
            type: boolean
            value: true
            include_when:
              highway: "%_link"
      - source: osm
        geometry: line
        include_when:
          railway: [rail, narrow_gauge, light_rail, subway, tram, monorail, funicular]
        min_zoom:
          default_value: 10
          overrides:
            6:
              railway: rail
            7:
              railway: narrow_gauge
            8:
              railway: [light_rail, subway]
            9:
              railway: [tram, monorail]
        attributes:
          - key: class
            value: railway
          - key: subclass
            tag_value: railway

  # ------------------------------------------------------------
  # building: 建物polygon。名称・店舗名は出力しない。z13以降のみ。
  # 最大zoomのMVTをoverzoomするため、simplificationは意図的に指定しない
  # (Planetilerのデフォルトのままにする)。
  # ------------------------------------------------------------
  - id: building
    features:
      - source: osm
        geometry: polygon
        min_zoom: 13
        include_when:
          building: __any__
        exclude_when:
          building: "no"

  # ------------------------------------------------------------
  # boundary: 行政境界(admin_level<=8のみ、国境/都道府県境/市区町村境)。
  # nameは出力しない(境界線のスタイル分けにadmin_levelのみ使う)。
  # ------------------------------------------------------------
  - id: boundary
    features:
      - source: osm
        geometry: line
        include_when:
          __all__:
            - boundary: administrative
            - admin_level: ["1", "2", "3", "4", "5", "6", "7", "8"]
        min_zoom:
          default_value: 7
          overrides:
            0:
              admin_level: ["1", "2"]
            3:
              admin_level: ["3", "4"]
        attributes:
          - key: admin_level
            tag_value: admin_level
            type: integer

  # ------------------------------------------------------------
  # place: country/state/city/town/village相当のラベルのみ。
  # 住所・POI相当の情報は一切含めない(docs/tasks/00291-map.md 6章)。
  # ------------------------------------------------------------
  - id: place
    features:
      # country: 常にz0から表示する。
      - source: osm
        geometry: point
        include_when:
          place: country
        exclude_when:
          name: ""
        min_zoom: 0
        attributes:
          - key: name
            tag_value: name
          - key: class
            tag_value: place
      # state/province: z4から表示する。
      - source: osm
        geometry: point
        include_when:
          place: [state, province]
        exclude_when:
          name: ""
        min_zoom: 4
        attributes:
          - key: name
            tag_value: name
          - key: class
            tag_value: place
      # city: 人口50万人以上のmajor cityはz4から、それ以外はz7から表示する。
      # overridesはmatch expression(タグ条件)しか受け付けずCEL式は使えないため、
      # population条件はmin_zoomのトップレベルCEL式で直接計算する。
      - source: osm
        geometry: point
        include_when:
          place: city
        exclude_when:
          name: ""
        min_zoom: "${ has(feature.tags.population) && double(feature.tags.population) >= 500000.0 ? 4 : 7 }"
        attributes:
          - key: name
            tag_value: name
          - key: class
            tag_value: place
      # town/village: z7から表示する。
      - source: osm
        geometry: point
        include_when:
          place: [town, village]
        exclude_when:
          name: ""
        min_zoom: 7
        attributes:
          - key: name
            tag_value: name
          - key: class
            tag_value: place

## ============================================================
## examples: `planetiler verify tools/basemap/schema.yml` で検証するテストケース。
## Planetiler releaseの更新でschema DSLの挙動が変わった場合に検知するのが目的
## (docs/tasks/00291-map.md 40章、5章)。
## ============================================================
examples:
  - name: water polygon is included
    input:
      source: osm
      geometry: polygon
      tags:
        natural: water
    output:
      - layer: water
        geometry: polygon
        min_zoom: 0

  - name: river line is included with zoom 6
    input:
      source: osm
      geometry: line
      tags:
        waterway: river
    output:
      - layer: waterway
        geometry: line
        min_zoom: 6

  - name: forest landcover is included
    input:
      source: osm
      geometry: polygon
      tags:
        natural: forest
    output:
      - layer: landcover
        geometry: polygon
        min_zoom: 0

  - name: residential landuse is included
    input:
      source: osm
      geometry: polygon
      tags:
        landuse: residential
    output:
      - layer: landuse
        geometry: polygon
        min_zoom: 4

  - name: motorway has geometry at zoom 4 without name attribute
    input:
      source: osm
      geometry: line
      tags:
        highway: motorway
        name: Tomei Expressway
        ref: E1
    output:
      - layer: transportation
        geometry: line
        min_zoom: 4
        tags:
          class: motorway

  - name: residential road only appears from zoom 12
    input:
      source: osm
      geometry: line
      tags:
        highway: residential
        name: Some Street
    output:
      - layer: transportation
        geometry: line
        min_zoom: 12
        tags:
          class: residential

  - name: proposed highway is excluded
    input:
      source: osm
      geometry: line
      tags:
        highway: proposed
    output: []

  - name: subway railway is included from zoom 8 with subclass
    input:
      source: osm
      geometry: line
      tags:
        railway: subway
        name: Ginza Line
    output:
      - layer: transportation
        geometry: line
        min_zoom: 8
        tags:
          class: railway
          subclass: subway

  - name: building polygon is included from zoom 13 without name
    input:
      source: osm
      geometry: polygon
      tags:
        building: yes
        name: Some Building
        shop: bakery
    output:
      - layer: building
        geometry: polygon
        min_zoom: 13

  - name: building=no is excluded
    input:
      source: osm
      geometry: polygon
      tags:
        building: "no"
    output: []

  - name: country admin boundary is included from zoom 0
    input:
      source: osm
      geometry: line
      tags:
        boundary: administrative
        admin_level: "2"
    output:
      - layer: boundary
        geometry: line
        min_zoom: 0
        tags:
          admin_level: 2

  - name: municipal admin boundary is included from zoom 7
    input:
      source: osm
      geometry: line
      tags:
        boundary: administrative
        admin_level: "8"
    output:
      - layer: boundary
        geometry: line
        min_zoom: 7
        tags:
          admin_level: 8

  - name: country place label is included from zoom 0
    input:
      source: osm
      geometry: point
      tags:
        place: country
        name: Japan
    output:
      - layer: place
        geometry: point
        min_zoom: 0
        tags:
          name: Japan
          class: country

  - name: major city with large population is included from zoom 4
    input:
      source: osm
      geometry: point
      tags:
        place: city
        name: Tokyo
        population: "9000000"
    output:
      - layer: place
        geometry: point
        min_zoom: 4
        tags:
          name: Tokyo
          class: city

  - name: minor city without population is only included from zoom 7
    input:
      source: osm
      geometry: point
      tags:
        place: city
        name: Small City
    output:
      - layer: place
        geometry: point
        min_zoom: 7
        tags:
          name: Small City
          class: city

  - name: hamlet place is excluded (not in Picca's supported granularity)
    input:
      source: osm
      geometry: point
      tags:
        place: hamlet
        name: Some Hamlet
    output: []

  - name: unnamed place is excluded
    input:
      source: osm
      geometry: point
      tags:
        place: village
    output: []

  - name: shop POI produces no output in any layer
    input:
      source: osm
      geometry: point
      tags:
        shop: bakery
        name: Some Bakery
    output: []
