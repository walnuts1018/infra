apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: picca-index-commit-worker
    app.kubernetes.io/name: picca-index-commit-worker
  name: picca-index-commit-worker
  namespace: picca
spec:
  replicas: 0
  selector:
    matchLabels:
      app: picca-index-commit-worker
      app.kubernetes.io/name: picca-index-commit-worker
  template:
    metadata:
      labels:
        app: picca-index-commit-worker
        app.kubernetes.io/name: picca-index-commit-worker
    spec:
      containers:
        - env:
            - name: ENVIRONMENT
              value: production
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://default-collector.opentelemetry-collector.svc.cluster.local:4318
            - name: LOG_LEVEL
              value: debug
            - name: AWS_ENDPOINT_URL_S3
              value: http://seaweedfs-default-filer.seaweedfs.svc.cluster.local:8333
            - name: AWS_REGION
              value: us-east-1
            - name: S3_REGION
              value: us-east-1
            - name: S3_BUCKET
              value: picca
            - name: S3_USE_PATH_STYLE
              value: "true"
            - name: S3_EXTERNAL_ENDPOINT
              value: https://picca.seaweedfs.walnuts.dev
            - name: IMGPROXY_BUCKET
              value: picca
            - name: IMGPROXY_TTL
              value: "900"
            - name: SCYLLA_HOSTS
              value: scylla-cluster-client.databases.svc.cluster.local:9142
            - name: SCYLLA_DATACENTER
              value: iwakura
            - name: SCYLLA_USER
              value: picca
            - name: POSTGRES_MAX_CONNS
              value: "12"
            - name: OIDC_ISSUER
              value: https://auth.walnuts.dev
            - name: OIDC_AUTH_URL
              value: https://auth.walnuts.dev/oauth/v2/authorize
            - name: OIDC_REDIRECT_URL
              value: https://picca.walnuts.dev/auth/callback
            - name: PUBLIC_API_URL
              value: https://picca.walnuts.dev
            - name: ALLOWED_ORIGIN
              value: https://picca.walnuts.dev
            - name: GRAPHQL_QUERY_SIGNING_REQUIRED
              value: "true"
            - name: QDRANT_HOST
              value: qdrant.qdrant.svc.cluster.local
            - name: QDRANT_PORT
              value: "6334"
            - name: QDRANT_COLLECTION
              value: picca_media_v2
            - name: DENSE_SERVICE_URL
              value: http://picca-dense-service.picca.svc.cluster.local:8001
            - name: GRAPHQL_QUERY_SIGNING_PUBLIC_KEYS
              value: v1-2026-09=cFst-Ky0SkPjPSYfFaqcIzsqvDQ_ZxBmeE8Cm0-l4yE
            - name: AWS_WEB_IDENTITY_TOKEN_FILE
              value: /var/run/secrets/sts.seaweedfs.com/serviceaccount/token
            - name: AWS_ENDPOINT_URL_STS
              value: http://seaweedfs-default-filer.seaweedfs.svc.cluster.local:8333
            - name: AWS_ROLE_ARN
              value: arn:aws:iam::role/picca
            - name: OTEL_SERVICE_NAME
              value: picca-index-commit-worker
            - name: AI_INDEX_COMMIT_QUEUE
              value: picca.ai-result
            - name: AI_RESULT_ROUTING_KEY
              value: media.processing.ai.result.v1
            - name: AI_RABBITMQ_EXCHANGE
              value: picca.events
          envFrom:
            - secretRef:
                name: picca-postgres-cbb198
            - secretRef:
                name: picca-valkey-ee0a97
            - secretRef:
                name: picca-rabbitmq-94d271
            - secretRef:
                name: picca-oidc-4a2746
            - secretRef:
                name: picca-album-capability-810d61
          image: ghcr.io/walnuts1018/picca/index-commit-worker:v0.0.96@sha256:f52d44010aa5de0c46b9d5e662d4c5a75feffac5a38d77a0e60c52546178e393
          imagePullPolicy: IfNotPresent
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 15
          name: index-commit-worker
          ports:
            - containerPort: 8080
              name: health
          resources:
            limits:
              cpu: "2"
              memory: 1Gi
            requests:
              cpu: 250m
              memory: 256Mi
          securityContext:
            capabilities:
              add:
                - NET_BIND_SERVICE
              drop:
                - all
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
          startupProbe:
            failureThreshold: 18
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 10
          volumeMounts:
            - mountPath: /tmp
              name: tmp
            - mountPath: /var/run/secrets/sts.seaweedfs.com/serviceaccount
              name: seaweedfs-sts-token
              readOnly: true
      imagePullSecrets:
        - name: ghcr-login-secret
      securityContext:
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
      serviceAccountName: picca
      volumes:
        - emptyDir: {}
          name: tmp
        - name: seaweedfs-sts-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: sts.seaweedfs.com
                  expirationSeconds: 86400
                  path: token
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: picca-index-commit-worker
  namespace: picca
spec:
  cooldownPeriod: 300
  maxReplicaCount: 2
  minReplicaCount: 0
  pollingInterval: 5
  scaleTargetRef:
    name: picca-index-commit-worker
  triggers:
    - authenticationRef:
        name: picca-rabbitmq-worker-auth
      metadata:
        mode: QueueLength
        protocol: http
        queueName: picca.ai-result
        value: "20"
      metricType: AverageValue
      type: rabbitmq
