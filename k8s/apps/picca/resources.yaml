metadata:
  name: picca-imgproxy
  namespace: picca
spec:
  hostnames:
    - imgproxy-picca.walnuts.dev
  parentRefs:
    - name: envoy-gateway
      namespace: envoy-gateway-system
      sectionName: https
  rules:
    - backendRefs:
        - kind: Service
          name: picca-imgproxy
          port: 80
          weight: 1
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: picca
  namespace: picca
spec:
  hostnames:
    - picca.walnuts.dev
  parentRefs:
    - name: envoy-gateway
      namespace: envoy-gateway-system
      sectionName: https
  rules:
    - backendRefs:
        - kind: Service
          name: picca-frontend
          port: 3000
          weight: 1
      filters:
        - responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: max-age=63072000; includeSubDomains
              - name: X-Content-Type-Options
                value: nosniff
              - name: X-Frame-Options
                value: DENY
              - name: Referrer-Policy
                value: no-referrer
              - name: Permissions-Policy
                value: camera=(), microphone=(), geolocation=(self), payment=(), usb=(), serial=(), bluetooth=(), accelerometer=(), gyroscope=(), magnetometer=()
          type: ResponseHeaderModifier
      matches:
        - path:
            type: PathPrefix
            value: /api/health
        - path:
            type: PathPrefix
            value: /api/telemetry
    - backendRefs:
        - kind: Service
          name: picca-apiserver
          port: 8080
          weight: 1
      filters:
        - responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: max-age=63072000; includeSubDomains
              - name: X-Content-Type-Options
                value: nosniff
              - name: X-Frame-Options
                value: DENY
              - name: Referrer-Policy
                value: no-referrer
              - name: Permissions-Policy
                value: camera=(), microphone=(), geolocation=(self), payment=(), usb=(), serial=(), bluetooth=(), accelerometer=(), gyroscope=(), magnetometer=()
          type: ResponseHeaderModifier
      matches:
        - path:
            type: PathPrefix
            value: /auth
        - path:
            type: PathPrefix
            value: /query
        - path:
            type: PathPrefix
            value: /api
      timeouts:
        backendRequest: 0s
        request: 0s
    - backendRefs:
        - kind: Service
          name: picca-frontend
          port: 3000
          weight: 1
      filters:
        - responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: max-age=63072000; includeSubDomains
              - name: X-Content-Type-Options
                value: nosniff
              - name: X-Frame-Options
                value: DENY
              - name: Referrer-Policy
                value: no-referrer
              - name: Permissions-Policy
                value: camera=(), microphone=(), geolocation=(self), payment=(), usb=(), serial=(), bluetooth=(), accelerometer=(), gyroscope=(), magnetometer=()
          type: ResponseHeaderModifier
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: picca-http
  namespace: picca
spec:
  hostnames:
    - picca.walnuts.dev
  parentRefs:
    - name: envoy-gateway
      namespace: envoy-gateway-system
      sectionName: http
  rules:
    - filters:
        - requestRedirect:
            scheme: https
            statusCode: 301
          type: RequestRedirect
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: picca-imgproxy-e18614
  namespace: picca
spec:
  data:
    - remoteRef:
        key: terraform-external-secrets
        property: picca-imgproxy-key
      secretKey: imgproxy_key
    - remoteRef:
        key: terraform-external-secrets
        property: picca-imgproxy-salt
      secretKey: imgproxy_salt
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: picca-imgproxy-e18614
    template:
      data:
        IMGPROXY_ALLOW_ORIGIN: https://picca.walnuts.dev
        IMGPROXY_FAIL_ON_DEPRECATION: "true"
        IMGPROXY_KEY: '{{ .imgproxy_key }}'
        IMGPROXY_PROMETHEUS_BIND: :8081
        IMGPROXY_S3_ALLOWED_BUCKETS: picca
        IMGPROXY_S3_ENDPOINT: http://seaweedfs-default-filer.seaweedfs.svc.cluster.local:8333
        IMGPROXY_S3_ENDPOINT_USE_PATH_STYLE: "true"
        IMGPROXY_S3_REGION: us-east-1
        IMGPROXY_SALT: '{{ .imgproxy_salt }}'
        IMGPROXY_TTL: "900"
        IMGPROXY_USE_S3: "true"
      engineVersion: v2
      type: Opaque
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    app: picca
    app.kubernetes.io/name: picca
  name: picca
  namespace: picca
spec:
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 192.168.0.0/16
              - 10.244.0.0/16
              - 10.96.0.0/12
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: opentelemetry-collector
          podSelector:
            matchLabels:
              app.kubernetes.io/name: default-collector
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: databases
          podSelector:
            matchLabels:
              cnpg.io/cluster: postgresql-default
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: databases
          podSelector:
            matchLabels:
              scylla/cluster: scylla-cluster
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: rabbitmq
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: seaweedfs
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: qdrant
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: zitadel
        - podSelector: {}
  podSelector: {}
  policyTypes:
    - Egress
---
