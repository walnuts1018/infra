---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: picca-dense-worker
  namespace: picca
spec:
  cooldownPeriod: 60
  maxReplicaCount: 1
  minReplicaCount: 0
  pollingInterval: 5
  scaleTargetRef:
    name: picca-dense-worker
  triggers:
    - authenticationRef:
        name: picca-rabbitmq-worker-auth
      metadata:
        mode: QueueLength
        protocol: http
        queueName: picca.ai-dense
        value: "1"
      metricType: AverageValue
      type: rabbitmq
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: picca-dense-service
    app.kubernetes.io/name: picca-dense-service
  name: picca-dense-service
  namespace: picca
spec:
  ports:
    - name: http
      port: 8001
      targetPort: http
  selector:
    app: picca-dense-service
    app.kubernetes.io/name: picca-dense-service
  type: ClusterIP
