apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: picca-dense-service
    app.kubernetes.io/name: picca-dense-service
  name: picca-dense-service
  namespace: picca
spec:
  replicas: 1
  selector:
    matchLabels:
      app: picca-dense-service
      app.kubernetes.io/name: picca-dense-service
  template:
    metadata:
      labels:
        app: picca-dense-service
        app.kubernetes.io/name: picca-dense-service
    spec:
      containers:
        - command:
            - python
            - scripts/run_dense_service.py
          env:
            - name: PORT
              value: "8001"
            - name: MODEL_DEVICE
              value: cpu
            - name: DENSE_MODEL_NAME
              value: /models/waon-siglip2-base-patch16-256
          image: ghcr.io/walnuts1018/picca/ai-services:v0.0.49
          imagePullPolicy: IfNotPresent
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          name: dense-service
          ports:
            - containerPort: 8001
              name: http
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          resources:
            limits:
              cpu: "4"
              memory: 6Gi
            requests:
              cpu: "1"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              add:
                - NET_BIND_SERVICE
              drop:
                - all
            readOnlyRootFilesystem: false
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - mountPath: /tmp
              name: tmp
            - mountPath: /models
              name: models
              readOnly: true
      imagePullSecrets:
        - name: ghcr-login-secret
      securityContext:
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
      serviceAccountName: picca
      volumes:
        - emptyDir: {}
          name: tmp
        - image:
            pullPolicy: IfNotPresent
            reference: ghcr.io/walnuts1018/picca/ai-models-dense:v0.0.1
          name: models
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: picca-dense-service
    app.kubernetes.io/name: picca-dense-service
  name: picca-dense-service
  namespace: picca
spec:
  ports:
    - name: http
      port: 8001
      targetPort: http
  selector:
    app: picca-dense-service
    app.kubernetes.io/name: picca-dense-service
  type: ClusterIP
