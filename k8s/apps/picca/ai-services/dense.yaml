apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: picca-dense-service
    app.kubernetes.io/name: picca-dense-service
  name: picca-dense-service
  namespace: picca
spec:
  replicas: 1
  selector:
    matchLabels:
      app: picca-dense-service
      app.kubernetes.io/name: picca-dense-service
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: picca-dense-service
        app.kubernetes.io/name: picca-dense-service
    spec:
      containers:
        - command:
            - python
            - scripts/run_dense_service.py
          env:
            - name: AWS_WEB_IDENTITY_TOKEN_FILE
              value: /var/run/secrets/sts.seaweedfs.com/serviceaccount/token
            - name: AWS_ENDPOINT_URL_STS
              value: http://seaweedfs-default-filer.seaweedfs.svc.cluster.local:8333
            - name: AWS_ROLE_ARN
              value: arn:aws:iam::role/picca
            - name: AWS_ENDPOINT_URL_S3
              value: http://seaweedfs-default-filer.seaweedfs.svc.cluster.local:8333
            - name: AWS_REGION
              value: us-east-1
            - name: S3_REGION
              value: us-east-1
            - name: S3_BUCKET
              value: picca
            - name: S3_USE_PATH_STYLE
              value: "true"
            - name: S3_EXTERNAL_ENDPOINT
              value: https://picca.seaweedfs.walnuts.dev
            - name: IMGPROXY_BUCKET
              value: picca
            - name: IMGPROXY_TTL
              value: "900"
            - name: HOME
              value: /tmp
            - name: HF_HOME
              value: /tmp/huggingface
            - name: HF_MODULES_CACHE
              value: /tmp/huggingface/modules
            - name: TRANSFORMERS_CACHE
              value: /tmp/huggingface/transformers
            - name: PORT
              value: "8001"
            - name: MODEL_DEVICE
              value: cpu
            - name: DENSE_ROLE
              value: query
            - name: DENSE_INFERENCE_BACKEND
              value: openvino
            - name: AI_INFERENCE_THREADS
              value: "2"
            - name: OMP_NUM_THREADS
              value: "2"
            - name: MKL_NUM_THREADS
              value: "2"
            - name: OPENBLAS_NUM_THREADS
              value: "2"
            - name: NUMEXPR_NUM_THREADS
              value: "2"
            - name: TOKENIZERS_PARALLELISM
              value: "false"
            - name: OPENVINO_TENSOR_CACHE_PATH
              value: /tmp/runtime-cache/openvino
            - name: OPENVINO_CACHE_DIR
              value: /tmp/runtime-cache/openvino
            - name: OV_CACHE_DIR
              value: /tmp/runtime-cache/openvino
            - name: AI_OPENVINO_CACHE_DIR
              value: /tmp/runtime-cache/openvino
            - name: DENSE_MODEL_NAME
              value: /models/waon-siglip2-base-patch16-256
            - name: DENSE_OPENVINO_TEXT_MODEL
              value: /models/waon-siglip2-base-patch16-256/openvino/text_model.xml
            - name: CAT_TRANSLATE_MODEL_NAME
              value: /models/CAT-Translate-0.8b
            - name: CAT_SOURCE_LANGUAGE
              value: Japanese
            - name: CAT_TARGET_LANGUAGE
              value: English
            - name: CAT_TRANSLATE_IDLE_SECONDS
              value: "300"
          envFrom:
            - secretRef:
                name: picca-rabbitmq-94d271
          image: ghcr.io/walnuts1018/picca/ai-openvino:v0.0.95@sha256:ec881c21c40f223c363acc946ea64dabc91dd76820e26cf1e5f7eb6ffb22c106
          imagePullPolicy: IfNotPresent
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          name: dense-service
          ports:
            - containerPort: 8001
              name: http
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          resources:
            limits:
              cpu: "2"
              memory: 8Gi
            requests:
              cpu: "1"
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              add:
                - NET_BIND_SERVICE
              drop:
                - all
            readOnlyRootFilesystem: false
            seccompProfile:
              type: RuntimeDefault
          startupProbe:
            failureThreshold: 180
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          volumeMounts:
            - mountPath: /tmp
              name: tmp
            - mountPath: /tmp/runtime-cache
              name: runtime-cache
            - mountPath: /models
              name: models
              readOnly: true
            - mountPath: /var/run/secrets/sts.seaweedfs.com/serviceaccount
              name: seaweedfs-sts-token
              readOnly: true
      imagePullSecrets:
        - name: ghcr-login-secret
      securityContext:
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
      serviceAccountName: picca
      volumes:
        - emptyDir: {}
          name: tmp
        - emptyDir:
            sizeLimit: 2Gi
          name: runtime-cache
        - image:
            pullPolicy: IfNotPresent
            reference: ghcr.io/walnuts1018/picca/ai-models-dense-text:v0.0.69
          name: models
        - name: seaweedfs-sts-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: sts.seaweedfs.com
                  expirationSeconds: 86400
                  path: token
---
