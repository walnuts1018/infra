apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: scylla-cluster-local-client-ca
  namespace: picca
spec:
  dataFrom:
    - extract:
        key: scylla-cluster-local-client-ca
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: scylla-client-cert
  target:
    name: scylla-cluster-local-client-ca
