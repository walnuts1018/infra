server:
  listenAddress: ":80"
  exposedAddress: "https://netbird.walnuts.dev:443"
  stunPorts:
  - 3478
  metricsPort: 9090
  healthcheckAddress: ":9000"
  logLevel: "info"
  logFile: "console"
  authSecret: "{{ .auth_secret }}"
  dataDir: "/var/lib/netbird"
  auth:
    issuer: "https://auth.walnuts.dev"
    localAuthDisabled: true
    signKeyRefreshEnabled: true
    dashboardRedirectURIs:
    - "https://netbird.walnuts.dev/auth"
    - "https://netbird.walnuts.dev/silent-auth"
    cliRedirectURIs:
    - "http://localhost:53000/"
  store:
    engine: "postgres"
    dsn: "host=postgresql-default-rw.databases.svc.cluster.local port=5432 user=netbird password={{ .postgres_password }} dbname=netbird sslmode=disable"
    encryptionKey: "{{ .store_encryption_key | b64enc }}"
