apiVersion: v1
data:
  collector.yaml: |
    receivers:
      prometheus:
        config:
          scrape_configs:
            - job_name: netbird-client
              scrape_interval: 15s
              static_configs:
                - targets: [127.0.0.1:9191]
              metric_relabel_configs:
                - source_labels: [__name__]
                  regex: netbird_(management_connected|signal_connected|peers|peers_connected)
                  action: keep
    processors:
      resource/client_identity:
        attributes:
          - key: pod
            value: ${env:POD_NAME}
            action: upsert
          - key: namespace
            value: ${env:POD_NAMESPACE}
            action: upsert
      batch:
        timeout: 5s
    exporters:
      otlp:
        endpoint: default-collector.opentelemetry-collector.svc.cluster.local:4317
        tls:
          insecure: true
    service:
      pipelines:
        metrics:
          receivers: [prometheus]
          processors: [resource/client_identity, batch]
          exporters: [otlp]
  netbird-cli-wrapper.sh: |
    #!/usr/bin/env bash
    set -euo pipefail

    if [[ "${1:-}" == "service" && "${2:-}" == "run" && -f /var/lib/netbird/default.json ]]; then
      sed -i -E \
        -e 's/("LocalMetricsEnabled":[[:space:]]*)(true|false)/\1true/' \
        -e 's/("LocalMetricsAddress":[[:space:]]*)"[^"]*"/\1"127.0.0.1:9191"/' \
        /var/lib/netbird/default.json
    fi

    if [[ "${1:-}" == "up" ]]; then
      shift
      exec /usr/local/bin/netbird up --enable-local-metrics --local-metrics-address 127.0.0.1:9191 "$@"
    fi

    exec /usr/local/bin/netbird "$@"
kind: ConfigMap
metadata:
  name: netbird-client-metrics
  namespace: netbird
