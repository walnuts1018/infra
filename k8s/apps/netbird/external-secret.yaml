apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: netbird-config-7ba0fc
  namespace: netbird
spec:
  data:
    - remoteRef:
        key: terraform-external-secrets
        property: netbird-setup-key
      secretKey: NB_SETUP_KEY
    - remoteRef:
        key: netbird
        property: auth-secret
      secretKey: auth_secret
    - remoteRef:
        key: netbird
        property: store-encryption-key
      secretKey: store_encryption_key
    - remoteRef:
        key: postgres_passwords
        property: netbird
      secretKey: postgres_password
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: netbird-config-7ba0fc
    template:
      data:
        NB_SETUP_KEY: '{{ .NB_SETUP_KEY }}'
        config.yaml: |
          server:
            listenAddress: ":80"
            exposedAddress: "https://netbird.walnuts.dev:443"
            stunPorts:
            - 3478
            metricsPort: 9090
            healthcheckAddress: ":9000"
            logLevel: "info"
            logFile: "console"
            authSecret: "{{ .auth_secret }}"
            dataDir: "/var/lib/netbird"
            auth:
              issuer: "https://netbird.walnuts.dev/oauth2"
              localAuthDisabled: true # zitade loginを強制する。netbird-adminでログインする必要があれば一時的にfalseにすること
              signKeyRefreshEnabled: true
              dashboardRedirectURIs:
              - "https://netbird.walnuts.dev/auth"
              - "https://netbird.walnuts.dev/silent-auth"
              dashboardPostLogoutRedirectURIs:
              - "https://netbird.walnuts.dev/"
              cliRedirectURIs:
              - "http://localhost:53000/"
            reverseProxy:
              trustedPeers:
              - "10.0.0.0/24"
              - "10.0.1.0/24"
              - "10.0.3.0/24"
            store:
              engine: "postgres"
              dsn: "host=postgresql-default-rw.databases.svc.cluster.local port=5432 user=netbird password={{ .postgres_password }} dbname=netbird sslmode=disable"
              encryptionKey: "{{ .store_encryption_key | b64enc }}"
      engineVersion: v2
      type: Opaque
