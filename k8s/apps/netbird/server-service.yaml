apiVersion: v1
kind: Service
metadata:
  name: netbird-server
  namespace: netbird
spec:
  ports:
    - name: http
      port: 80
      protocol: TCP
      targetPort: http
    - appProtocol: kubernetes.io/h2c
      name: grpc
      port: 81
      protocol: TCP
      targetPort: http
    - name: metrics
      port: 9090
      protocol: TCP
      targetPort: metrics
  selector:
    app: netbird-server
    app.kubernetes.io/name: netbird-server
