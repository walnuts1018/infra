apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: netbird
  namespace: netbird
spec:
  hostnames:
    - netbird.walnuts.dev
  parentRefs:
    - name: envoy-gateway
      namespace: envoy-gateway-system
  rules:
    - backendRefs:
        - name: netbird-server
          port: 81
      matches:
        - path:
            type: PathPrefix
            value: /signalexchange.SignalExchange/
        - path:
            type: PathPrefix
            value: /management.ManagementService/
      timeouts:
        backendRequest: 0s
        request: 0s
    - backendRefs:
        - name: netbird-server
          port: 80
      matches:
        - path:
            type: PathPrefix
            value: /api
        - path:
            type: PathPrefix
            value: /oauth2
    - backendRefs:
        - name: netbird-server
          port: 80
      matches:
        - path:
            type: PathPrefix
            value: /relay
        - path:
            type: PathPrefix
            value: /ws-proxy/
      timeouts:
        backendRequest: 0s
        request: 0s
    - backendRefs:
        - name: netbird-dashboard
          port: 80
