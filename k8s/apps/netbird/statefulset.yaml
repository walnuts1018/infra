apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app: netbird
    app.kubernetes.io/name: netbird
  name: netbird
  namespace: netbird
spec:
  replicas: 2
  selector:
    matchLabels:
      app: netbird
      app.kubernetes.io/name: netbird
  serviceName: netbird-headless
  template:
    metadata:
      annotations:
        checksum/client-metrics: c332b91cf762179bdadb687765057954
      labels:
        app: netbird
        app.kubernetes.io/name: netbird
    spec:
      automountServiceAccountToken: false
      containers:
        - env:
            - name: NETBIRD_BIN
              value: /etc/netbird-monitoring/netbird-cli-wrapper.sh
            - name: NB_MANAGEMENT_URL
              value: https://netbird.walnuts.dev:443
            - name: NB_SETUP_KEY
              valueFrom:
                secretKeyRef:
                  key: NB_SETUP_KEY
                  name: netbird-config-7ba0fc
            - name: NB_HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          image: netbirdio/netbird:0.80.0@sha256:4976692ea44bb93871743d0b742b4a8f97f6425bfc458ca2d78e28fdb8bdf4ad
          imagePullPolicy: IfNotPresent
          name: netbird
          resources:
            limits:
              memory: 256Mi
            requests:
              cpu: 10m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              add:
                - NET_ADMIN
                - NET_RAW
              drop:
                - ALL
            readOnlyRootFilesystem: false
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - mountPath: /etc/netbird-monitoring
              name: client-metrics-config
              readOnly: true
            - mountPath: /var/lib/netbird
              name: state
            - mountPath: /dev/net/tun
              name: tun
        - args:
            - --config=/etc/netbird-monitoring/collector.yaml
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          image: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:0.162.0@sha256:39923a8e431bd1f57be82411999d389fcfe40857492e4365456d97a4c1f74be6
          imagePullPolicy: IfNotPresent
          name: client-metrics-collector
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 10001
            runAsNonRoot: true
            runAsUser: 10001
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - mountPath: /etc/netbird-monitoring
              name: client-metrics-config
              readOnly: true
      dnsPolicy: ClusterFirstWithHostNet
      hostNetwork: true
      topologySpreadConstraints:
        - labelSelector:
            matchLabels:
              app: netbird
              app.kubernetes.io/name: netbird
          maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
      volumes:
        - configMap:
            defaultMode: 365
            name: netbird-client-metrics
          name: client-metrics-config
        - hostPath:
            path: /dev/net/tun
            type: CharDevice
          name: tun
  volumeClaimTemplates:
    - metadata:
        name: state
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 64Mi
        storageClassName: longhorn
