replicaCount: 1

rbac:
  create: false

serviceAccount:
  create: true

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65532
  capabilities:
    drop:
    - ALL

httpRoute:
  enabled: false

auth:
  mode: oidc
  existingSecret: radar-auth
  existingSecretKey: auth-secret
  cookieTTL: 4h
  oidc:
    issuerURL: https://auth.walnuts.dev
    clientID: "385332731359330363"
    existingSecret: radar-auth
    clientSecretKey: client-secret
    redirectURL: https://k8s-dashboard.walnuts.dev/auth/callback
    groupsClaim: my:zitadel:grants
    postLogoutRedirectURL: https://k8s-dashboard.walnuts.dev/
    usernamePrefix: "zitadel:"
    groupsPrefix: "zitadel:"
    enablePKCE: true

timeline:
  storage: memory

mcp:
  enabled: true

resources:
  requests:
    cpu: 10m
    memory: 128Mi
  limits:
    memory: 512Mi
