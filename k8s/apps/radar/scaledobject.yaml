apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: radar
  namespace: radar
spec:
  cooldownPeriod: 300
  maxReplicaCount: 1
  minReplicaCount: 0
  scaleTargetRef:
    name: radar
  triggers:
    - metadata:
        interceptorRoute: radar
        scalerAddress: keda-add-ons-http-external-scaler.keda:9090
      type: external-push
