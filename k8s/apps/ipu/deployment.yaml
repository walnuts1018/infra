apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: ipu
    app.kubernetes.io/name: ipu
  name: ipu
  namespace: ipu
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ipu
      app.kubernetes.io/name: ipu
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: ipu
        app.kubernetes.io/name: ipu
    spec:
      automountServiceAccountToken: false
      containers:
        - args:
            - -c
            - /etc/envoy/envoy.yaml
          command:
            - envoy
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  key: AWS_ACCESS_KEY_ID
                  name: ipu-s3-credentials
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  key: AWS_SECRET_ACCESS_KEY
                  name: ipu-s3-credentials
          image: docker.io/envoyproxy/envoy:distroless-v1.39.0@sha256:7877ad87afd7459e1bd2a077ff601fec7c93aeecd62e71664560d96328c62cf4
          imagePullPolicy: IfNotPresent
          livenessProbe:
            httpGet:
              path: /livez
              port: http
          name: envoy
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          resources:
            limits:
              memory: 256Mi
            requests:
              cpu: 30m
              memory: 48Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 65532
            runAsNonRoot: true
            runAsUser: 65532
          volumeMounts:
            - mountPath: /etc/envoy
              name: envoy-config
              readOnly: true
            - mountPath: /tmp
              name: tmp
      securityContext:
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: ipu
      volumes:
        - configMap:
            name: ipu-envoy-config-7acc44
          name: envoy-config
        - emptyDir: {}
          name: tmp
