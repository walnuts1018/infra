server:
  fullnameOverride: vmalert
  datasource:
    url: http://victoria-metrics-victoria-metrics-cluster-vmselect.victoria-metrics.svc.cluster.local:8481/select/multitenant/prometheus
  notifier:
    url: http://alertmanager.monitoring.svc.cluster.local:9093
  extraArgs:
    rule:
      - /rules/rules.yaml
  envFrom:
    - secretRef:
        name: victoria-metrics-alert
  initContainers:
    - name: fetch-rules
      image: curlimages/curl:8.16.0
      command: [/bin/sh, -ec]
      args:
        - curl -fsS -H "Authorization: Bearer $DISCOVERY_KEY" -o /rules/rules.yaml http://iwashi.iwashi.svc.cluster.local:8080/internal/alert-rules
      envFrom:
        - secretRef:
            name: victoria-metrics-alert
      volumeMounts:
        - name: rules
          mountPath: /rules
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 102
  extraContainers:
    - name: rule-reloader
      image: curlimages/curl:8.16.0
      command: [/bin/sh, -ec]
      args:
        - >-
          while true; do
            sleep 30;
            if curl -fsS -H "Authorization: Bearer $DISCOVERY_KEY" -o /rules/rules.yaml.tmp http://iwashi.iwashi.svc.cluster.local:8080/internal/alert-rules;
            then
              mv /rules/rules.yaml.tmp /rules/rules.yaml;
              curl -fsS -X POST http://127.0.0.1:8880/-/reload;
            fi;
          done
      envFrom:
        - secretRef:
            name: victoria-metrics-alert
      volumeMounts:
        - name: rules
          mountPath: /rules
      resources:
        requests:
          cpu: 1m
          memory: 8Mi
        limits:
          memory: 32Mi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 102
  extraVolumes:
    - name: rules
      emptyDir: {}
  extraVolumeMounts:
    - name: rules
      mountPath: /rules
      readOnly: true
  resources:
    requests:
      cpu: 5m
      memory: 32Mi
    limits:
      memory: 128Mi
  podSecurityContext:
    enabled: true
    fsGroup: 102
  securityContext:
    enabled: true
    allowPrivilegeEscalation: false
    capabilities:
      drop: [ALL]
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534

alertmanager:
  enabled: true
  fullnameOverride: alertmanager
  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: devnull
      group_by: [organization_id, monitor_id, alertname]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        - receiver: iwashi-email
          matchers:
            - notification_email=~".+"
    receivers:
      - name: devnull
      - name: iwashi-email
        email_configs:
          - to: '{{ .CommonLabels.notification_email }}'
            from: iwashi@walnuts.dev
            smarthost: smtp.resend.com:587
            auth_username: resend
            auth_password_file: /etc/iwashi-secrets/SMTP_PASSWORD
            require_tls: true
            send_resolved: true
  extraVolumes:
    - name: smtp-secret
      secret:
        secretName: victoria-metrics-alert
  extraVolumeMounts:
    - name: smtp-secret
      mountPath: /etc/iwashi-secrets
      readOnly: true
  resources:
    requests:
      cpu: 5m
      memory: 32Mi
    limits:
      memory: 128Mi
  podSecurityContext:
    enabled: true
    fsGroup: 65534
  securityContext:
    enabled: true
    allowPrivilegeEscalation: false
    capabilities:
      drop: [ALL]
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
