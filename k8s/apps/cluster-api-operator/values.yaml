core:
  cluster-api:
    # tart control-plane providerがRuntime SDK extension(ExtensionConfig)を登録するため、CAPI core側でも有効化する必要がある。
    manager:
      featureGates:
        RuntimeSDK: true
bootstrap:
  tart:
    version: v0.3.15
    fetchConfig:
      url: https://github.com/walnuts1018/cluster-api-provider-tart/releases/v0.3.15/bootstrap-components.yaml
controlPlane:
  tart:
    version: v0.3.15
    fetchConfig:
      url: https://github.com/walnuts1018/cluster-api-provider-tart/releases/v0.3.15/control-plane-components.yaml
infrastructure:
  tart:
    version: v0.3.15
    fetchConfig:
      url: https://github.com/walnuts1018/cluster-api-provider-tart/releases/v0.3.15/infrastructure-components.yaml
resources:
  manager: {}
enableHelmHook: false # これをつけないと、毎回Syncする時にnamespaceごと消える
