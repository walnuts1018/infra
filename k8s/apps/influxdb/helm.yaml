apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  name: influxdb-helm
  namespace: argocd
spec:
  destination:
    namespace: databases
    server: https://kubernetes.default.svc
  project: default
  source:
    chart: influxdb2
    helm:
      releaseName: influxdb
      values: |
        ## Create default user through docker entrypoint
        ## Defaults indicated below
        ##
        adminUser:
          user: "admin"
          ## The password and token are obtained from an existing secret. The expected
          ## keys are `admin-password` and `admin-token`.
          existingSecret: influxdb

        persistence:
          enabled: true
          storageClass: "longhorn"
          volumeName: influxdb
          accessMode: ReadWriteOnce
          size: 10Gi
          mountPath: /var/lib/influxdb2
          subPath: ""

        ingress:
          enabled: false
          # For Kubernetes >= 1.18 you should specify the ingress-controller via the field ingressClassName
          # See https://kubernetes.io/blog/2020/04/02/improvements-to-the-ingress-api-in-kubernetes-1.18/#specifying-the-class-of-an-ingress
          className: cilium
          tls: false
          # secretName: my-tls-cert # only needed if tls above is true or default certificate is not configured for Nginx
          hostname: influxdb.walnuts.dev
          annotations: {}
          # kubernetes.io/ingress.class: "nginx"
          # kubernetes.io/tls-acme: "true"
          path: /

        resources:
          requests:
            cpu: 10m
            memory: 230Mi
          limits:
            memory: 512Mi

        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
              - matchExpressions:
                - key: storage.walnuts.dev/slow
                  operator: DoesNotExist

        startupProbe:
          enabled: true
          path: /health
          initialDelaySeconds: 0
          periodSeconds: 5
          timeoutSeconds: 1
          failureThreshold: 90
    repoURL: https://helm.influxdata.com/
    targetRevision: 2.1.2
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - FailOnSharedResource=true
