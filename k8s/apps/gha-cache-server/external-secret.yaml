apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gha-cache-server
spec:
  data:
    - remoteRef:
        key: postgres_passwords
        property: gha_cache_server
      secretKey: db_password
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: gha-cache-server
    template:
      engineVersion: v2
      type: Opaque
