apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: iwashi-collector
  namespace: iwashi-system
spec:
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
      to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
    - ports:
        - port: 8080
          protocol: TCP
      to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: iwashi
    - ports:
        - port: 9115
          protocol: TCP
      to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: iwashi-blackbox
          podSelector:
            matchLabels:
              app.kubernetes.io/instance: iwashi-blackbox
              app.kubernetes.io/name: prometheus-blackbox-exporter
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: opentelemetry-collector
          podSelector:
            matchLabels:
              app.kubernetes.io/component: opentelemetry-collector
              app.kubernetes.io/instance: opentelemetry-collector.prometheus
      ports:
        - port: 8888
          protocol: TCP
  podSelector:
    matchLabels:
      app.kubernetes.io/component: opentelemetry-collector
      app.kubernetes.io/instance: iwashi-system.iwashi-collector
  policyTypes:
    - Ingress
    - Egress
