apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: kube-oidc-proxy
  namespace: kube-oidc-proxy
spec:
  dnsNames:
    - kube-oidc-proxy
    - kube-oidc-proxy.kube-oidc-proxy
    - kube-oidc-proxy.kube-oidc-proxy.svc
    - kube-oidc-proxy.kube-oidc-proxy.svc.cluster.local
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: local
  secretName: kube-oidc-proxy-tls
  usages:
    - server auth
