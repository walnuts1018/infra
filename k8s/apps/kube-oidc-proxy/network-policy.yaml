apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kube-oidc-proxy
  namespace: kube-oidc-proxy
spec:
  ingress:
    - ports:
        - port: 8443
          protocol: TCP
    - ports:
        - port: 8080
          protocol: TCP
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kube-oidc-proxy
  policyTypes:
    - Ingress
