apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tikv-cluster-pd-leader-prober
  namespace: databases
spec:
  egress:
    - ports:
        - port: 2379
          protocol: TCP
      to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: pd
              app.kubernetes.io/instance: tikv-cluster
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
      to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: opentelemetry-collector
          podSelector:
            matchLabels:
              app.kubernetes.io/component: opentelemetry-collector
              app.kubernetes.io/instance: opentelemetry-collector.prometheus
      ports:
        - port: 9115
          protocol: TCP
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: tikv-cluster
      app.kubernetes.io/name: pd-leader-prober
  policyTypes:
    - Ingress
    - Egress
