coder:
  httproute:
    enable: true
    host: coder.walnuts.dev
    parentRefs:
    - name: envoy-gateway
      namespace: envoy-gateway-system

  service:
    type: ClusterIP

  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2
      memory: 2Gi

  serviceAccount:
    workspacePerms: false
    workspaceNamespaces:
    - name: coder-workspaces
      workspacePerms: true
      enableDeployments: true

  env:
  - name: CODER_DISABLE_PASSWORD_AUTH
    value: "true"
  - name: CODER_PG_CONNECTION_URL
    valueFrom:
      secretKeyRef:
        name: coder-db-url
        key: url
  - name: CODER_ACCESS_URL
    value: https://coder.walnuts.dev
  - name: CODER_OIDC_ISSUER_URL
    value: https://auth.walnuts.dev
  - name: CODER_OIDC_CLIENT_ID
    valueFrom:
      secretKeyRef:
        name: coder-oidc
        key: client-id
  - name: CODER_OIDC_CLIENT_SECRET
    valueFrom:
      secretKeyRef:
        name: coder-oidc
        key: client-secret
  - name: CODER_DISABLE_PASSWORD_AUTH
    value: "true"
