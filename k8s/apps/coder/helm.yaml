apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  name: coder-helm
  namespace: argocd
spec:
  destination:
    namespace: coder
    server: https://kubernetes.default.svc
  project: default
  source:
    chart: coder
    helm:
      releaseName: coder
      values: |
        coder:
          httproute:
            enable: true
            host: coder.walnuts.dev
            parentRefs:
            - name: envoy-gateway
              namespace: envoy-gateway-system

          service:
            type: ClusterIP

          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2
              memory: 2Gi

          serviceAccount:
            workspacePerms: false
            workspaceNamespaces:
            - name: coder-workspaces
              workspacePerms: true
              enableDeployments: true

          env:
          - name: CODER_PG_CONNECTION_URL
            valueFrom:
              secretKeyRef:
                name: coder-db-url
                key: url
          - name: CODER_ACCESS_URL
            value: https://coder.walnuts.dev
          - name: CODER_OIDC_ISSUER_URL
            value: https://auth.walnuts.dev
          - name: CODER_OIDC_CLIENT_ID
            valueFrom:
              secretKeyRef:
                name: coder-oidc
                key: client-id
          - name: CODER_OIDC_CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                name: coder-oidc
                key: client-secret
          - name: CODER_DISABLE_PASSWORD_AUTH
            value: "true"
          - name: CODER_OAUTH2_GITHUB_DEFAULT_PROVIDER_ENABLE
            value: "false"
          - name: CODER_OIDC_SIGN_IN_TEXT
            value: "Sign in with ZITADEL"

          - name: CODER_OAUTH2_GITHUB_DEFAULT_PROVIDER_ENABLE
            value: "false"

          - name: CODER_EXTERNAL_AUTH_GITHUB_DEFAULT_PROVIDER_ENABLE
            value: "false"

          - name: CODER_EXTERNAL_AUTH_0_ID
            value: github

          - name: CODER_EXTERNAL_AUTH_0_TYPE
            value: github

          - name: CODER_EXTERNAL_AUTH_0_CLIENT_ID
            valueFrom:
              secretKeyRef:
                name: coder-github
                key: client-id

          - name: CODER_EXTERNAL_AUTH_0_CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                name: coder-github
                key: client-secret

          - name: CODER_EXTERNAL_AUTH_0_APP_INSTALL_URL
            value: https://github.com/apps/kurumi-coder-app/installations/new
    repoURL: https://helm.coder.com/v2
    targetRevision: 2.36.5
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - FailOnSharedResource=true
