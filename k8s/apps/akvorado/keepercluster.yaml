apiVersion: clickhouse.com/v1alpha1
kind: KeeperCluster
metadata:
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  labels:
    app: akvorado-keeper
    app.kubernetes.io/name: akvorado-keeper
  name: akvorado-keeper
  namespace: akvorado
spec:
  containerTemplate:
    image:
      repository: docker.io/clickhouse/clickhouse-keeper
      tag: 26.8.2.7
    resources:
      requests:
        cpu: 15m
        memory: 116Mi
  dataVolumeClaimSpec:
    accessModes:
      - ReadWriteOnce
    resources:
      requests:
        storage: 5Gi
  podTemplate:
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: storage.walnuts.dev/slow
                  operator: DoesNotExist
  replicas: 1
