apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  labels:
    app: kubernetes-control-plane-metrics
    app.kubernetes.io/name: kubernetes-control-plane-metrics
  name: kube-scheduler
  namespace: monitoring
spec:
  endpoints:
    - authorization:
        credentials:
          key: token
          name: kubernetes-control-plane-metrics-scrape-token
        type: Bearer
      port: http-metrics
      scheme: https
      tlsConfig:
        ca:
          configMap:
            key: ca.crt
            name: kube-root-ca.crt
        insecureSkipVerify: true
  jobLabel: jobLabel
  namespaceSelector:
    matchNames:
      - kube-system
  selector:
    matchLabels:
      app: kube-scheduler-metrics-proxy
  serviceDiscoveryRole: EndpointSlice
