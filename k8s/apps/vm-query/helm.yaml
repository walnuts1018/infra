apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  name: vm-query-helm
  namespace: argocd
spec:
  destination:
    namespace: victoria-metrics
    server: https://kubernetes.default.svc
  project: default
  source:
    chart: victoria-metrics-cluster
    helm:
      releaseName: vm-query
      values: |
        vmselect:
          enabled: true
          mode: deployment
          replicaCount: 1
          suppressStorageFQDNsRender: true
          extraArgs:
            storageNode:
              - short/vm-short-victoria-metrics-cluster-vmselect.victoria-metrics.svc.cluster.local:8401
              - long/vm-long-victoria-metrics-cluster-vmselect.victoria-metrics.svc.cluster.local:8401
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          networkPolicy:
            enabled: true
            ingress:
              - from:
                  - namespaceSelector:
                      matchLabels:
                        kubernetes.io/metadata.name: monitoring
                    podSelector:
                      matchLabels:
                        app.kubernetes.io/instance: grafana
                        app.kubernetes.io/name: grafana
                  - namespaceSelector:
                      matchLabels:
                        kubernetes.io/metadata.name: opencost
                    podSelector:
                      matchLabels:
                        app.kubernetes.io/instance: opencost
                        app.kubernetes.io/name: opencost
                  - namespaceSelector:
                      matchLabels:
                        kubernetes.io/metadata.name: keda
                    podSelector:
                      matchLabels:
                        app.kubernetes.io/instance: keda
                        app.kubernetes.io/name: keda-operator
                  - namespaceSelector:
                      matchLabels:
                        kubernetes.io/metadata.name: opentelemetry-collector
                    podSelector:
                      matchLabels:
                        app.kubernetes.io/component: opentelemetry-collector
                ports:
                  - protocol: TCP
                    port: 8481
            egress:
              - to:
                  - namespaceSelector:
                      matchLabels:
                        kubernetes.io/metadata.name: kube-system
                    podSelector:
                      matchLabels:
                        k8s-app: kube-dns
                ports:
                  - protocol: UDP
                    port: 53
                  - protocol: TCP
                    port: 53
              - to:
                  - podSelector:
                      matchLabels:
                        app: vmselect
                        app.kubernetes.io/name: victoria-metrics-cluster
                      matchExpressions:
                        - key: app.kubernetes.io/instance
                          operator: In
                          values:
                            - vm-short
                            - vm-long
                ports:
                  - protocol: TCP
                    port: 8401
          serviceMonitor:
            enabled: true

        vminsert:
          enabled: false

        vmstorage:
          enabled: false
    repoURL: https://victoriametrics.github.io/helm-charts/
    targetRevision: 0.55.0
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - FailOnSharedResource=true
