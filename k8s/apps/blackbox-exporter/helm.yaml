apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  name: blackbox-exporter-helm
  namespace: argocd
spec:
  destination:
    namespace: monitoring
    server: https://kubernetes.default.svc
  project: default
  source:
    chart: prometheus-blackbox-exporter
    helm:
      releaseName: blackbox-exporter
      values: |
        config:
          modules:
            http_2xx:
              prober: http
              timeout: 5s
              http:
                follow_redirects: true
                preferred_ip_protocol: ip4
                valid_http_versions: [HTTP/1.1, HTTP/2.0]
            smtp_starttls:
              prober: tcp
              timeout: 10s
              tcp:
                preferred_ip_protocol: ip4
                tls_config:
                  server_name: mx.walnuts.dev
                query_response:
                  - expect: '^220'
                  - send: "EHLO prober\r"
                  - expect: '^250-STARTTLS'
                  - send: "STARTTLS\r"
                  - expect: '^220'
                  - starttls: true
                  - send: "EHLO prober\r"
                  - expect: '^250'
                  - send: "QUIT\r"
            imaps:
              prober: tcp
              timeout: 10s
              tcp:
                preferred_ip_protocol: ip4
                tls: true
                tls_config:
                  server_name: mx.walnuts.dev
                query_response:
                  - expect: '^\* OK'
                  - send: "a1 CAPABILITY\r"
                  - expect: '^a1 OK'
                  - send: "a2 LOGOUT\r"
        serviceMonitor:
          selfMonitor:
            enabled: true
          enabled: true
          targets:
          - name: "walnuts-dev"
            url: "https://walnuts.dev/healthz"
          - name: "blog"
            url: "https://blog.walnuts.dev/"
          - name: "grafana"
            url: "https://grafana.walnuts.dev/healthz"
          - name: "oekaki-dengon-game"
            url: "https://oekaki.walnuts.dev/public"
          - name: "misskey"
            url: "https://misskey.walnuts.dev/healthz"
          - name: "seaweedfs"
            url: "https://seaweedfs.walnuts.dev/misskey/files/b318bef0-983e-4f24-b7ee-9075ec17fc01.webp"
          - name: "walnuk-front"
            url: "https://waln.uk/"
          - name: "walnuk-back"
            url: "https://waln.uk/oDwHe"
          - name: "zitadel"
            url: "https://auth.walnuts.dev/healthz"

        resources:
          requests:
            cpu: 2m
            memory: 39Mi
          limits:
            memory: 300Mi
    repoURL: https://prometheus-community.github.io/helm-charts
    targetRevision: 11.19.1
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - FailOnSharedResource=true
