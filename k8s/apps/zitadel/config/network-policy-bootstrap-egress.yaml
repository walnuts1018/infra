apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: zitadel-bootstrap-egress
  namespace: "{{ .Release.Namespace }}"
spec:
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/component: setup
      k8s:app.kubernetes.io/instance: zitadel
      k8s:app.kubernetes.io/name: zitadel
  egress:
  - toEntities:
    - kube-apiserver
    toPorts:
    - ports:
      - port: '6443'
        protocol: TCP
