apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: zitadel-login
  namespace: "{{ .Release.Namespace }}"
spec:
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/component: login
      k8s:app.kubernetes.io/instance: zitadel
      k8s:app.kubernetes.io/name: zitadel-login
  ingress:
  - fromEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: envoy-gateway-system
        k8s:app.kubernetes.io/component: proxy
        k8s:app.kubernetes.io/managed-by: envoy-gateway
        k8s:app.kubernetes.io/name: envoy
    toPorts:
    - ports:
      - port: '3000'
        protocol: TCP
  egress:
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: "{{ .Release.Namespace }}"
        k8s:app.kubernetes.io/component: start
        k8s:app.kubernetes.io/instance: zitadel
        k8s:app.kubernetes.io/name: zitadel
    toPorts:
    - ports:
      - port: '8080'
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: kube-system
        k8s:k8s-app: kube-dns
    toPorts:
    - ports:
      - port: '53'
        protocol: UDP
      - port: '53'
        protocol: TCP
