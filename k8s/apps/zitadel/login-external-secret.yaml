apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zitadel-login-session-cookie
  namespace: zitadel
spec:
  data:
    - remoteRef:
        key: zitadel-login-session-cookie
        property: ZITADEL_SESSION_COOKIE_SECRET
      secretKey: ZITADEL_SESSION_COOKIE_SECRET
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: zitadel-login-session-cookie
    template:
      engineVersion: v2
      type: Opaque
