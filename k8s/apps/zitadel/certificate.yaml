apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: zitadel-login-service-key
  namespace: zitadel
spec:
  commonName: login-service
  duration: 87600h
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: selfsigned
  privateKey:
    algorithm: RSA
    rotationPolicy: Never
    size: 2048
  secretName: zitadel-login-service-key
