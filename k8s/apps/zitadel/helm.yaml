apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  name: zitadel-helm
  namespace: argocd
spec:
  destination:
    namespace: zitadel
    server: https://kubernetes.default.svc
  project: default
  source:
    chart: zitadel
    helm:
      releaseName: zitadel
      valuesObject:
        affinity:
          nodeAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - preference:
                  matchExpressions:
                    - key: kubernetes.io/arch
                      operator: In
                      values:
                        - amd64
                weight: 100
              - preference:
                  matchExpressions:
                    - key: kubernetes.io/hostname
                      operator: NotIn
                      values:
                        - donut
                weight: 10
        extraManifests:
          - apiVersion: cilium.io/v2
            kind: CiliumNetworkPolicy
            metadata:
              name: zitadel-egress
              namespace: '{{ .Release.Namespace }}'
            spec:
              egress:
                - toEndpoints:
                    - matchLabels:
                        k8s:io.kubernetes.pod.namespace: kube-system
                        k8s:k8s-app: kube-dns
                  toPorts:
                    - ports:
                        - port: "53"
                          protocol: UDP
                        - port: "53"
                          protocol: TCP
                - toEndpoints:
                    - matchLabels:
                        k8s:cnpg.io/cluster: postgresql-default
                        k8s:cnpg.io/instanceRole: primary
                        k8s:io.kubernetes.pod.namespace: databases
                  toPorts:
                    - ports:
                        - port: "5432"
                          protocol: TCP
                - toEndpoints:
                    - matchLabels:
                        k8s:app.kubernetes.io/component: opentelemetry-collector
                        k8s:app.kubernetes.io/instance: opentelemetry-collector.default
                        k8s:app.kubernetes.io/name: default-collector
                        k8s:io.kubernetes.pod.namespace: opentelemetry-collector
                  toPorts:
                    - ports:
                        - port: "4317"
                          protocol: TCP
                - toEntities:
                    - world
                  toPorts:
                    - ports:
                        - port: "443"
                          protocol: TCP
              endpointSelector:
                matchLabels:
                  k8s:app.kubernetes.io/instance: zitadel
                  k8s:app.kubernetes.io/name: zitadel
          - apiVersion: cilium.io/v2
            kind: CiliumNetworkPolicy
            metadata:
              name: zitadel-ingress
              namespace: '{{ .Release.Namespace }}'
            spec:
              endpointSelector:
                matchLabels:
                  k8s:app.kubernetes.io/component: start
                  k8s:app.kubernetes.io/instance: zitadel
                  k8s:app.kubernetes.io/name: zitadel
              ingress:
                - fromEndpoints:
                    - matchLabels:
                        k8s:app.kubernetes.io/component: proxy
                        k8s:app.kubernetes.io/managed-by: envoy-gateway
                        k8s:app.kubernetes.io/name: envoy
                        k8s:io.kubernetes.pod.namespace: envoy-gateway-system
                  toPorts:
                    - ports:
                        - port: "8080"
                          protocol: TCP
                - fromEndpoints:
                    - matchLabels:
                        k8s:app.kubernetes.io/component: opentelemetry-collector
                        k8s:app.kubernetes.io/instance: opentelemetry-collector.prometheus
                        k8s:io.kubernetes.pod.namespace: opentelemetry-collector
                  toPorts:
                    - ports:
                        - port: "8080"
                          protocol: TCP
                - fromEntities:
                    - host
                  toPorts:
                    - ports:
                        - port: "8080"
                          protocol: TCP
          - apiVersion: cilium.io/v2
            kind: CiliumNetworkPolicy
            metadata:
              name: zitadel-bootstrap-egress
              namespace: '{{ .Release.Namespace }}'
            spec:
              egress:
                - toEntities:
                    - kube-apiserver
                  toPorts:
                    - ports:
                        - port: "6443"
                          protocol: TCP
              endpointSelector:
                matchLabels:
                  k8s:app.kubernetes.io/component: setup
                  k8s:app.kubernetes.io/instance: zitadel
                  k8s:app.kubernetes.io/name: zitadel
        gateway:
          grpcRoute:
            enabled: true
            hostnames:
              - auth.walnuts.dev
            parentRefs:
              - group: gateway.networking.k8s.io
                kind: Gateway
                name: envoy-gateway
                namespace: envoy-gateway-system
          httpRoute:
            enabled: true
            hostnames:
              - auth.walnuts.dev
            parentRefs:
              - group: gateway.networking.k8s.io
                kind: Gateway
                name: envoy-gateway
                namespace: envoy-gateway-system
        login:
          enabled: false
        metrics:
          enabled: true
          serviceMonitor:
            enabled: true
        replicaCount: 1
        resources:
          limits:
            cpu: "1"
            memory: 1Gi
          requests:
            cpu: 30m
            memory: 350Mi
        tools:
          kubectl:
            image:
              tag: 1.36.4
        topologySpreadConstraints:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/name: zitadel
            maxSkew: 1
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: ScheduleAnyway
        zitadel:
          configSecretKey: config.yaml
          configSecretName: zitadel
          configmapConfig:
            ExternalDomain: auth.walnuts.dev
            ExternalPort: 443
            ExternalSecure: true
            Log:
              Formatter:
                Format: json
            TLS:
              Enabled: false
            Tracing:
              Endpoint: default-collector.opentelemetry-collector.svc.cluster.local:4317
              Type: otel
          masterkeySecretName: zitadel
    repoURL: https://charts.zitadel.com
    targetRevision: 10.3.0
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - FailOnSharedResource=true
