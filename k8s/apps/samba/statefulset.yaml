apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app: samba
    app.kubernetes.io/name: samba
  name: samba
  namespace: samba
spec:
  replicas: 1
  selector:
    matchLabels:
      app: samba
      app.kubernetes.io/name: samba
  serviceName: samba
  template:
    metadata:
      annotations:
        checksum/samba-monitor-config: 8cb092cbb3559892f4e5b22bfbb171df
      labels:
        app: samba
        app.kubernetes.io/name: samba
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: storage.walnuts.dev/slow
                    operator: DoesNotExist
      containers:
        - args:
            - runsvdir
            - -P
            - /container/config/runit
          command:
            - /bin/sh
            - /config/samba-entrypoint.sh
          env:
            - name: ACCOUNT_samba
              valueFrom:
                secretKeyRef:
                  key: account-samba
                  name: samba-secret-886ec5
            - name: SAMBA_CONF_LOG_LEVEL
              value: "3"
            - name: WSDD2_DISABLE
              value: "1"
            - name: AVAHI_DISABLE
              value: "1"
            - name: GROUPS_samba
              value: samba
            - name: SAMBA_VOLUME_CONFIG_share
              value: '[share]; path=/samba-share; valid users = samba; public = no; read only = no; browseable = yes; available = yes'
            - name: SAMBA_GLOBAL_CONFIG_smb_SPACE_ports
              value: 10445 10139
          image: ghcr.io/servercontainers/samba:a3.24.2-s4.23.8-r0@sha256:ea1b37536729f16b2f45a601ea45a37d34b9fce5cc51f2d686a347dd77131be1
          imagePullPolicy: IfNotPresent
          name: samba
          ports:
            - containerPort: 10445
              name: samba
          resources:
            limits:
              cpu: "1"
              memory: 6Gi
            requests:
              cpu: 10m
              memory: 128Mi
          volumeMounts:
            - mountPath: /samba-share
              name: root
            - mountPath: /config
              name: monitor-entrypoint
              readOnly: true
            - mountPath: /run/secrets
              name: monitor-credentials
              readOnly: true
            - mountPath: /samba-share/books
              name: books
            - mountPath: /samba-share/CameraRoll
              name: camera-roll
            - mountPath: /samba-share/mega
              name: mega
            - mountPath: /samba-share/movies
              name: movies
            - mountPath: /samba-share/musics
              name: musics
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      volumes:
        - configMap:
            name: samba-monitor
          name: monitor-entrypoint
        - name: monitor-credentials
          secret:
            defaultMode: 288
            items:
              - key: monitor-username
                path: username
              - key: monitor-password
                path: password
            secretName: samba-secret-886ec5
        - name: root
          persistentVolumeClaim:
            claimName: root
        - name: books
          persistentVolumeClaim:
            claimName: books
        - name: camera-roll
          persistentVolumeClaim:
            claimName: camera-roll
        - name: mega
          persistentVolumeClaim:
            claimName: mega
        - name: movies
          persistentVolumeClaim:
            claimName: movies
        - name: musics
          persistentVolumeClaim:
            claimName: musics
