apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: samba-secret-886ec5
spec:
  data:
    - remoteRef:
        key: samba
        property: password
      secretKey: account-samba
    - remoteRef:
        key: samba
        property: monitor-username
      secretKey: monitor-username
    - remoteRef:
        key: samba
        property: monitor-password
      secretKey: monitor-password
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: samba-secret-886ec5
    template:
      engineVersion: v2
      type: Opaque
