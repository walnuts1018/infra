k8sServiceHost: 192.168.4.11
cluster:
  id: 1
  name: kurumi
l2announcements:
  enabled: true
ingressController:
  enabled: true
  loadbalancerMode: shared
  default: true
  enforceHttps: true
  service:
    loadBalancerIP: 192.168.12.129
  defaultSecretName: cloudflare-origin-cert
  defaultSecretNamespace: cilium-system
  secretsNamespace:
    create: false
    name: cilium-secrets
    sync: true
nodePort:
  enabled: true
hubble:
  tls:
    auto:
      method: cronJob
  relay:
    enabled: true
    prometheus:
      enabled: true
      serviceMonitor:
        enabled: true
    resources:
      requests:
        cpu: 5m
        memory: 48Mi
      limits:
        memory: 512Mi
  ui:
    enabled: true
    backend:
      resources:
        requests:
          cpu: 5m
          memory: 60Mi
        limits:
          memory: 256Mi
    frontend:
      resources:
        requests:
          cpu: 1m
          memory: 10Mi
        limits:
          memory: 256Mi
  metrics:
    enableOpenMetrics: true
    enabled:
    - dns
    - drop
    - tcp
    - flow:labelsContext=source_namespace,source_workload_kind,source_workload,destination_namespace,destination_workload_kind,destination_workload,traffic_direction
    - flows-to-world
    - port-distribution
    - icmp
    - httpV2:exemplars=true;
    serviceMonitor:
      enabled: true
    dashboards:
      enabled: true
envoy:
  prometheus:
    serviceMonitor:
      enabled: true
operator:
  prometheus:
    serviceMonitor:
      enabled: true
prometheus:
  enabled: true
  serviceMonitor:
    enabled: true
    trustCRDsExist: true
envoyConfig:
  enabled: true
  secretsNamespace:
    create: false
    name: cilium-secrets
tls:
  secretsNamespace:
    create: false
    name: cilium-secrets
