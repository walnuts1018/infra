apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  name: seaweedfs-operator-helm
  namespace: argocd
spec:
  destination:
    namespace: seaweedfs-operator
    server: https://kubernetes.default.svc
  project: default
  source:
    chart: seaweedfs-operator
    helm:
      releaseName: seaweedfs-operator
      values: |
        replicaCount: 1

        grafanaDashboard:
          enabled: true

        serviceMonitor:
          enabled: true

        resources:
          requests:
            cpu: 5m
            memory: 80Mi
          limits:
            memory: 256Mi
    repoURL: https://seaweedfs.github.io/seaweedfs-operator/
    targetRevision: 0.1.40
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - FailOnSharedResource=true
