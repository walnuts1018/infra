apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agr-server
  namespace: agr
spec:
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
      to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
    - ports:
        - port: 5432
          protocol: TCP
      to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: databases
          podSelector:
            matchLabels:
              cnpg.io/cluster: postgresql-default
              cnpg.io/instanceRole: primary
    - ports:
        - port: 4317
          protocol: TCP
      to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: opentelemetry-collector
          podSelector:
            matchLabels:
              app.kubernetes.io/component: opentelemetry-collector
              app.kubernetes.io/instance: opentelemetry-collector.default
              app.kubernetes.io/name: default-collector
    - ports:
        - port: 8333
          protocol: TCP
      to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: seaweedfs
          podSelector:
            matchLabels:
              app.kubernetes.io/component: s3
              app.kubernetes.io/instance: seaweedfs-default
              app.kubernetes.io/name: seaweedfs
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway-system
          podSelector:
            matchLabels:
              app.kubernetes.io/component: proxy
              app.kubernetes.io/managed-by: envoy-gateway
              app.kubernetes.io/name: envoy
      ports:
        - port: 8080
          protocol: TCP
    - from:
        - podSelector:
            matchLabels:
              app: agr-learning
              app.kubernetes.io/name: agr-learning
      ports:
        - port: 8080
          protocol: TCP
        - port: 8081
          protocol: TCP
  podSelector:
    matchLabels:
      app: agr-server
      app.kubernetes.io/name: agr-server
  policyTypes:
    - Ingress
    - Egress
