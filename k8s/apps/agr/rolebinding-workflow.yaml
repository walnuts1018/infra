apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agr-workflow
  namespace: agr
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agr-workflow
subjects:
  - kind: ServiceAccount
    name: agr-workflow
    namespace: agr
  - kind: ServiceAccount
    name: agr-workflow-executor
    namespace: agr
