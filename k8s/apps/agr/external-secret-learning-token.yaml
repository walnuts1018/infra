apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agr-learning-token
  namespace: agr
spec:
  data:
    - remoteRef:
        key: terraform-external-secrets
        property: agr-gateway-token
      secretKey: gateway_token
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: agr-learning-token
    template:
      data:
        SERVICE_GATEWAY_TOKEN: '{{ .gateway_token }}'
      engineVersion: v2
      type: Opaque
