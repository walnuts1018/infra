apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: agr-learning-apiserver-egress
  namespace: agr
spec:
  egress:
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "6443"
              protocol: TCP
  endpointSelector:
    matchLabels:
      app: agr-learning
      app.kubernetes.io/name: agr-learning
