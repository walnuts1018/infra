apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agr-oidc
  namespace: agr
spec:
  data:
    - remoteRef:
        key: terraform-external-secrets
        property: agr-client-id
      secretKey: client-id
    - remoteRef:
        key: terraform-external-secrets
        property: agr-client-secret
      secretKey: client-secret
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: agr-oidc
    template:
      engineVersion: v2
      type: Opaque
