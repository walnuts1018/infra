apiVersion: v1
kind: Service
metadata:
  labels:
    app: agr-server
    app.kubernetes.io/name: agr-server
  name: agr-server
  namespace: agr
spec:
  ports:
    - name: grpc-web
      port: 8080
      protocol: TCP
      targetPort: 8080
    - name: health
      port: 8081
      protocol: TCP
      targetPort: 8081
  selector:
    app: agr-server
    app.kubernetes.io/name: agr-server
  type: ClusterIP
