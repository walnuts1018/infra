apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  labels:
    workflows.argoproj.io/archive-strategy: always
  name: agr-learning
  namespace: agr
spec:
  activeDeadlineSeconds: 1.2096e+06
  arguments:
    parameters:
      - name: trigger
      - name: retry-generation-id
        value: ""
  entrypoint: learning
  executor:
    serviceAccountName: agr-workflow-executor
  imagePullSecrets:
    - name: ghcr-login-secret
  onExit: cleanup
  podGC:
    strategy: OnWorkflowCompletion
  podMetadata:
    labels:
      app: agr-workflow
      app.kubernetes.io/name: agr-workflow
  serviceAccountName: agr-workflow
  synchronization:
    mutexes:
      - name: agr-training
  templates:
    - dag:
        tasks:
          - arguments:
              parameters:
                - name: trigger
                  value: '{{workflow.parameters.trigger}}'
                - name: retry-generation-id
                  value: '{{workflow.parameters.retry-generation-id}}'
            name: create-attempt
            template: create-attempt
          - arguments:
              parameters:
                - name: generation-id
                  value: '{{tasks.create-attempt.outputs.parameters.generation-id}}'
            depends: create-attempt.Succeeded
            name: plan
            template: plan
            when: '{{tasks.create-attempt.outputs.parameters.skipped}} == false'
          - arguments:
              parameters:
                - name: generation-id
                  value: '{{tasks.plan.outputs.parameters.generation-id}}'
                - name: config-sha256
                  value: '{{tasks.plan.outputs.parameters.config-sha256}}'
                - name: plan-uri
                  value: '{{tasks.plan.outputs.parameters.plan-uri}}'
                - name: shard-count
                  value: '{{tasks.plan.outputs.parameters.rollout-shards}}'
                - name: actor-pods
                  value: '{{tasks.plan.outputs.parameters.actor-pods}}'
            depends: plan.Succeeded
            name: rollout
            template: rollout
          - arguments:
              parameters:
                - name: generation-id
                  value: '{{tasks.plan.outputs.parameters.generation-id}}'
                - name: plan-uri
                  value: '{{tasks.plan.outputs.parameters.plan-uri}}'
            depends: rollout.Succeeded
            name: dataset
            template: dataset
          - arguments:
              parameters:
                - name: generation-id
                  value: '{{tasks.plan.outputs.parameters.generation-id}}'
                - name: plan-uri
                  value: '{{tasks.plan.outputs.parameters.plan-uri}}'
                - name: dataset-uri
                  value: '{{tasks.dataset.outputs.parameters.dataset-uri}}'
                - name: learner-artifact-uri
                  value: '{{tasks.plan.outputs.parameters.learner-artifact-uri}}'
                - name: learner-sha256
                  value: '{{tasks.plan.outputs.parameters.learner-sha256}}'
            depends: dataset.Succeeded
            name: train
            template: train
          - arguments:
              parameters:
                - name: generation-id
                  value: '{{tasks.plan.outputs.parameters.generation-id}}'
                - name: plan-uri
                  value: '{{tasks.plan.outputs.parameters.plan-uri}}'
            depends: train.Succeeded
            name: validate
            template: validate
          - arguments:
              parameters:
                - name: generation-id
                  value: '{{tasks.plan.outputs.parameters.generation-id}}'
                - name: config-sha256
                  value: '{{tasks.plan.outputs.parameters.config-sha256}}'
                - name: plan-uri
                  value: '{{tasks.plan.outputs.parameters.plan-uri}}'
                - name: shard-count
                  value: '{{tasks.plan.outputs.parameters.evaluation-shards}}'
                - name: evaluation-pods
                  value: '{{tasks.plan.outputs.parameters.evaluation-pods}}'
                - name: artifact-uri
                  value: '{{tasks.validate.outputs.parameters.artifact-uri}}'
                - name: model-sha256
                  value: '{{tasks.validate.outputs.parameters.model-sha256}}'
                - name: manifest-sha256
                  value: '{{tasks.validate.outputs.parameters.manifest-sha256}}'
                - name: validation-uri
                  value: '{{tasks.validate.outputs.parameters.validation-uri}}'
            depends: validate.Succeeded
            name: assess
            template: assess
          - arguments:
              parameters:
                - name: generation-id
                  value: '{{tasks.plan.outputs.parameters.generation-id}}'
                - name: plan-uri
                  value: '{{tasks.plan.outputs.parameters.plan-uri}}'
            depends: assess.Succeeded
            name: aggregate
            template: aggregate
          - arguments:
              parameters:
                - name: generation-id
                  value: '{{tasks.plan.outputs.parameters.generation-id}}'
                - name: plan-uri
                  value: '{{tasks.plan.outputs.parameters.plan-uri}}'
                - name: report-uri
                  value: '{{tasks.aggregate.outputs.parameters.report-uri}}'
            depends: aggregate.Succeeded
            name: decide
            template: decide
          - arguments:
              parameters:
                - name: generation-id
                  value: '{{tasks.plan.outputs.parameters.generation-id}}'
                - name: plan-uri
                  value: '{{tasks.plan.outputs.parameters.plan-uri}}'
                - name: report-uri
                  value: '{{tasks.aggregate.outputs.parameters.report-uri}}'
                - name: model-id
                  value: '{{tasks.train.outputs.parameters.model-id}}'
            depends: decide.Succeeded
            name: publish
            template: publish
            when: '{{tasks.decide.outputs.parameters.promote}} == true'
          - arguments:
              parameters:
                - name: generation-id
                  value: '{{tasks.plan.outputs.parameters.generation-id}}'
                - name: plan-uri
                  value: '{{tasks.plan.outputs.parameters.plan-uri}}'
            depends: publish.Succeeded
            name: verify
            template: verify
      name: learning
    - container:
        args:
          - --argo-output-dir
          - /tmp/plan-output
          - --max-actor-pods
          - "1"
          - --max-evaluation-pods
          - "1"
        command:
          - /app/.venv/bin/agr-plan
        env:
          - name: AWS_ENDPOINT_URL_S3
            value: http://seaweedfs-default-s3.seaweedfs.svc.cluster.local:8333
          - name: AWS_ENDPOINT_URL_STS
            value: https://seaweedfs.local.walnuts.dev
          - name: AWS_ROLE_ARN
            value: arn:aws:iam::role/agr-planner
          - name: AWS_WEB_IDENTITY_TOKEN_FILE
            value: /var/run/secrets/sts.seaweedfs.com/serviceaccount/token
          - name: AWS_REGION
            value: us-east-1
          - name: WORKER_S3_BUCKET
            value: agr-ai
          - name: WORKER_S3_PREFIX
            value: worker-runs
          - name: WORKER_CONTROLLER_ID
            value: agr-planner
          - name: AGR_WORKFLOW_UID
            value: '{{workflow.uid}}'
          - name: SERVICE_ENDPOINT
            value: http://agr-server.agr.svc.cluster.local:8080
          - name: SERVICE_GATEWAY_TOKEN
            valueFrom:
              secretKeyRef:
                key: SERVICE_GATEWAY_TOKEN
                name: agr-learning-token
          - name: AGR_TRAINING_IMAGE_REFERENCE
            value: ghcr.io/walnuts1018/agr-training:0.1.45@sha256:c2cd3c27105d65c1235f84805cfb6d14c7836bde228fe1a6e329f09eed589009
          - name: AGR_WORKFLOW_GENERATION_ID
            value: '{{inputs.parameters.generation-id}}'
        image: ghcr.io/walnuts1018/agr-training:0.1.45@sha256:c2cd3c27105d65c1235f84805cfb6d14c7836bde228fe1a6e329f09eed589009
        resources:
          limits:
            cpu: 500m
            ephemeral-storage: 1Gi
            memory: 4Gi
          requests:
            cpu: 100m
            ephemeral-storage: 128Mi
            memory: 1Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          readOnlyRootFilesystem: true
          runAsGroup: 10001
          runAsNonRoot: true
          runAsUser: 10001
        volumeMounts:
          - mountPath: /var/run/secrets/sts.seaweedfs.com/serviceaccount
            name: sts-token
            readOnly: true
          - mountPath: /tmp
            name: tmp
      inputs:
        parameters:
          - name: generation-id
      name: plan
      outputs:
        parameters:
          - name: generation-id
            valueFrom:
              path: /tmp/plan-output/generation-id
          - name: generation-number
            valueFrom:
              path: /tmp/plan-output/generation-number
          - name: attempt-id
            valueFrom:
              path: /tmp/plan-output/attempt-id
          - name: config-sha256
            valueFrom:
              path: /tmp/plan-output/config-sha256
          - name: plan-uri
            valueFrom:
              path: /tmp/plan-output/plan-uri
          - name: rollout-shards
            valueFrom:
              path: /tmp/plan-output/rollout-shards
          - name: actor-pods
            valueFrom:
              path: /tmp/plan-output/actor-pods
          - name: evaluation-shards
            valueFrom:
              path: /tmp/plan-output/evaluation-shards
          - name: evaluation-pods
            valueFrom:
              path: /tmp/plan-output/evaluation-pods
          - name: learner-artifact-uri
            valueFrom:
              path: /tmp/plan-output/learner-artifact-uri
          - name: learner-sha256
            valueFrom:
              path: /tmp/plan-output/learner-sha256
      podSpecPatch: '{"priorityClassName":"agr-learning","securityContext":{"runAsGroup":10001,"runAsNonRoot":true,"runAsUser":10001,"seccompProfile":{"type":"RuntimeDefault"}}}'
      serviceAccountName: agr-planner
      volumes:
        - name: sts-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: sts.seaweedfs.com
                  expirationSeconds: 3600
                  path: token
        - emptyDir:
            sizeLimit: 1Gi
          name: tmp
    - dag:
        tasks:
          - arguments:
              parameters:
                - name: generation-id
                  value: '{{inputs.parameters.generation-id}}'
                - name: config-sha256
                  value: '{{inputs.parameters.config-sha256}}'
                - name: plan-uri
                  value: '{{inputs.parameters.plan-uri}}'
                - name: shard-count
                  value: '{{inputs.parameters.shard-count}}'
                - name: actor-pods
                  value: '{{inputs.parameters.actor-pods}}'
            name: apply-job
            template: apply-rollout-job
          - arguments:
              parameters:
                - name: shard-count
                  value: '{{inputs.parameters.shard-count}}'
            dependencies:
              - apply-job
            name: wait-indexed-job
            template: wait-rollout-indexed-job
      inputs:
        parameters:
          - name: generation-id
          - name: config-sha256
          - name: plan-uri
          - name: shard-count
          - name: actor-pods
      name: rollout
    - container:
        args:
          - --argo-output-dir
          - /tmp/dataset-output
        command:
          - /app/.venv/bin/agr-build-dataset
        env:
          - name: AWS_ENDPOINT_URL_S3
            value: http://seaweedfs-default-s3.seaweedfs.svc.cluster.local:8333
          - name: AWS_ENDPOINT_URL_STS
            value: https://seaweedfs.local.walnuts.dev
          - name: AWS_ROLE_ARN
            value: arn:aws:iam::role/agr-dataset
          - name: AWS_WEB_IDENTITY_TOKEN_FILE
            value: /var/run/secrets/sts.seaweedfs.com/serviceaccount/token
          - name: AWS_REGION
            value: us-east-1
          - name: WORKER_S3_BUCKET
            value: agr-ai
          - name: WORKER_S3_PREFIX
            value: worker-runs
          - name: WORKER_CONTROLLER_ID
            value: agr-dataset
          - name: AGR_WORKFLOW_UID
            value: '{{workflow.uid}}'
          - name: WORKER_S3_ENDPOINT
            value: http://seaweedfs-default-s3.seaweedfs.svc.cluster.local:8333
          - name: SERVICE_ENDPOINT
            value: http://agr-server.agr.svc.cluster.local:8080
          - name: SERVICE_GATEWAY_TOKEN
            valueFrom:
              secretKeyRef:
                key: SERVICE_GATEWAY_TOKEN
                name: agr-learning-token
          - name: OMP_NUM_THREADS
            value: "1"
          - name: MKL_NUM_THREADS
            value: "1"
          - name: AGR_TRAINING_IMAGE_REFERENCE
            value: ghcr.io/walnuts1018/agr-training:0.1.45@sha256:c2cd3c27105d65c1235f84805cfb6d14c7836bde228fe1a6e329f09eed589009
          - name: AGR_WORKFLOW_GENERATION_ID
            value: '{{inputs.parameters.generation-id}}'
          - name: AGR_WORKFLOW_PLAN_URI
            value: '{{inputs.parameters.plan-uri}}'
        image: ghcr.io/walnuts1018/agr-training:0.1.45@sha256:c2cd3c27105d65c1235f84805cfb6d14c7836bde228fe1a6e329f09eed589009
        resources:
          limits:
            cpu: 500m
            ephemeral-storage: 4Gi
            memory: 1Gi
          requests:
            cpu: 100m
            ephemeral-storage: 512Mi
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          readOnlyRootFilesystem: true
          runAsGroup: 10001
          runAsNonRoot: true
          runAsUser: 10001
        volumeMounts:
          - mountPath: /var/run/secrets/sts.seaweedfs.com/serviceaccount
            name: sts-token
            readOnly: true
          - mountPath: /tmp
            name: tmp
      inputs:
        parameters:
          - name: generation-id
          - name: plan-uri
      name: dataset
      outputs:
        parameters:
          - name: dataset-uri
            valueFrom:
              path: /tmp/dataset-output/dataset-uri
      podSpecPatch: '{"priorityClassName":"agr-learning","securityContext":{"runAsGroup":10001,"runAsNonRoot":true,"runAsUser":10001,"seccompProfile":{"type":"RuntimeDefault"}}}'
      serviceAccountName: agr-dataset
      volumes:
        - name: sts-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: sts.seaweedfs.com
                  expirationSeconds: 3600
                  path: token
        - emptyDir:
            sizeLimit: 4Gi
          name: tmp
    - container:
        args:
          - --s3-input-uri
          - '{{inputs.parameters.dataset-uri}}'
          - --s3-output-uri
          - s3://agr-ai/worker-runs/models/candidates/{{inputs.parameters.generation-id}}
          - --initial-artifact-uri
          - '{{inputs.parameters.learner-artifact-uri}}'
          - --behavior-policy-id
          - shared-policy-v3
          - --behavior-policy-artifact-sha256
          - '{{inputs.parameters.learner-sha256}}'
          - --argo-output-dir
          - /tmp/train-output
        command:
          - /app/.venv/bin/agr-train
        env:
          - name: AWS_ENDPOINT_URL_S3
            value: http://seaweedfs-default-s3.seaweedfs.svc.cluster.local:8333
          - name: AWS_ENDPOINT_URL_STS
            value: https://seaweedfs.local.walnuts.dev
          - name: AWS_ROLE_ARN
            value: arn:aws:iam::role/agr-trainer
          - name: AWS_WEB_IDENTITY_TOKEN_FILE
            value: /var/run/secrets/sts.seaweedfs.com/serviceaccount/token
          - name: AWS_REGION
            value: us-east-1
          - name: WORKER_S3_BUCKET
            value: agr-ai
          - name: WORKER_S3_PREFIX
            value: worker-runs
          - name: WORKER_CONTROLLER_ID
            value: agr-trainer
          - name: AGR_WORKFLOW_UID
            value: '{{workflow.uid}}'
          - name: SERVICE_ENDPOINT
            value: http://agr-server.agr.svc.cluster.local:8080
          - name: SERVICE_GATEWAY_TOKEN
            valueFrom:
              secretKeyRef:
                key: SERVICE_GATEWAY_TOKEN
                name: agr-learning-token
          - name: OMP_NUM_THREADS
            value: "2"
          - name: MKL_NUM_THREADS
            value: "2"
          - name: OPENBLAS_NUM_THREADS
            value: "2"
          - name: TORCH_NUM_THREADS
            value: "2"
          - name: AGR_TRAINING_IMAGE_REFERENCE
            value: ghcr.io/walnuts1018/agr-training:0.1.45@sha256:c2cd3c27105d65c1235f84805cfb6d14c7836bde228fe1a6e329f09eed589009
          - name: AGR_WORKFLOW_GENERATION_ID
            value: '{{inputs.parameters.generation-id}}'
          - name: AGR_WORKFLOW_PLAN_URI
            value: '{{inputs.parameters.plan-uri}}'
          - name: AGR_WORKFLOW_INPUT_URI
            value: '{{inputs.parameters.dataset-uri}}'
          - name: AGR_WORKFLOW_OUTPUT_URI
            value: s3://agr-ai/worker-runs/models/candidates/{{inputs.parameters.generation-id}}
          - name: AGR_WORKFLOW_LEARNER_URI
            value: '{{inputs.parameters.learner-artifact-uri}}'
          - name: AGR_WORKFLOW_LEARNER_SHA256
            value: '{{inputs.parameters.learner-sha256}}'
          - name: AGR_WORKFLOW_BEHAVIOR_POLICY_SHA256
            value: '{{inputs.parameters.learner-sha256}}'
        image: ghcr.io/walnuts1018/agr-training:0.1.45@sha256:c2cd3c27105d65c1235f84805cfb6d14c7836bde228fe1a6e329f09eed589009
