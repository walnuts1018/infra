apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  labels:
    workflows.argoproj.io/archive-strategy: always
  name: agr-learning
  namespace: agr
spec:
  activeDeadlineSeconds: 1.2096e+06
  arguments:
    parameters:
      - name: trigger
      - name: retry-generation-id
        value: ""
  entrypoint: learning
  executor:
    serviceAccountName: agr-workflow-executor
  imagePullSecrets:
    - name: ghcr-login-secret
  onExit: finalize
  podGC:
    strategy: OnWorkflowCompletion
  podMetadata:
    labels:
      app: agr-workflow
      app.kubernetes.io/name: agr-workflow
  serviceAccountName: agr-workflow
  synchronization:
    mutexes:
      - name: agr-training
  templates:
    - dag:
        tasks:
          - arguments:
              parameters:
                - name: trigger
                  value: '{{workflow.parameters.trigger}}'
                - name: retry-generation-id
                  value: '{{workflow.parameters.retry-generation-id}}'
            name: create-attempt
            template: create-attempt
          - arguments:
              parameters:
                - name: generation-id
                  value: '{{tasks.create-attempt.outputs.parameters.generation-id}}'
            depends: create-attempt.Succeeded
            name: plan
            template: plan
            when: '{{tasks.create-attempt.outputs.parameters.skipped}} == false'
          - arguments:
              parameters:
                - name: generation-id
                  value: '{{tasks.plan.outputs.parameters.generation-id}}'
                - name: plan-uri
                  value: '{{tasks.plan.outputs.parameters.plan-uri}}'
                - name: plan-sha256
                  value: '{{tasks.plan.outputs.parameters.plan-sha256}}'
                - name: unit-count
                  value: '{{tasks.plan.outputs.parameters.rollout-unit-count}}'
            depends: plan.Succeeded
            name: rollout
            template: rollout
          - arguments:
              parameters:
                - name: generation-id
                  value: '{{tasks.plan.outputs.parameters.generation-id}}'
                - name: plan-uri
                  value: '{{tasks.plan.outputs.parameters.plan-uri}}'
                - name: plan-sha256
                  value: '{{tasks.plan.outputs.parameters.plan-sha256}}'
                - name: stage
                  value: rollout
                - name: look-index
                  value: "0"
                - name: unit-count
                  value: '{{tasks.plan.outputs.parameters.rollout-unit-count}}'
            depends: rollout.Succeeded
            name: verify-rollout
            template: verify-rollout
          - arguments:
              parameters:
                - name: generation-id
                  value: '{{tasks.plan.outputs.parameters.generation-id}}'
                - name: plan-uri
                  value: '{{tasks.plan.outputs.parameters.plan-uri}}'
                - name: plan-sha256
                  value: '{{tasks.plan.outputs.parameters.plan-sha256}}'
            depends: verify-rollout.Succeeded
            name: dataset
            template: dataset
          - arguments:
              parameters:
                - name: generation-id
                  value: '{{tasks.plan.outputs.parameters.generation-id}}'
                - name: plan-uri
                  value: '{{tasks.plan.outputs.parameters.plan-uri}}'
                - name: dataset-uri
                  value: '{{tasks.dataset.outputs.parameters.dataset-uri}}'
                - name: learner-artifact-uri
                  value: '{{tasks.plan.outputs.parameters.learner-artifact-uri}}'
                - name: learner-sha256
                  value: '{{tasks.plan.outputs.parameters.learner-sha256}}'
            depends: dataset.Succeeded
            name: train
            template: train
          - arguments:
              parameters:
                - name: generation-id
                  value: '{{tasks.plan.outputs.parameters.generation-id}}'
                - name: plan-uri
                  value: '{{tasks.plan.outputs.parameters.plan-uri}}'
            depends: train.Succeeded
            name: validate
            template: validate
          - arguments:
              parameters:
                - name: generation-id
                  value: '{{tasks.plan.outputs.parameters.generation-id}}'
                - name: plan-uri
                  value: '{{tasks.plan.outputs.parameters.plan-uri}}'
                - name: plan-sha256
                  value: '{{tasks.plan.outputs.parameters.plan-sha256}}'
                - name: look-1-unit-count
                  value: '{{tasks.plan.outputs.parameters.evaluation-look-1-unit-count}}'
                - name: look-2-unit-count
                  value: '{{tasks.plan.outputs.parameters.evaluation-look-2-unit-count}}'
                - name: look-3-unit-count
                  value: '{{tasks.plan.outputs.parameters.evaluation-look-3-unit-count}}'
                - name: look-4-unit-count
                  value: '{{tasks.plan.outputs.parameters.evaluation-look-4-unit-count}}'
            depends: validate.Succeeded
            name: evaluation
            template: evaluation
          - arguments:
              parameters:
                - name: generation-id
                  value: '{{tasks.plan.outputs.parameters.generation-id}}'
                - name: plan-uri
                  value: '{{tasks.plan.outputs.parameters.plan-uri}}'
                - name: plan-sha256
                  value: '{{tasks.plan.outputs.parameters.plan-sha256}}'
            depends: evaluation.Succeeded
            name: aggregate
            template: aggregate
            when: '{{tasks.evaluation.outputs.parameters.look-1-rejected}} == false && {{tasks.evaluation.outputs.parameters.look-2-rejected}} == false && {{tasks.evaluation.outputs.parameters.look-3-rejected}} == false && {{tasks.evaluation.outputs.parameters.look-4-rejected}} == false'
          - arguments:
              parameters:
                - name: generation-id
                  value: '{{tasks.plan.outputs.parameters.generation-id}}'
                - name: plan-uri
                  value: '{{tasks.plan.outputs.parameters.plan-uri}}'
                - name: plan-sha256
                  value: '{{tasks.plan.outputs.parameters.plan-sha256}}'
                - name: look-1-rejected
                  value: '{{tasks.evaluation.outputs.parameters.look-1-rejected}}'
                - name: look-2-rejected
                  value: '{{tasks.evaluation.outputs.parameters.look-2-rejected}}'
                - name: look-3-rejected
                  value: '{{tasks.evaluation.outputs.parameters.look-3-rejected}}'
                - name: look-4-rejected
                  value: '{{tasks.evaluation.outputs.parameters.look-4-rejected}}'
            depends: evaluation.Succeeded
            name: record-rejection
            template: record-rejection
            when: '{{tasks.evaluation.outputs.parameters.look-1-rejected}} == true || {{tasks.evaluation.outputs.parameters.look-2-rejected}} == true || {{tasks.evaluation.outputs.parameters.look-3-rejected}} == true || {{tasks.evaluation.outputs.parameters.look-4-rejected}} == true'
          - arguments:
              parameters:
                - name: generation-id
                  value: '{{tasks.plan.outputs.parameters.generation-id}}'
                - name: plan-uri
                  value: '{{tasks.plan.outputs.parameters.plan-uri}}'
                - name: report-uri
                  value: '{{tasks.aggregate.outputs.parameters.report-uri}}'
            depends: evaluation.Succeeded && aggregate.Succeeded
            name: decide
            template: decide
            when: '{{tasks.evaluation.outputs.parameters.look-1-rejected}} == false && {{tasks.evaluation.outputs.parameters.look-2-rejected}} == false && {{tasks.evaluation.outputs.parameters.look-3-rejected}} == false && {{tasks.evaluation.outputs.parameters.look-4-rejected}} == false'
          - arguments:
              parameters:
                - name: generation-id
                  value: '{{tasks.plan.outputs.parameters.generation-id}}'
                - name: plan-uri
                  value: '{{tasks.plan.outputs.parameters.plan-uri}}'
                - name: report-uri
                  value: '{{tasks.aggregate.outputs.parameters.report-uri}}'
                - name: model-id
                  value: '{{tasks.train.outputs.parameters.model-id}}'
            depends: decide.Succeeded
            name: publish
            template: publish
            when: '{{tasks.decide.outputs.parameters.promote}} == true'
          - arguments:
              parameters:
                - name: generation-id
                  value: '{{tasks.plan.outputs.parameters.generation-id}}'
                - name: plan-uri
                  value: '{{tasks.plan.outputs.parameters.plan-uri}}'
            depends: publish.Succeeded
            name: verify
            template: verify
      name: learning
    - container:
        args:
          - --argo-output-dir
          - /tmp/create-attempt-output
        command:
          - /app/.venv/bin/agr-create-attempt
        env:
          - name: AWS_ENDPOINT_URL_S3
            value: http://seaweedfs-default-s3.seaweedfs.svc.cluster.local:8333
          - name: AWS_ENDPOINT_URL_STS
            value: https://seaweedfs.local.walnuts.dev
          - name: AWS_ROLE_ARN
            value: arn:aws:iam::role/agr-planner
          - name: AWS_WEB_IDENTITY_TOKEN_FILE
            value: /var/run/secrets/sts.seaweedfs.com/serviceaccount/token
          - name: AWS_REGION
            value: us-east-1
          - name: WORKER_S3_BUCKET
            value: agr-ai
          - name: WORKER_S3_PREFIX
            value: worker-runs
          - name: WORKER_CONTROLLER_ID
            value: agr-planner
          - name: AGR_WORKFLOW_UID
            value: '{{workflow.uid}}'
          - name: SERVICE_ENDPOINT
            value: http://agr-server.agr.svc.cluster.local:8080
          - name: SERVICE_GATEWAY_TOKEN
            valueFrom:
              secretKeyRef:
                key: SERVICE_GATEWAY_TOKEN
                name: agr-learning-token
          - name: AGR_TRAINING_IMAGE_REFERENCE
            value: ghcr.io/walnuts1018/agr-training:0.1.67@sha256:83b33dbc12c06ae5bc75586b133f0d45315407b6382ec0ad917d7f76f79bdb0f
          - name: AGR_WORKFLOW_TRIGGER
            value: '{{inputs.parameters.trigger}}'
          - name: AGR_WORKFLOW_RETRY_GENERATION_ID
            value: '{{inputs.parameters.retry-generation-id}}'
        image: ghcr.io/walnuts1018/agr-training:0.1.67@sha256:83b33dbc12c06ae5bc75586b133f0d45315407b6382ec0ad917d7f76f79bdb0f
        resources:
          limits:
            cpu: 500m
            ephemeral-storage: 1Gi
            memory: 1Gi
          requests:
            cpu: 100m
            ephemeral-storage: 128Mi
            memory: 1Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          readOnlyRootFilesystem: true
          runAsGroup: 10001
          runAsNonRoot: true
          runAsUser: 10001
        volumeMounts:
          - mountPath: /var/run/secrets/sts.seaweedfs.com/serviceaccount
            name: sts-token
            readOnly: true
          - mountPath: /tmp
            name: tmp
      inputs:
        parameters:
          - name: trigger
          - name: retry-generation-id
      name: create-attempt
      outputs:
        parameters:
          - globalName: generation-id
            name: generation-id
            valueFrom:
              path: /tmp/create-attempt-output/generation-id
          - name: generation-number
            valueFrom:
              path: /tmp/create-attempt-output/generation-number
          - globalName: attempt-id
            name: attempt-id
            valueFrom:
              path: /tmp/create-attempt-output/attempt-id
          - name: skipped
            valueFrom:
              path: /tmp/create-attempt-output/skipped
      podSpecPatch: '{"priorityClassName":"agr-learning","securityContext":{"runAsGroup":10001,"runAsNonRoot":true,"runAsUser":10001,"seccompProfile":{"type":"RuntimeDefault"}}}'
      serviceAccountName: agr-planner
      volumes:
        - name: sts-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: sts.seaweedfs.com
                  expirationSeconds: 3600
                  path: token
        - emptyDir:
            sizeLimit: 1Gi
          name: tmp
    - container:
        args:
          - --argo-output-dir
          - /tmp/plan-output
        command:
          - /app/.venv/bin/agr-plan
        env:
          - name: AWS_ENDPOINT_URL_S3
            value: http://seaweedfs-default-s3.seaweedfs.svc.cluster.local:8333
          - name: AWS_ENDPOINT_URL_STS
            value: https://seaweedfs.local.walnuts.dev
          - name: AWS_ROLE_ARN
            value: arn:aws:iam::role/agr-planner
          - name: AWS_WEB_IDENTITY_TOKEN_FILE
            value: /var/run/secrets/sts.seaweedfs.com/serviceaccount/token
          - name: AWS_REGION
            value: us-east-1
          - name: WORKER_S3_BUCKET
            value: agr-ai
          - name: WORKER_S3_PREFIX
            value: worker-runs
          - name: WORKER_CONTROLLER_ID
            value: agr-planner
          - name: AGR_WORKFLOW_UID
            value: '{{workflow.uid}}'
          - name: SERVICE_ENDPOINT
            value: http://agr-server.agr.svc.cluster.local:8080
          - name: SERVICE_GATEWAY_TOKEN
            valueFrom:
              secretKeyRef:
                key: SERVICE_GATEWAY_TOKEN
                name: agr-learning-token
          - name: AGR_TRAINING_IMAGE_REFERENCE
            value: ghcr.io/walnuts1018/agr-training:0.1.67@sha256:83b33dbc12c06ae5bc75586b133f0d45315407b6382ec0ad917d7f76f79bdb0f
          - name: AGR_WORKFLOW_GENERATION_ID
            value: '{{inputs.parameters.generation-id}}'
        image: ghcr.io/walnuts1018/agr-training:0.1.67@sha256:83b33dbc12c06ae5bc75586b133f0d45315407b6382ec0ad917d7f76f79bdb0f
        resources:
          limits:
            cpu: 500m
            ephemeral-storage: 1Gi
            memory: 4Gi
          requests:
            cpu: 100m
            ephemeral-storage: 128Mi
            memory: 1Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          readOnlyRootFilesystem: true
          runAsGroup: 10001
          runAsNonRoot: true
          runAsUser: 10001
        volumeMounts:
          - mountPath: /var/run/secrets/sts.seaweedfs.com/serviceaccount
            name: sts-token
            readOnly: true
          - mountPath: /tmp
            name: tmp
      inputs:
        parameters:
          - name: generation-id
      name: plan
      outputs:
        parameters:
          - name: generation-id
            valueFrom:
              path: /tmp/plan-output/generation-id
          - name: plan-uri
            valueFrom:
              path: /tmp/plan-output/plan-uri
          - name: plan-sha256
            valueFrom:
              path: /tmp/plan-output/plan-sha256
          - name: rollout-unit-count
            valueFrom:
              path: /tmp/plan-output/rollout-unit-count
          - name: evaluation-look-1-unit-count
            valueFrom:
              path: /tmp/plan-output/evaluation-look-1-unit-count
          - name: evaluation-look-2-unit-count
            valueFrom:
              path: /tmp/plan-output/evaluation-look-2-unit-count
          - name: evaluation-look-3-unit-count
            valueFrom:
              path: /tmp/plan-output/evaluation-look-3-unit-count
          - name: evaluation-look-4-unit-count
            valueFrom:
              path: /tmp/plan-output/evaluation-look-4-unit-count
          - name: learner-artifact-uri
            valueFrom:
              path: /tmp/plan-output/learner-artifact-uri
          - name: learner-sha256
            valueFrom:
              path: /tmp/plan-output/learner-sha256
      podSpecPatch: '{"priorityClassName":"agr-learning","securityContext":{"runAsGroup":10001,"runAsNonRoot":true,"runAsUser":10001,"seccompProfile":{"type":"RuntimeDefault"}}}'
      serviceAccountName: agr-planner
      volumes:
        - name: sts-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: sts.seaweedfs.com
                  expirationSeconds: 3600
                  path: token
        - emptyDir:
            sizeLimit: 1Gi
          name: tmp
    - dag:
        tasks:
          - arguments:
              parameters:
                - name: unit-index
                  value: '{{item}}'
                - name: generation-id
                  value: '{{inputs.parameters.generation-id}}'
                - name: plan-uri
                  value: '{{inputs.parameters.plan-uri}}'
                - name: plan-sha256
                  value: '{{inputs.parameters.plan-sha256}}'
            name: unit
            template: rollout-unit
            withSequence:
              count: '{{inputs.parameters.unit-count}}'
              start: "0"
      inputs:
        parameters:
          - name: generation-id
          - name: plan-uri
          - name: plan-sha256
          - name: unit-count
      name: rollout
      parallelism: 2
    - container:
        args:
          - work-unit
          - --generation-id
          - '{{inputs.parameters.generation-id}}'
          - --plan-uri
          - '{{inputs.parameters.plan-uri}}'
          - --plan-sha256
          - '{{inputs.parameters.plan-sha256}}'
          - --stage
          - rollout
          - --look-index
          - "0"
          - --unit-index
          - '{{inputs.parameters.unit-index}}'
        command:
          - worker
        env:
          - name: AWS_ENDPOINT_URL_S3
            value: http://seaweedfs-default-s3.seaweedfs.svc.cluster.local:8333
          - name: AWS_ENDPOINT_URL_STS
            value: https://seaweedfs.local.walnuts.dev
          - name: AWS_ROLE_ARN
            value: arn:aws:iam::role/agr-actor
          - name: AWS_WEB_IDENTITY_TOKEN_FILE
            value: /var/run/secrets/sts.seaweedfs.com/serviceaccount/token
          - name: AWS_REGION
            value: us-east-1
          - name: WORKER_S3_BUCKET
            value: agr-ai
          - name: WORKER_S3_PREFIX
            value: worker-runs
          - name: WORKER_CONTROLLER_ID
            value: agr-actor
          - name: AGR_WORKFLOW_UID
            value: '{{workflow.uid}}'
          - name: AGR_WORKER_IMAGE_REFERENCE
            value: ghcr.io/walnuts1018/agr-worker:0.1.67@sha256:6d0401388a0889e5233f38f5bb329a3aeaba5e279c10a2c81983cf6f0199b6cd
          - name: WORKER_S3_ENDPOINT
            value: http://seaweedfs-default-s3.seaweedfs.svc.cluster.local:8333
          - name: OMP_NUM_THREADS
            value: "1"
        image: ghcr.io/walnuts1018/agr-worker:0.1.67@sha256:6d0401388a0889e5233f38f5bb329a3aeaba5e279c10a2c81983cf6f0199b6cd
        resources:
          limits:
            cpu: "1"
            ephemeral-storage: 3Gi
            memory: 4Gi
          requests:
            cpu: "1"
            ephemeral-storage: 512Mi
            memory: 2Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          readOnlyRootFilesystem: true
          runAsGroup: 10001
          runAsNonRoot: true
          runAsUser: 10001
        volumeMounts:
          - mountPath: /var/run/secrets/sts.seaweedfs.com/serviceaccount
            name: sts-token
            readOnly: true
          - mountPath: /tmp
            name: tmp
      inputs:
        parameters:
          - name: unit-index
          - name: generation-id
          - name: plan-uri
          - name: plan-sha256
      name: rollout-unit
      podSpecPatch: '{"priorityClassName":"agr-learning","securityContext":{"runAsGroup":10001,"runAsNonRoot":true,"runAsUser":10001,"seccompProfile":{"type":"RuntimeDefault"}}}'
      retryStrategy:
        backoff:
          duration: 10s
          factor: 2
          maxDuration: 5m
        expression: lastRetry.status == "Error" || asInt(lastRetry.exitCode) == 75
        limit: "5"
        retryPolicy: Always
      serviceAccountName: agr-actor
      volumes:
        - name: sts-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: sts.seaweedfs.com
                  expirationSeconds: 3600
                  path: token
        - emptyDir:
            sizeLimit: 2Gi
          name: tmp
    - container:
        args:
          - --generation-id
          - '{{inputs.parameters.generation-id}}'
          - --plan-uri
          - '{{inputs.parameters.plan-uri}}'
          - --plan-sha256
          - '{{inputs.parameters.plan-sha256}}'
          - --stage
          - '{{inputs.parameters.stage}}'
          - --look-index
          - '{{inputs.parameters.look-index}}'
          - --unit-count
          - '{{inputs.parameters.unit-count}}'
        command:
          - /app/.venv/bin/agr-verify-rollout
        env:
          - name: AWS_ENDPOINT_URL_S3
            value: http://seaweedfs-default-s3.seaweedfs.svc.cluster.local:8333
          - name: AWS_ENDPOINT_URL_STS
            value: https://seaweedfs.local.walnuts.dev
          - name: AWS_ROLE_ARN
            value: arn:aws:iam::role/agr-dataset
          - name: AWS_WEB_IDENTITY_TOKEN_FILE
            value: /var/run/secrets/sts.seaweedfs.com/serviceaccount/token
          - name: AWS_REGION
            value: us-east-1
          - name: WORKER_S3_BUCKET
            value: agr-ai
          - name: WORKER_S3_PREFIX
            value: worker-runs
          - name: WORKER_CONTROLLER_ID
            value: agr-dataset
          - name: AGR_WORKFLOW_UID
            value: '{{workflow.uid}}'
          - name: AGR_TRAINING_IMAGE_REFERENCE
            value: ghcr.io/walnuts1018/agr-training:0.1.67@sha256:83b33dbc12c06ae5bc75586b133f0d45315407b6382ec0ad917d7f76f79bdb0f
          - name: AGR_WORKFLOW_GENERATION_ID
            value: '{{inputs.parameters.generation-id}}'
          - name: AGR_WORKFLOW_PLAN_URI
            value: '{{inputs.parameters.plan-uri}}'
          - name: AGR_WORKFLOW_PLAN_SHA256
            value: '{{inputs.parameters.plan-sha256}}'
        image: ghcr.io/walnuts1018/agr-training:0.1.67@sha256:83b33dbc12c06ae5bc75586b133f0d45315407b6382ec0ad917d7f76f79bdb0f
        resources:
          limits:
            cpu: 500m
            ephemeral-storage: 1Gi
            memory: 1Gi
          requests:
            cpu: 100m
            ephemeral-storage: 128Mi
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          readOnlyRootFilesystem: true
          runAsGroup: 10001
          runAsNonRoot: true
          runAsUser: 10001
        volumeMounts:
          - mountPath: /var/run/secrets/sts.seaweedfs.com/serviceaccount
            name: sts-token
            readOnly: true
          - mountPath: /tmp
            name: tmp
      inputs:
        parameters:
          - name: generation-id
          - name: plan-uri
          - name: plan-sha256
          - name: stage
          - name: look-index
          - name: unit-count
      name: verify-rollout
      podSpecPatch: '{"priorityClassName":"agr-learning","securityContext":{"runAsGroup":10001,"runAsNonRoot":true,"runAsUser":10001,"seccompProfile":{"type":"RuntimeDefault"}}}'
      serviceAccountName: agr-dataset
      volumes:
        - name: sts-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: sts.seaweedfs.com
                  expirationSeconds: 3600
                  path: token
        - emptyDir:
            sizeLimit: 1Gi
          name: tmp
    - container:
        args:
          - --argo-output-dir
          - /tmp/dataset-output
        command:
          - /app/.venv/bin/agr-build-dataset
        env:
          - name: AWS_ENDPOINT_URL_S3
            value: http://seaweedfs-default-s3.seaweedfs.svc.cluster.local:8333
          - name: AWS_ENDPOINT_URL_STS
            value: https://seaweedfs.local.walnuts.dev
          - name: AWS_ROLE_ARN
            value: arn:aws:iam::role/agr-dataset
          - name: AWS_WEB_IDENTITY_TOKEN_FILE
            value: /var/run/secrets/sts.seaweedfs.com/serviceaccount/token
          - name: AWS_REGION
            value: us-east-1
          - name: WORKER_S3_BUCKET
            value: agr-ai
          - name: WORKER_S3_PREFIX
            value: worker-runs
          - name: WORKER_CONTROLLER_ID
            value: agr-dataset
          - name: AGR_WORKFLOW_UID
            value: '{{workflow.uid}}'
          - name: OMP_NUM_THREADS
            value: "1"
          - name: MKL_NUM_THREADS
            value: "1"
          - name: AGR_TRAINING_IMAGE_REFERENCE
            value: ghcr.io/walnuts1018/agr-training:0.1.67@sha256:83b33dbc12c06ae5bc75586b133f0d45315407b6382ec0ad917d7f76f79bdb0f
          - name: AGR_WORKFLOW_GENERATION_ID
            value: '{{inputs.parameters.generation-id}}'
          - name: AGR_WORKFLOW_PLAN_URI
            value: '{{inputs.parameters.plan-uri}}'
          - name: AGR_WORKFLOW_PLAN_SHA256
            value: '{{inputs.parameters.plan-sha256}}'
        image: ghcr.io/walnuts1018/agr-training:0.1.67@sha256:83b33dbc12c06ae5bc75586b133f0d45315407b6382ec0ad917d7f76f79bdb0f
        resources:
          limits:
            cpu: 500m
            ephemeral-storage: 4Gi
            memory: 1Gi
          requests:
            cpu: 100m
            ephemeral-storage: 512Mi
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
