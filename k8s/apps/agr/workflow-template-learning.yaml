          - name: AGR_TRAINING_IMAGE_REFERENCE
            value: ghcr.io/walnuts1018/agr-training:0.1.45@sha256:c2cd3c27105d65c1235f84805cfb6d14c7836bde228fe1a6e329f09eed589009
          - name: AGR_WORKFLOW_GENERATION_ID
