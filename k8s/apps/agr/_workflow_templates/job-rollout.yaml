apiVersion: batch/v1
kind: Job
metadata:
  name: agr-rollout-{{workflow.name}}
  namespace: agr
  labels:
    app: agr-learning
    app.kubernetes.io/name: agr-learning
    agr.walnuts.dev/stage: rollout
spec:
  completionMode: Indexed
  completions: {{inputs.parameters.shard-count}}
  parallelism: {{inputs.parameters.actor-pods}}
  backoffLimitPerIndex: 2
  maxFailedIndexes: 0
  activeDeadlineSeconds: 604800
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels:
        app: agr-learning
        app.kubernetes.io/name: agr-learning
        agr.walnuts.dev/stage: rollout
    spec:
      serviceAccountName: agr-actor
      automountServiceAccountToken: false
      restartPolicy: Never
      priorityClassName: agr-learning
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: ghcr-login-secret
      volumes:
        - name: learning-settings
          configMap:
            name: learning-settings
        - name: sts-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: sts.seaweedfs.com
                  expirationSeconds: 3600
                  path: token
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
      containers:
        - name: actor
          image: ghcr.io/walnuts1018/agr-worker:0.1.15@sha256:cc333251f3222e99e4efd94f67f584fa329eb6b8225a16d97ba1f77beeb105c9
          command: [worker]
          args:
            - run-shard
            - --stage
            - rollout
            - --generation-id
            - '{{inputs.parameters.generation-id}}'
            - --config-sha256
            - '{{inputs.parameters.config-sha256}}'
            - --plan-uri
            - '{{inputs.parameters.plan-uri}}'
            - --shard-index
            - $(JOB_COMPLETION_INDEX)
            - --shard-count
            - '{{inputs.parameters.shard-count}}'
          env:
            - name: AGR_WORKFLOW_UID
              value: '{{workflow.uid}}'
            - name: AGR_WORKER_IMAGE_REFERENCE
              value: 'ghcr.io/walnuts1018/agr-worker:0.1.15@sha256:cc333251f3222e99e4efd94f67f584fa329eb6b8225a16d97ba1f77beeb105c9'
            - name: AWS_ENDPOINT_URL_S3
              value: http://seaweedfs-default-s3.seaweedfs.svc.cluster.local:8333
            - name: AWS_ENDPOINT_URL_STS
              value: http://seaweedfs-default-s3.seaweedfs.svc.cluster.local:8333
            - name: AWS_ROLE_ARN
              value: arn:aws:iam::role/agr-actor
            - name: AWS_WEB_IDENTITY_TOKEN_FILE
              value: /var/run/secrets/sts.seaweedfs.com/serviceaccount/token
            - name: AWS_REGION
              value: us-east-1
            - name: WORKER_CONTROLLER_ID
              value: agr-actor
            - name: WORKER_S3_ENDPOINT
              value: http://seaweedfs-default-s3.seaweedfs.svc.cluster.local:8333
            - name: WORKER_S3_BUCKET
              value: agr-ai
            - name: WORKER_S3_PREFIX
              value: worker-runs
            - name: SERVICE_ENDPOINT
              value: http://agr-server.agr.svc.cluster.local:8080
            - name: SERVICE_GATEWAY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: agr-learning-token
                  key: SERVICE_GATEWAY_TOKEN
            - name: OMP_NUM_THREADS
              value: "1"
          resources:
            requests:
              cpu: 500m
              memory: 256Mi
              ephemeral-storage: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
              ephemeral-storage: 1Gi
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: learning-settings
              mountPath: /etc/agr
              readOnly: true
            - name: sts-token
              mountPath: /var/run/secrets/sts.seaweedfs.com/serviceaccount
              readOnly: true
            - name: tmp
              mountPath: /tmp
