apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: agr-server
    app.kubernetes.io/name: agr-server
  name: agr-server
  namespace: agr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agr-server
      app.kubernetes.io/name: agr-server
  template:
    metadata:
      labels:
        app: agr-server
        app.kubernetes.io/name: agr-server
    spec:
      automountServiceAccountToken: false
      containers:
        - env:
            - name: SERVICE_LISTEN_ADDR
              value: 0.0.0.0:8080
            - name: SERVICE_HEALTH_ADDR
              value: 0.0.0.0:8081
            - name: AGR_LEARNING_JOB_IDENTITIES
              value: agr-learning-job
            - name: AGR_POLICY_MODEL_S3_URI
              value: s3://agr-ai/worker-runs/models/active.json
            - name: WORKER_S3_BUCKET
              value: agr-ai
            - name: AWS_ENDPOINT_URL_S3
              value: http://seaweedfs-default-s3.seaweedfs.svc.cluster.local:8333
            - name: AWS_ENDPOINT_URL_STS
              value: https://seaweedfs.local.walnuts.dev
            - name: AWS_REGION
              value: us-east-1
            - name: AWS_ROLE_ARN
              value: arn:aws:iam::role/agr-app-service
            - name: AWS_WEB_IDENTITY_TOKEN_FILE
              value: /projected/sts.seaweedfs.com/serviceaccount/token
            - name: RUST_BACKTRACE
              value: "1"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://default-collector.opentelemetry-collector.svc.cluster.local:4317
          envFrom:
            - secretRef:
                name: agr
          image: ghcr.io/walnuts1018/agr-server:0.1.3@sha256:267c990113e68ccf5f6091a2277180b411732cb9baf7e9e128cd66b5ebbcd973
          imagePullPolicy: IfNotPresent
          livenessProbe:
            httpGet:
              path: /livez
              port: health
            periodSeconds: 20
            timeoutSeconds: 2
          name: app-service
          ports:
            - containerPort: 8080
              name: grpc-web
              protocol: TCP
            - containerPort: 8081
              name: health
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            limits:
              cpu: "2"
              memory: 2Gi
            requests:
              cpu: 100m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              add:
                - NET_BIND_SERVICE
              drop:
                - all
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          startupProbe:
            failureThreshold: 60
            httpGet:
              path: /livez
              port: health
            periodSeconds: 5
            timeoutSeconds: 2
          volumeMounts:
            - mountPath: /tmp
              name: tmp
            - mountPath: /projected/sts.seaweedfs.com/serviceaccount
              name: seaweedfs-sts-token
              readOnly: true
      imagePullSecrets:
        - name: ghcr-login-secret
      securityContext:
        fsGroup: 65532
        runAsGroup: 65532
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: agr-app-service
      volumes:
        - emptyDir: {}
          name: tmp
        - name: seaweedfs-sts-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: sts.seaweedfs.com
                  expirationSeconds: 3600
                  path: token
