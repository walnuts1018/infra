apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agr-valkey-credential
  namespace: agr
spec:
  data:
    - remoteRef:
        key: terraform-external-secrets
        property: agr-redis-password
      secretKey: valkey_password
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: agr-valkey-credential
    template:
      data:
        AGR_VALKEY_URL: redis://:{{ .valkey_password }}@valkey-agr-valkey.agr.svc.cluster.local:6379/0
        valkey_password: '{{ .valkey_password }}'
      engineVersion: v2
      type: Opaque
