apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agr-learning
  namespace: agr
spec:
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
      to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
    - ports:
        - port: 8080
          protocol: TCP
        - port: 8081
          protocol: TCP
      to:
        - podSelector:
            matchLabels:
              app: agr-server
              app.kubernetes.io/name: agr-server
    - ports:
        - port: 8333
          protocol: TCP
      to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: seaweedfs
          podSelector:
            matchLabels:
              app.kubernetes.io/component: s3
              app.kubernetes.io/instance: seaweedfs-default
              app.kubernetes.io/name: seaweedfs
  podSelector:
    matchLabels:
      app: agr-learning
      app.kubernetes.io/name: agr-learning
  policyTypes:
    - Egress
