# Source: victoria-metrics-agent/templates/server.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vmagent-victoria-metrics-agent
  namespace: victoria-metrics
  labels: 
    app.kubernetes.io/instance: vmagent
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: victoria-metrics-agent
    app.kubernetes.io/version: v1.156.0
    helm.sh/chart: victoria-metrics-agent-0.52.0
spec:
  updateStrategy: {}
  replicas: 1
  serviceName: vmagent-victoria-metrics-agent
  selector:
    matchLabels: 
      app.kubernetes.io/instance: vmagent
      app.kubernetes.io/name: victoria-metrics-agent
  template:
    metadata:
      labels: 
        app.kubernetes.io/instance: vmagent
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: victoria-metrics-agent
      annotations: 
        checksum/config: bcfaf51add2a9408ce5f486557aa90d48cd8b21c0493bb72a13665100d2fc081
    spec:
      serviceAccountName: vmagent-victoria-metrics-agent
      automountServiceAccountToken: true
      securityContext: 
        {}
      containers:
        - name: vmagent
          securityContext: 
            {}
          image: victoriametrics/vmagent:v1.156.0
          imagePullPolicy: IfNotPresent
          workingDir: /
          args: 
            - --envflag.enable
            - --envflag.prefix=VM_
            - --httpListenAddr=:8429
            - --loggerFormat=json
            - --promscrape.config=/config/scrape/scrape.yml
            - --remoteWrite.tmpDataPath=/tmpData
            - --remoteWrite.url=http://vm-short-victoria-metrics-cluster-vminsert:8480/insert/0/prometheus/api/v1/write
            - --remoteWrite.url=http://vm-long-victoria-metrics-cluster-vminsert:8480/insert/0/prometheus/api/v1/write
            - --remoteWrite.urlRelabelConfig=/config/rw/0-urlRelabelConfig.yaml
            - --remoteWrite.urlRelabelConfig=/config/rw/1-urlRelabelConfig.yaml
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          ports:
            - name: http
              containerPort: 8429
          readinessProbe: 
            httpGet:
              path: /health
              port: http
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 15
          livenessProbe: 
            initialDelaySeconds: 5
            periodSeconds: 15
            tcpSocket:
              port: http
            timeoutSeconds: 5
          resources: 
            limits:
              memory: 2Gi
            requests:
              cpu: 150m
              memory: 256Mi
          volumeMounts:
            - name: tmpdata
              mountPath: /tmpData
            - name: config-out
              mountPath: /config/scrape
            - name: relabelings-assets
              mountPath: /config/rw
            
            
      volumes:
        - name: relabelings-assets
          configMap:
            name: vmagent-victoria-metrics-agent-rw
        - name: config-out
          configMap:
            name: vmagent-victoria-metrics-agent-config
        
        
  volumeClaimTemplates:
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: tmpdata
      spec:
        accessModes: 
          - ReadWriteOnce
        storageClassName: topolvm-hdd
        resources:
          requests:
            storage: 8Gi
