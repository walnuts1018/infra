# Source: victoria-metrics-agent/templates/networkpolicy.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vmagent-victoria-metrics-agent
  namespace: victoria-metrics
  labels: 
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: victoria-metrics-agent-0.52.0
spec:
  podSelector:
    matchLabels: 
      app.kubernetes.io/instance: vmagent
      app.kubernetes.io/name: victoria-metrics-agent
  ingress: 
    - from:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: opentelemetry-collector
        podSelector:
          matchLabels:
            app.kubernetes.io/component: opentelemetry-collector
      ports:
      - port: 8429
        protocol: TCP
  egress: 
    - ports:
      - port: 53
        protocol: UDP
      - port: 53
        protocol: TCP
      to:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: kube-system
        podSelector:
          matchLabels:
            k8s-app: kube-dns
    - ports:
      - port: 8480
        protocol: TCP
      to:
      - podSelector:
          matchExpressions:
          - key: app.kubernetes.io/instance
            operator: In
            values:
            - vm-short
            - vm-long
          matchLabels:
            app: vminsert
            app.kubernetes.io/name: victoria-metrics-cluster
