---
# Source: victoria-metrics-cluster/templates/networkpolicy.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vm-query-victoria-metrics-cluster-vmselect
  namespace: victoria-metrics
  labels: 
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: victoria-metrics-cluster-0.55.0
spec:
  podSelector:
    matchLabels: 
      app: vmselect
      app.kubernetes.io/instance: vm-query
      app.kubernetes.io/name: victoria-metrics-cluster
  ingress: 
    - from:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: monitoring
        podSelector:
          matchLabels:
            app.kubernetes.io/instance: grafana
            app.kubernetes.io/name: grafana
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: opencost
        podSelector:
          matchLabels:
            app.kubernetes.io/instance: opencost
            app.kubernetes.io/name: opencost
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: keda
        podSelector:
          matchLabels:
            app.kubernetes.io/instance: keda
            app.kubernetes.io/name: keda-operator
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: opentelemetry-collector
        podSelector:
          matchLabels:
            app.kubernetes.io/component: opentelemetry-collector
      ports:
      - port: 8481
        protocol: TCP
  egress: 
    - ports:
      - port: 53
        protocol: UDP
      - port: 53
        protocol: TCP
      to:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: kube-system
        podSelector:
          matchLabels:
            k8s-app: kube-dns
    - ports:
      - port: 8401
        protocol: TCP
      to:
      - podSelector:
          matchExpressions:
          - key: app.kubernetes.io/instance
            operator: In
            values:
            - vm-short
            - vm-long
          matchLabels:
            app: vmselect
            app.kubernetes.io/name: victoria-metrics-cluster
---
