# Source: victoria-metrics-cluster/templates/service.yaml
apiVersion: v1
kind: Service
metadata:
  labels: 
    app.kubernetes.io/component: vmselect
    app.kubernetes.io/instance: vm-query
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: victoria-metrics-cluster
    app.kubernetes.io/version: v1.156.0-cluster
    helm.sh/chart: victoria-metrics-cluster-0.55.0
  name: vm-query-victoria-metrics-cluster-vmselect
