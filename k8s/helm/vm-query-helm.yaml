spec:
  namespaceSelector:
    matchNames:
      - victoria-metrics
  selector:
    matchLabels: 
      app.kubernetes.io/component: vmselect
      app.kubernetes.io/instance: vm-query
      app.kubernetes.io/name: victoria-metrics-cluster
  endpoints:
    -
      port: http
