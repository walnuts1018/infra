    app.kubernetes.io/name: victoria-metrics-cluster
---
# Source: victoria-metrics-cluster/templates/vmselect-server.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vm-query-victoria-metrics-cluster-vmselect
  namespace: victoria-metrics
  labels: 
    app.kubernetes.io/component: vmselect
    app.kubernetes.io/instance: vm-query
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: victoria-metrics-cluster
    app.kubernetes.io/version: v1.156.0-cluster
    helm.sh/chart: victoria-metrics-cluster-0.55.0
spec:
  strategy: {}
  replicas: 1
  selector:
    matchLabels: 
      app: vmselect
      app.kubernetes.io/instance: vm-query
      app.kubernetes.io/name: victoria-metrics-cluster
  template:
    metadata:
      labels: 
        app: vmselect
        app.kubernetes.io/component: vmselect
        app.kubernetes.io/instance: vm-query
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: victoria-metrics-cluster
    spec:
      serviceAccountName: vm-query-victoria-metrics-cluster
      automountServiceAccountToken: true
      securityContext: 
        {}
      containers:
        - name: vmselect
          securityContext: 
            {}
          image: victoriametrics/vmselect:v1.156.0-cluster
          imagePullPolicy: IfNotPresent
          args: 
            - --cacheDataPath=/cache
            - --envflag.enable
            - --envflag.prefix=VM_
            - --httpListenAddr=:8481
            - --loggerFormat=json
            - --storageNode=short/vm-short-victoria-metrics-cluster-vmselect.victoria-metrics.svc.cluster.local:8401
            - --storageNode=long/vm-long-victoria-metrics-cluster-vmselect.victoria-metrics.svc.cluster.local:8401
          ports:
            - name: http
              containerPort: 8481
          readinessProbe: 
            failureThreshold: 10
            httpGet:
              path: /health
              port: http
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe: 
            failureThreshold: 3
            initialDelaySeconds: 5
            periodSeconds: 15
            tcpSocket:
              port: http
            timeoutSeconds: 5
          resources: 
            limits:
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 256Mi
          volumeMounts:
            - mountPath: /cache
              name: cache-volume
            
      terminationGracePeriodSeconds: 60
      volumes:
        - name: cache-volume
          emptyDir: 
            {}
---
