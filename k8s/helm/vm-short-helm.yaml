# Source: victoria-metrics-cluster/templates/vmstorage-server.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels: 
    app.kubernetes.io/component: vmstorage
    app.kubernetes.io/instance: vm-short
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: victoria-metrics-cluster
    app.kubernetes.io/version: v1.156.0-cluster
    helm.sh/chart: victoria-metrics-cluster-0.55.0
  name: vm-short-victoria-metrics-cluster-vmstorage
  namespace: victoria-metrics
spec:
  serviceName: vm-short-victoria-metrics-cluster-vmstorage
  selector:
    matchLabels: 
      app: vmstorage
      app.kubernetes.io/instance: vm-short
      app.kubernetes.io/name: victoria-metrics-cluster
  replicas: 1
  podManagementPolicy: OrderedReady
  template:
    metadata:
      labels: 
        app: vmstorage
        app.kubernetes.io/component: vmstorage
        app.kubernetes.io/instance: vm-short
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: victoria-metrics-cluster
    spec:
      containers:
        - name: vmstorage
          image: victoriametrics/vmstorage:v1.156.0-cluster
          imagePullPolicy: IfNotPresent
          args: 
            - --envflag.enable
            - --envflag.prefix=VM_
            - --httpListenAddr=:8482
            - --loggerFormat=json
            - --retentionPeriod=30d
            - --storageDataPath=/storage
          ports:
            - name: http
              containerPort: 8482
            - name: vminsert
              containerPort: 8400
            - name: vmselect
              containerPort: 8401
          readinessProbe: 
            failureThreshold: 10
            httpGet:
              path: /health
              port: http
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
          resources: 
            limits:
              memory: 4Gi
            requests:
              cpu: 100m
              memory: 2Gi
          volumeMounts:
            - name: vmstorage-volume
              mountPath: /storage
            
      serviceAccountName: vm-short-victoria-metrics-cluster
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 60
  minReadySeconds: 5
  volumeClaimTemplates:
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: vmstorage-volume
      spec:
        accessModes: 
          - ReadWriteOnce
        resources:
          requests:
            storage: 128Gi
        storageClassName: topolvm-hdd
