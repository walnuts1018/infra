# Source: victoria-metrics-cluster/templates/vminsert-server.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  labels: 
    app.kubernetes.io/component: vminsert
    app.kubernetes.io/instance: vm-short
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: victoria-metrics-cluster
    app.kubernetes.io/version: v1.156.0-cluster
    helm.sh/chart: victoria-metrics-cluster-0.55.0
  name: vm-short-victoria-metrics-cluster-vminsert
  namespace: victoria-metrics
spec:
  selector:
    matchLabels: 
      app: vminsert
      app.kubernetes.io/instance: vm-short
      app.kubernetes.io/name: victoria-metrics-cluster
  replicas: 1
  template:
    metadata:
      labels: 
        app: vminsert
        app.kubernetes.io/component: vminsert
        app.kubernetes.io/instance: vm-short
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: victoria-metrics-cluster
    spec:
      containers:
        - name: vminsert
          image: victoriametrics/vminsert:v1.156.0-cluster
          imagePullPolicy: IfNotPresent
          args: 
            - --envflag.enable
            - --envflag.prefix=VM_
            - --httpListenAddr=:8480
            - --loggerFormat=json
            - --storageNode=vm-short-victoria-metrics-cluster-vmstorage-0.vm-short-victoria-metrics-cluster-vmstorage.victoria-metrics.svc.cluster.local.:8400
          ports:
            - name: http
              containerPort: 8480
          readinessProbe: 
            failureThreshold: 10
            httpGet:
              path: /health
              port: http
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe: 
            failureThreshold: 3
            initialDelaySeconds: 5
            periodSeconds: 15
            tcpSocket:
              port: http
            timeoutSeconds: 5
          resources: 
            limits:
              memory: 1Gi
            requests:
              cpu: 80m
              memory: 250Mi
      serviceAccountName: vm-short-victoria-metrics-cluster
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 30
