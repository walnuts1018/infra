# Source: penpot/templates/backend-deployment.yml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: penpot-backend
  namespace: penpot
  labels:
    helm.sh/chart: penpot-1.11.3
    app.kubernetes.io/name: penpot
    app.kubernetes.io/instance: penpot
    app.kubernetes.io/version: "2.18.3"
    app.kubernetes.io/managed-by: Helm
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: penpot-backend
      app.kubernetes.io/instance: penpot
  strategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: penpot-backend
        app.kubernetes.io/name: penpot-backend
        app.kubernetes.io/instance: penpot
    spec:
      serviceAccountName: penpot
      securityContext:
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: penpot-backend
          image: "penpotapp/backend:2.18.3"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - all
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 1001
          env:
            # General settings
            - name: PENPOT_PUBLIC_URI
              value: "https://penpot.walnuts.dev"
            - name: PENPOT_FLAGS
              value: "$PENPOT_FLAGS disable-registration disable-login-with-password enable-login-with-oidc enable-oidc-registration enable-mcp"
            - name: PENPOT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: penpot-secrets
                  key: api-secret-key
            # Telemetry settings
            - name: PENPOT_TELEMETRY_ENABLED
              value: "false"
            - name: PENPOT_TELEMETRY_REFERER
              value: kubernetes
            # PosgreSQL connection settings
            - name: PENPOT_DATABASE_URI
              valueFrom:
                secretKeyRef:
                  name: penpot-secrets
                  key: database-uri
            - name: PENPOT_DATABASE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: penpot-secrets
                  key: username
            - name: PENPOT_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: penpot-secrets
                  key: password
            # Valkey/Redis connection settings
            - name: PENPOT_REDIS_URI
              valueFrom:
                secretKeyRef:
                  name: penpot-secrets
                  key: redis-uri
            # Objects Storage settings
            - name: PENPOT_OBJECTS_STORAGE_BACKEND
              value: "s3"
            - name: PENPOT_OBJECTS_STORAGE_S3_REGION
              value: "us-east-1"
            - name: PENPOT_OBJECTS_STORAGE_S3_BUCKET
              value: "penpot"
            - name: AWS_ACCESS_KEY_ID
              value: ""
            - name: AWS_SECRET_ACCESS_KEY
              value: ""
            - name: PENPOT_OBJECTS_STORAGE_S3_ENDPOINT
              value: "http://seaweedfs-default-s3.seaweedfs.svc.cluster.local:8333"
            # File Data Store settings
            - name: PENPOT_FILE_DATA_BACKEND
              value: "legacy-db"
            # OIDC provider settings
            - name: PENPOT_OIDC_BASE_URI
              value: "https://auth.walnuts.dev"
            - name: PENPOT_OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: penpot-secrets
                  key: oidc-client-id
            - name: PENPOT_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: penpot-secrets
                  key: oidc-client-secret
            - name: PENPOT_OIDC_ROLES_ATTR
              value: "my:zitadel:grants"
            - name: PENPOT_OIDC_SCOPES
              value: "openid profile email"
            # Auto file snapshot settings
            - name: PENPOT_AUTO_FILE_SNAPSHOT_EVERY
              value: "5"
            - name: PENPOT_AUTO_FILE_SNAPSHOT_TIMEOUT
              value: "3h"
            # Extra environments
            - name: AWS_WEB_IDENTITY_TOKEN_FILE
              value: /var/run/secrets/sts.seaweedfs.com/serviceaccount/token
            - name: AWS_ENDPOINT_URL_STS
              value: http://seaweedfs-default-s3.seaweedfs.svc.cluster.local:8333
            - name: AWS_ROLE_ARN
              value: arn:aws:iam::role/penpot
            - name: AWS_REGION
              value: us-east-1
            - name: PENPOT_OIDC_ROLES
              valueFrom:
                secretKeyRef:
                  key: oidc-required-role
                  name: penpot-secrets
          volumeMounts:
            - mountPath: "/opt/data/assets"
              name: app-data
              readOnly: false
            - mountPath: /var/run/secrets/sts.seaweedfs.com/serviceaccount
              name: seaweedfs-sts-token
              readOnly: true
          ports:
            - name: http
              containerPort: 6060
              protocol: TCP
          resources:
            limits:
              cpu: "2"
              memory: 4Gi
            requests:
              cpu: 250m
              memory: 768Mi
          startupProbe:
            failureThreshold: 30
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - rusk
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - podAffinityTerm:
              labelSelector:
                matchLabels:
                  app.kubernetes.io/instance: penpot
                  app.kubernetes.io/name: penpot-backend
              topologyKey: kubernetes.io/hostname
            weight: 100
      volumes:
      - name: app-data
        emptyDir: {}
      - name: seaweedfs-sts-token
        projected:
          sources:
          - serviceAccountToken:
              audience: sts.seaweedfs.com
              expirationSeconds: 86400
              path: token
