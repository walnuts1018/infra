# Source: penpot/templates/tests/test-connection.yaml
apiVersion: v1
kind: Pod
metadata:
  name: "penpot-test-connection"
  namespace: penpot
  labels:
    helm.sh/chart: penpot-1.11.3
    app.kubernetes.io/name: penpot
    app.kubernetes.io/instance: penpot
    app.kubernetes.io/version: "2.18.3"
    app.kubernetes.io/managed-by: Helm
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  securityContext:
    fsGroup: 1001
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: readyz
      image: curlimages/curl:8.11.1
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
          - all
        readOnlyRootFilesystem: false
        runAsNonRoot: true
        runAsUser: 1001
      args:
        - --fail
        - --silent
        - --show-error
        - --max-time
        - "10"
        - --retry
        - "12"
        - --retry-delay
        - "5"
        - --retry-connrefused
        - http://penpot:8080/readyz
