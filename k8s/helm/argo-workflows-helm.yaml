  template:
    metadata:
      labels:
        helm.sh/chart: argo-workflows-2.0.18
        app.kubernetes.io/name: argo-workflows-server
        app.kubernetes.io/instance: argo-workflows
        app.kubernetes.io/component: server
        app: server
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/part-of: argo-workflows
        app.kubernetes.io/version: "v4.1.6"
      annotations:
        checksum/cm: ea23b80c5b87e004ba792198ef2fd44d3b43fa95ea82903b63505b94fcb4dd4b
    spec:
      serviceAccountName: argo-workflows-server
      containers:
        - name: argo-server
          image: "quay.io/argoproj/argocli:v4.1.6"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: false
            runAsNonRoot: true
          args:
          - server
          - --configmap=argo-workflows-workflow-controller-configmap
          - "--auth-mode=sso"
          - "--secure=false"
          - "--loglevel"
          - "info"
          - "--gloglevel"
          - "0"
          - "--log-format"
          - "text"
          ports:
          - name: web
            containerPort: 2746
          readinessProbe:
            httpGet:
              path: /
              port: 2746
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 20
          env:
            - name: IN_CLUSTER
              value: "true"
            - name: ARGO_NAMESPACE
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.namespace
            - name: ARGO_BASE_HREF
              value: "/"
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 50m
              memory: 128Mi
          volumeMounts:
          - name: tmp
