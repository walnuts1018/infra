# Source: argo-workflows/templates/controller/workflow-controller-config-map.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: argo-workflows-workflow-controller-configmap
  namespace: "argo-workflows"
  labels:
    helm.sh/chart: argo-workflows-2.0.18
    app.kubernetes.io/name: argo-workflows-cm
    app.kubernetes.io/instance: argo-workflows
    app.kubernetes.io/component: workflow-controller
    app: workflow-controller
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: argo-workflows
data:
  config: |
    executor:
      imagePullPolicy: IfNotPresent
      resources:
        limits:
          cpu: 100m
          ephemeral-storage: 256Mi
          memory: 128Mi
        requests:
          cpu: 50m
          ephemeral-storage: 64Mi
          memory: 64Mi
    metricsConfig:
      enabled: true
      path: /metrics
      port: 9090
      ignoreErrors: false
      secure: false
    persistence:
      archive: true
      archiveTTL: 90d
      nodeStatusOffLoad: false
      postgresql:
        database: argo_workflows
        host: postgresql-default-rw.databases.svc.cluster.local
        passwordSecret:
          key: password
          name: argo-workflows-postgres-config
        port: 5432
        tableName: argo_workflows
        userNameSecret:
          key: username
          name: argo-workflows-postgres-config
    workflowDefaults:
      spec:
        podGC:
          strategy: OnWorkflowCompletion
        ttlStrategy:
          secondsAfterCompletion: 604800
    sso:
      issuer: https://auth.walnuts.dev
      clientId:
        name: argo-workflows-sso
        key: client-id
      clientSecret:
        name: argo-workflows-sso
        key: client-secret
      redirectUrl: "https://argoworkflows.walnuts.dev/oauth2/callback"
      rbac:
        enabled: false
      scopes:
        - openid
        - profile
        - email
      sessionExpiry: 24h
    nodeEvents:
      enabled: true
    workflowEvents:
      enabled: true
    failedPodRestart:
      enabled: false
      maxRestarts: 3
