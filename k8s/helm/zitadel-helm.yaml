# Source: zitadel/templates/job_cleanup.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: "zitadel-cleanup"
  namespace: zitadel
  labels:
    helm.sh/chart: zitadel-10.4.0
    app.kubernetes.io/name: zitadel
    app.kubernetes.io/instance: zitadel
    app.kubernetes.io/version: "v4.20.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: cleanup
  annotations:
    helm.sh/hook: post-delete
    helm.sh/hook-delete-policy: hook-succeeded
    helm.sh/hook-weight: "-1"
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 60
  template:
    metadata:
      labels:
        helm.sh/chart: zitadel-10.4.0
        app.kubernetes.io/name: zitadel
        app.kubernetes.io/instance: zitadel
        app.kubernetes.io/version: "v4.20.0"
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/component: cleanup
    spec:
      serviceAccountName: zitadel
      securityContext:
        fsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      enableServiceLinks: false
      restartPolicy: Never
      containers:
        - name: zitadel-cleanup
          securityContext:
              privileged: false
              readOnlyRootFilesystem: true
              runAsNonRoot: true
              runAsUser: 1000
          image: docker.io/alpine/k8s:1.36.4
          imagePullPolicy: 'IfNotPresent'
          command:
            - sh
            - -c
            - |
              echo "Cleaning up secrets created by zitadel-setup..."
              kubectl --namespace=zitadel delete secret \
                --selector='app.kubernetes.io/managed-by=Zitadel,app.kubernetes.io/instance=zitadel' \
                --ignore-not-found=true
              echo "Cleanup completed"
          resources:
              {}
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - preference:
              matchExpressions:
              - key: kubernetes.io/arch
                operator: In
                values:
                - amd64
            weight: 100
          - preference:
              matchExpressions:
              - key: kubernetes.io/hostname
                operator: NotIn
                values:
                - donut
            weight: 10
