# Source: external-dns/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: external-dns-coredns
  namespace: external-dns-coredns
  labels:
    helm.sh/chart: external-dns-1.23.0
    app.kubernetes.io/name: external-dns
    app.kubernetes.io/instance: external-dns-coredns
    app.kubernetes.io/version: "0.23.0"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: external-dns
      app.kubernetes.io/instance: external-dns-coredns
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: external-dns
        app.kubernetes.io/instance: external-dns-coredns
    spec:
      automountServiceAccountToken: true
      serviceAccountName: external-dns-coredns
      securityContext:
        fsGroup: 65534
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: external-dns
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            privileged: false
            readOnlyRootFilesystem: true
            runAsGroup: 65532
            runAsNonRoot: true
            runAsUser: 65532
          image: registry.k8s.io/external-dns/external-dns:v0.23.0
          imagePullPolicy: IfNotPresent
          env:
            - name: ETCD_URLS
              value: http://coredns-etcd.coredns.svc.cluster.local:2379
          args:
            - --log-level=info
            - --log-format=text
            - --interval=1m
            - --events
            - --source=gateway-httproute
            - --source=gateway-grpcroute
            - --source=gateway-tlsroute
            - --source=gateway-tcproute
            - --source=gateway-udproute
            - --source=crd
            - --policy=sync
            - --registry=noop
            - --txt-owner-id=external-dns-coredns
            - --domain-filter=local.walnuts.dev
            - --annotation-prefix=external-dns-local.alpha.kubernetes.io/
            - --provider=coredns
            - --coredns-strictly-owned
            - "--crd-source-apiversion=externaldns.k8s.io/v1alpha1"
            - "--crd-source-kind=DNSEndpoint"
          ports:
            - name: http
              protocol: TCP
              containerPort: 7979
          livenessProbe:
            failureThreshold: 2
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 5
          readinessProbe:
            failureThreshold: 6
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 5
          resources:
            limits:
              memory: 1Gi
            requests:
              cpu: 3m
              memory: 48Mi
      topologySpreadConstraints:
        - labelSelector:
            matchLabels:
              app.kubernetes.io/name: external-dns
          maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
