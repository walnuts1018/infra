    app.kubernetes.io/version: 0.15.0
    helm.sh/chart: keda-add-ons-http-0.15.0
spec:
  minReplicaCount: 1
  maxReplicaCount: 10
  pollingInterval: 1
  scaleTargetRef:
    name: "keda-add-ons-http-interceptor"
    kind: Deployment
  triggers:
    - type: external
      metadata:
        scalerAddress: "keda-add-ons-http-external-scaler.keda:9090"
        interceptorTargetPendingRequests: "200"
