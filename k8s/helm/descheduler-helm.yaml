apiVersion: v1
kind: ConfigMap
metadata:
  name: descheduler
  namespace: kube-system
  labels:
    app.kubernetes.io/name: descheduler
    helm.sh/chart: descheduler-0.36.0
    app.kubernetes.io/instance: descheduler
    app.kubernetes.io/version: "0.36.0"
    app.kubernetes.io/managed-by: Helm
data:
  policy.yaml: |
    apiVersion: "descheduler/v1alpha2"
    kind: "DeschedulerPolicy"
    maxNoOfPodsToEvictPerNode: 3
    metricsProviders:
    - source: KubernetesMetrics
    profiles:
    - name: request-balance
      pluginConfig:
      - args:
          labelSelector:
            matchExpressions:
            - key: batch.kubernetes.io/controller-uid
              operator: DoesNotExist
          namespaceLabelSelector:
            matchExpressions:
            - key: kubernetes.io/metadata.name
              operator: NotIn
              values:
              - arc-runners
          nodeFit: true
          podProtections:
            config:
              PodsWithPVC:
                protectedStorageClasses:
                - name: local-path
            defaultDisabled:
            - PodsWithLocalStorage
            extraEnabled:
            - PodsWithPVC
        name: DefaultEvictor
      - name: RemoveDuplicates
      - args:
          constraints:
          - DoNotSchedule
          - ScheduleAnyway
        name: RemovePodsViolatingTopologySpreadConstraint
      - args:
          targetThresholds:
            cpu: 75
            memory: 80
          thresholds:
            cpu: 60
            memory: 70
          useDeviationThresholds: false
        name: LowNodeUtilization
      - name: RemovePodsViolatingInterPodAntiAffinity
      - args:
          nodeAffinityType:
          - requiredDuringSchedulingIgnoredDuringExecution
        name: RemovePodsViolatingNodeAffinity
      - name: RemovePodsViolatingNodeTaints
      - args:
          includingInitContainers: true
          podRestartThreshold: 100
        name: RemovePodsHavingTooManyRestarts
      - args:
          includingInitContainers: true
          maxPodLifeTimeSeconds: 86400
          states:
          - Succeeded
          - Failed
          - Unknown
          - Completed
          - Error
          - Evicted
          - CrashLoopBackOff
          - ImagePullBackOff
          - ErrImagePull
          - CreateContainerConfigError
          - CreateContainerError
          - InvalidImageName
          - OOMKilled
          - ContainerCannotRun
          - StartError
        name: PodLifeTime
      plugins:
        balance:
          enabled:
          - RemoveDuplicates
          - RemovePodsViolatingTopologySpreadConstraint
          - LowNodeUtilization
        deschedule:
          enabled:
          - RemovePodsViolatingInterPodAntiAffinity
          - RemovePodsViolatingNodeAffinity
          - RemovePodsViolatingNodeTaints
          - RemovePodsHavingTooManyRestarts
    - name: actual-usage
      pluginConfig:
      - args:
          labelSelector:
            matchExpressions:
            - key: batch.kubernetes.io/controller-uid
              operator: DoesNotExist
          namespaceLabelSelector:
            matchExpressions:
            - key: kubernetes.io/metadata.name
              operator: NotIn
              values:
              - arc-runners
          nodeFit: true
          podProtections:
            config:
              PodsWithPVC:
                protectedStorageClasses:
                - name: local-path
            defaultDisabled:
            - PodsWithLocalStorage
            extraEnabled:
            - PodsWithPVC
        name: DefaultEvictor
      - args:
          metricsUtilization:
            source: KubernetesMetrics
          targetThresholds:
            cpu: 90
            memory: 90
          thresholds:
            cpu: 70
            memory: 70
          useDeviationThresholds: false
        name: LowNodeUtilization
      plugins:
        balance:
          enabled:
          - LowNodeUtilization
