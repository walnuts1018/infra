  name: headlamp
  namespace: headlamp
  labels:
    helm.sh/chart: headlamp-0.44.0
    app.kubernetes.io/name: headlamp
    app.kubernetes.io/instance: headlamp
    app.kubernetes.io/version: "0.44.0"
    app.kubernetes.io/managed-by: Helm
spec:
  parentRefs:
